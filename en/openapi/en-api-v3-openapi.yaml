openapi: 3.1.0
info:
  title: ER:LC Russia API V3
  description: "ER:LC Russia API for servers, users, CDN, redirects, subscriptions, and access keys."
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
- url: https://api.erlcrussia.xyz/v3
tags:
- name: ER:LC Server
  description: Obtaining status, online, lists of players and staff of the ER:LC server.
- name: ER:LC Teams
  description: Sending and queuing in-game server commands (:h, :m, :kick, :ban, etc.).
- name: Economics
  description: Interaction with the economic system (users, businesses, mafias, stores, advertising).
- name: Statistics API
  description: High-performance obtaining statistics of discord servers and game servers (online, participants,
    bots).
- name: Verification API
  description: Search and comparison of Discord ID and Roblox ID accounts.
- name: CDN Assets
  description: Load, manage, statistic and clear MinIO/Edge CDN object storage file cache.
- name: CDN Folders
  description: Hierarchical structure and sorting of CDN media library folders.
- name: Punishment API
  description: Manage the balance and transaction history of players' points.
- name: Subscriptions API
  description: Catalog of plans, FunPay orders, accrual of benefits and activation of subscriptions.
- name: Authorization API
  description: Login via Discord and Roblox OAuth2, manage user sessions and link accounts.
- name: State API
  description: Monitoring the performance of the service, connections to PostgreSQL and Redis.
paths:
  /erlc/server:
    get:
      tags:
      - ER:LC Server
      summary: Information about the ER:LC Server
      description: 'Returns general information about the ER:LC server (name, current online, maximum limit, status).

        Using query parameters, you can optionally request lists of players, personnel, queue, logs of entries/exits,
        kills and teams.'
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Enable a detailed list of players on the server.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Include a list of staff and moderators (Admins, Mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Enable login and logout.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Enable connection waiting queue state.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Enable kill log.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Enable log of executed commands.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Enable active moderation calls.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Include a list of spawned vehicles.
        schema:
          type: boolean
      responses:
        '200':
          description: Successful response with server data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCServerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:LC Server
      summary: List of Server Bans
      description: Returns the current list of blocked users on the ER:LC server.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: List of banned users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ERLCBanItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - ER:LC Teams
      summary: Executing a Command on the Server
      description: 'Sends a command to the ER:LC server (for example, `:h Сообщение`, `:m Внимание`, `:kick Nick`,
        `:ban Nick`).

        For temporary network PRC errors (codes 1001, 1002, 9999), the command is automatically placed in the retry
        queue.'
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - command
              properties:
                command:
                  type: string
                  description: Command text with a colon (for example, ":m The server is rebooting").
                  example: :m Внимание, плановый рестарт через 5 минут
      responses:
        '200':
          description: The command was successfully sent to the server or queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCCommandResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - Economics
      summary: Getting Economic Data
      description: Summary data of the financial system Economy (total turnover, taxes, treasury).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Economic data.
    post:
      tags:
      - Economics
      summary: Changing Economy Parameters
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful update.
  /civops/users:
    get:
      tags:
      - Economics
      summary: User Profile in Economics
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Player profile data.
    post:
      tags:
      - Economics
      summary: Modification of User Profile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profile updated.
  /civops/businesses:
    get:
      tags:
      - Economics
      summary: List of Businesses
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of registered enterprises.
    post:
      tags:
      - Economics
      summary: Creating/Editing Business
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The operation is completed.
  /civops/mafias:
    get:
      tags:
      - Economics
      summary: Criminal Organization Data
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of mafias and groups.
    post:
      tags:
      - Economics
      summary: Group Management
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Operation status.
  /civops/government:
    get:
      tags:
      - Economics
      summary: Data from government agencies and treasury
      security:
      - BearerAuth: []
      responses:
        '200':
          description: State of the state budget and departments.
    post:
      tags:
      - Economics
      summary: Changing the Parameters of State Structures
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Settings have been updated.
  /civops/store:
    get:
      tags:
      - Economics
      summary: Economy Goods Store
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Catalog of store goods.
    post:
      tags:
      - Economics
      summary: Purchasing/Product Management
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The result of the transaction.
  /civops/ads:
    get:
      tags:
      - Economics
      summary: List of Advertisements
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Active advertising campaigns.
    post:
      tags:
      - Economics
      summary: Submitting an Advertisement
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The advertisement has been posted.
  /civops/system:
    get:
      tags:
      - Economics
      summary: System Information Economy
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Economy version and configuration.
  /civops/health:
    get:
      tags:
      - Economics
      summary: Availability Check Economy API
      security:
      - BearerAuth: []
      responses:
        '200':
          description: The economy service is active.
  /stats:
    get:
      tags:
      - Statistics API
      summary: Universal Server Statistics
      description: 'High-performance endpoint for monitoring Discord guilds and ER:LC game servers.

        Supports multiple `servers` and `metrics` parameters (including duplicate query parameters):

        - `membercount` - online participants;

        - `allmembercount` — total number of server participants;

        - `botcount` — number of bots;

        - `playercount` - current online players in ER:LC.'
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Server names. Select one or more servers from the drop-down list:

          - `MRP` - Moscow RolePlay (supports all 4 metrics)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` - support `membercount`, `allmembercount`, `botcount`

          - `DOT` - only supports `membercount`'
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Types of metrics requested:

          - `playercount` - online players in the game ER:LC (**available ONLY for `MRP`**)

          - `membercount` - number of Discord members online (available to everyone)

          - `allmembercount` - the total number of participants in the Discord server (all except `DOT`)

          - `botcount` - number of bots on the server (all except `DOT`)'
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
        example:
        - playercount
      responses:
        '200':
          description: An object with statistics for each server and the requested metrics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: integer
                example:
                  MRP:
                    membercount: 1450
                    playercount: 38
                  MVD:
                    membercount: 320
                    playercount: 12
        '400':
          $ref: '#/components/responses/BadRequestError'
  /users:
    get:
      tags:
      - Verification API
      summary: Finding Links Discord ID <-> Roblox ID
      description: 'Quickly search for a linked account by single or batch identifiers. Pass IDs as strings: numeric
        Discord snowflake loses precision in JavaScript. GET with one singular parameter returns an object; plural
        and POST parameters always return an array. Missing connections in batch are skipped, order is not guaranteed.
        Empty batch: HTTP 200 and []. Single missing connection: HTTP 404.'
      parameters:
      - name: discordId
        in: query
        description: Discord user ID.
        schema:
          type: string
      - name: robloxId
        in: query
        description: Roblox User ID.
        schema:
          type: string
      - name: discordIds
        in: query
        description: Multiple Discord IDs separated by commas.
        schema:
          type: string
      - name: robloxIds
        in: query
        description: Multiple Roblox IDs separated by commas.
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersLookupResponse'
              examples:
                single:
                  value:
                    robloxId: '123456789'
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: The connection was not found with a single GET.
      security:
      - ApiKeyHeader: []
    post:
      tags:
      - Verification API
      summary: Batch Search
      description: 'Batch search for users via JSON request body. Pass IDs as strings: numeric Discord snowflake
        loses precision in JavaScript. GET with one singular parameter returns an object; plural and POST parameters
        always return an array. Missing connections in batch are skipped, order is not guaranteed. Empty batch:
        HTTP 200 and []. Single missing connection: HTTP 404.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discordIds:
                  type: array
                  items:
                    type: string
                robloxIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items: &id005
                  type: object
                  properties:
                    discordId: &id001
                      type: string
                    robloxId: *id001
                  required:
                  - discordId
                  - robloxId
              examples:
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: The connection was not found with a single GET.
      security:
      - ApiKeyHeader: []
  /cdn/manifest:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - CDN Assets
      summary: Storage File Manifest
      description: 'Snapshot metadata namespace: success, count, domain, assets. Maximum 10,000 assets; for a complete
        large catalog, use GET /cdn/assets pagination.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Namespace. `default` is our general or client domain.
        schema:
          type: string
        example: acme
      responses:
        '200':
          description: List of namespace assets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  domain:
                    type: string
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/CdnAsset'
              examples:
                manifest_ok:
                  summary: Manifest ok
                  value:
                    success: true
                    count: 1
                    domain: default
                    assets:
                    - name: Инструкция
                      slug: manual.png
                      domain: default
                      path: docs/manual.png
                      fullPath: default/docs/manual.png
                      full_path: default/docs/manual.png
                      folderId: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      folder_id: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      sourceType: LOCAL
                      source_type: LOCAL
                      sourceUrl: default/docs/manual.png
                      source_url: default/docs/manual.png
                      isPinned: true
                      is_pinned: 1
                      mimeType: image/png
                      mime_type: image/png
                      size: 70
                      sha256: c2153f77e11087fcb078ae38527fa83bef29791e3700e30cc87fec4405a66d0f
                      downloads: 0
                      createdAt: '2026-10-06T14:56:09.0798434Z'
                      created_at: '2026-10-06T14:56:09.0798434Z'
                      updatedAt: '2026-10-06T14:56:09.0798434Z'
                      updated_at: '2026-10-06T14:56:09.0798434Z'
                      folder:
                        name: Документы
                        slug: docs
        '401':
          description: Unauthorized (401) - the key was not transferred.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: Forbidden (403) - there is a key, but not enough rights.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: Request limit has been reached. Consider Retry-After and retry_after; Don't run unlimited
            parallel downloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
                retry_after: 30
                details:
                  count: 21
                  excess: 1
                  limit: 20
                  reset_at: 1792083600000
  /cdn/assets:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - CDN Assets
      summary: List of Assets
      description: 'Without path: assets, pagination, stats, success. With exact path without ids and prefix: asset,
        success. limit defaults to 50, maximum 100. totalPages minimum 1 even for an empty result.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Namespace (first segment of the file path).
        schema:
          type: string
        example: acme
      - name: path
        in: query
        required: false
        description: The exact path of the asset within the namespace.
        schema:
          type: string
        example: branding/logo.png
      - name: prefix
        in: query
        required: false
        description: Path prefix for selecting a group of files.
        schema:
          type: string
        example: branding/
      - name: folderId
        in: query
        required: false
        description: 'UI folder ID. Folder is only a visual grouping and does not affect the file path.

          `root` or `null` - files without a folder, `all` - without a filter.'
        schema:
          type: string
        example: root
      - name: search
        in: query
        required: false
        description: Search by name, slug and full path.
        schema:
          type: string
      - name: sourceType
        in: query
        required: false
        description: Filter by source type.
        schema:
          type: string
          enum:
          - LOCAL
          - EXTERNAL
          - all
      - name: isPinned
        in: query
        required: false
        description: Filter by pinning.
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        description: Page number starting from 1.
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        description: Number of elements per page, maximum 100.
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success: &id002
                      type: boolean
                    asset:
                      $ref: '#/components/schemas/CdnAsset'
                  required:
                  - success
                  - asset
                - type: object
                  properties:
                    success: *id002
                    assets:
                      type: array
                      items:
                        $ref: '#/components/schemas/CdnAsset'
                    pagination:
                      type: object
                      properties:
                        page: &id003
                          type: integer
                        limit: *id003
                        total: *id003
                        totalPages: *id003
                    stats:
                      $ref: '#/components/schemas/CdnStats'
                  required:
                  - success
                  - assets
                  - pagination
                  - stats
              examples:
                emptyList:
                  value:
                    success: true
                    assets: []
                    pagination:
                      page: 1
                      limit: 50
                      total: 0
                      totalPages: 1
                    stats:
                      totalAssets: 0
                      total_assets: 0
                      totalFolders: 0
                      total_folders: 0
                      pinnedAssets: 0
                      pinned_assets: 0
                      localAssets: 0
                      local_assets: 0
                      externalAssets: 0
                      external_assets: 0
                      totalBytes: 0
                      total_bytes: 0
                      totalDownloads: 0
                      total_downloads: 0
        '401':
          description: Unauthorized (401) - the key was not transferred.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: Forbidden (403) - there is a key, but not enough rights.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '404':
          description: Not Found (404) - resource not found.
          content:
            application/json:
              examples:
                asset_not_found:
                  summary: Asset not found
                  value:
                    code: 5041
                    message: Asset Not Found
        '429':
          description: Request limit has been reached. Consider Retry-After and retry_after; Don't run unlimited
            parallel downloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
                retry_after: 30
                details:
                  count: 21
                  excess: 1
                  limit: 20
                  reset_at: 1792083600000
    post:
      tags:
      - CDN Assets
      summary: File Upload
      description: 'Load multipart/form-data with the file field. Do not set Content-Type manually: the client must
        add a boundary. domain and path can be passed to multipart; explicit multipart domain takes precedence over
        query. For chunks use compress=false and MIME text/javascript or text/css. The _next/static path and _app.js
        names are supported. HTTP response 200, not 201. Retrying an obviously busy path returns 409 without rewriting.
        File maximum 250 MiB. compress defaults to true: JPEG/PNG up to 24 megapixels; videos require FFmpeg/FFprobe.
        The optimization result is saved only if it is smaller than the original.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Namespace. `default` is our common namespace, or the client’s domain for his own files.
        schema:
          type: string
        example: client.ru
      - name: path
        in: query
        required: false
        description: Arbitrary path within the namespace.
        schema:
          type: string
        example: branding/logo.png
      - name: folderId
        in: query
        required: false
        description: UI folder ID for grouping. Does not affect the path.
        schema:
          type: string
      - name: slug
        in: query
        required: false
        description: File name, used if `path` is not specified.
        schema:
          type: string
        example: logo.png
      - name: autoFolders
        in: query
        required: false
        description: Create a UI folder in the first segment of the path if `folderId` is not passed.
        schema:
          type: boolean
        example: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File, maximum 250 MB.
                name:
                  type: string
                  description: Display name. The default is the file name.
                slug:
                  type: string
                  description: File name if `path` is not specified.
                path:
                  type: string
                  description: Arbitrary path if `folderId` and `slug` are not specified.
                domain:
                  type: string
                  default: default
                folderId:
                  type: string
                isPinned:
                  type: boolean
                autoFolders:
                  type: boolean
      responses:
        '200':
          description: The asset has been created, cache warming has been sent to edge.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  asset:
                    $ref: '#/components/schemas/CdnAsset'
              examples:
                asset_created_ok:
                  summary: Asset created ok
                  value:
                    asset:
                      name: Инструкция
                      slug: manual.png
                      domain: default
                      path: docs/manual.png
                      fullPath: default/docs/manual.png
                      full_path: default/docs/manual.png
                      folderId: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      folder_id: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      sourceType: LOCAL
                      source_type: LOCAL
                      sourceUrl: default/docs/manual.png
                      source_url: default/docs/manual.png
                      isPinned: true
                      is_pinned: 1
                      mimeType: image/png
                      mime_type: image/png
                      size: 70
                      sha256: c2153f77e11087fcb078ae38527fa83bef29791e3700e30cc87fec4405a66d0f
                      downloads: 0
                      createdAt: '2026-10-06T14:56:09.0798434Z'
                      created_at: '2026-10-06T14:56:09.0798434Z'
                      updatedAt: '2026-10-06T14:56:09.0798434Z'
                      updated_at: '2026-10-06T14:56:09.0798434Z'
                      folder:
                        name: Документы
                        slug: docs
                    success: true
        '400':
