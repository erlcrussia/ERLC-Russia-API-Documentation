  /keys:
    get:
      tags:
      - API Keys
      summary: Obtaining Keys and Restrictions
      description: "A universal endpoint for obtaining a list of API and WebSocket tokens, as well as their restrictions.\n\
        To execute a request, you need to pass one of the query parameters `api=true` or `websocket=true`.\nTo enable\
        \ permission restrictions for a key, pass the `restrictions=true` parameter after the appropriate type (for\
        \ example, `?api=true&restrictions=true` or `?api=true&restrictions=true&websocket=true&restrictions=true`).\n\
        \ The response contains the owner's private keys, including his other servers. Do not call from a browser\
        \ application and do not log the response. The restrictions array reflects explicitly allowed entries, rather\
        \ than the full effective access policy."
      parameters:
      - name: api
        in: query
        description: Request a list of HTTP API tokens
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Request a list of WebSocket tokens
        schema:
          type: boolean
        example: true
      - name: restrictions
        in: query
        description: Enable rights restrictions (specified after api or websocket)
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: List of requested keys (array or object when requesting api and websocket simultaneously).
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ApiKeyItem'
                - type: array
                  items:
                    $ref: '#/components/schemas/WebSocketKeyItem'
                - type: object
                  properties:
                    api:
                      type: array
                      items:
                        $ref: '#/components/schemas/ApiKeyItem'
                    websocket:
                      type: array
                      items:
                        $ref: '#/components/schemas/WebSocketKeyItem'
              examples:
                api_only:
                  summary: Request only API keys (?api=true&restrictions=true)
                  value:
                  - id: '1'
                    key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    userId: '403258784102940682'
                    serverId: srv_8f9a2b1c4e
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      endpoints:
                      - erlc.server
                      - civops.economy
                      versions:
                      - v3
                      queryParams:
                      - Players
                      - Staff
                      actions:
                      - webhook:add
                      - logs:read
                websocket_only:
                  summary: Request only WebSocket keys (?websocket=true&restrictions=true)
                  value:
                  - id: '1'
                    key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    userId: '403258784102940682'
                    serverId: srv_3d5e7f9a1b
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      channels:
                      - server:players
                      - server:logs
                      blockedIPs: []
                both:
                  summary: Request of both types (?api=true&websocket=true)
                  value:
                    api:
                    - id: '1'
                      key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      userId: '403258784102940682'
                      serverId: srv_8f9a2b1c4e
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
                    websocket:
                    - id: '1'
                      key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      userId: '403258784102940682'
                      serverId: srv_3d5e7f9a1b
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - API Keys
      summary: Key Regeneration
      description: 'Universal endpoint for regenerating API and/or WebSocket tokens.

        Requires passing at least one query parameter `api=true` or `websocket=true`.

        The previous token is canceled, and all restrictions and bindings are automatically transferred to the new
        token.'
      parameters:
      - name: api
        in: query
        description: Regenerate HTTP API key
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
