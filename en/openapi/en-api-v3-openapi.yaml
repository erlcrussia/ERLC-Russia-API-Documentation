        description: Discord user ID (if not specified, taken from the session).
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Information about limits and active statuses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  discordId:
                    type: string
                    example: '403258784102940682'
                  violationLimit:
                    type: integer
                    example: 50
                  hasVip:
                    type: boolean
                    example: false
                  hasPremium:
                    type: boolean
                    example: true
                  hasBooster:
                    type: boolean
                    example: false
                  hasTverskaya:
                    type: boolean
                    example: true
                  hasKreml:
                    type: boolean
                    example: false
  /subscriptions/user-limits/{discordId}:
    get:
      tags:
      - Subscriptions API
      summary: Points Limits by Discord ID
      description: Returns violation limits and privilege flags for a specific Discord ID.
      parameters:
      - name: discordId
        in: path
        required: true
        schema:
          type: string
        description: Discord user ID.
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: User limits.
  /subscriptions/coins/balance:
    get:
      tags:
      - Subscriptions API
      summary: User E-Coins Balance
      description: Returns the current E-Coins internal currency balance for the specified Discord ID or current
        session.
      parameters:
      - name: discordId
        in: query
        required: false
        schema:
          type: string
        description: Discord user ID (if not specified, taken from the session).
      security:
      - CookieAuth: []
      responses:
        '200':
          description: E-Coins balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  discordId:
                    type: string
                    example: '403258784102940682'
                  coins:
                    type: integer
                    example: 1250
  /auth/discord:
    get:
      tags:
      - Authorization API
      summary: Authorization via Discord
      description: Initializes the Discord OAuth2 flow and redirects the user to the Discord consent page.
      responses:
        '302':
          description: Redirect to discord.com/oauth2/authorize.
  /auth/discord/callback:
    get:
      tags:
      - Authorization API
      summary: Discord OAuth2 Callback
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Setting the `erlc_auth` cookie and redirecting to your personal account.
  /auth/roblox:
    get:
      tags:
      - Authorization API
      summary: Authorization via Roblox
      description: Initializes Roblox OAuth2 flow. Supports the `token` parameter for verification from a Discord
        bot.
      parameters:
      - name: token
        in: query
        description: HMAC bot token for session binding.
        schema:
          type: string
      responses:
        '302':
          description: Redirect to roblox.com/oauth/v1/authorize.
  /auth/roblox/callback:
    get:
      tags:
      - Authorization API
      summary: Roblox OAuth2 Callback
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to `https://erlcrussia.com/<lang>/login` (if successful) or `.../login/roblox` (if
            error).
  /auth/session:
    get:
      tags:
      - Authorization API
      summary: User Session Check
      description: Checks the validity of the session token from the `erlc_auth` cookie or header.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Active session and profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
  /auth/me:
    get:
      tags:
      - Authorization API
      summary: Current Authorized User Profile
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Profile data (Discord, Roblox, roles, avatar).
  /auth/logout:
    post:
      tags:
      - Authorization API
      summary: Ending a session
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Session deleted, cookies cleared.
  /auth/user/roblox:
    post:
      tags:
      - Authorization API
      summary: Roblox Account Linking
      security:
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - robloxId
              - robloxName
              properties:
                discordId:
                  type: string
                robloxId:
                  type: string
                robloxName:
                  type: string
                robloxDisplayName:
                  type: string
                robloxAvatar:
                  type: string
      responses:
        '200':
          description: Roblox account is linked.
    delete:
      tags:
      - Authorization API
      summary: Unlinking Roblox Account
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Roblox account has been unlinked.
  /auth/user/roblox/refresh:
    patch:
      tags:
      - Authorization API
      summary: Updating Roblox Profile Cache
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Roblox data and avatar updated.
  /auth/user/sessions:
    get:
      tags:
      - Authorization API
      summary: List of Active User Sessions
      description: Returns a list of all active browser and API sessions with IP addresses and devices.
      security:
      - CookieAuth: []
      responses:
        '200':
          description: List of sessions.
    delete:
      tags:
      - Authorization API
      summary: Ending All Other Sessions
      security:
      - CookieAuth: []
      responses:
        '200':
          description: All sessions except the current one have ended.
  /auth/user/sessions/{id}:
    delete:
      tags:
      - Authorization API
      summary: Review of a Specific Session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - CookieAuth: []
      responses:
        '200':
          description: The session has been revoked.
  /auth/user/roblox/reverify:
    patch:
      tags:
      - Authorization API
      summary: Roblox Reset for Re-Verification
      description: Unlinks the linked Roblox account from the current session to undergo re-verification.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: The binding has been reset.
  /auth/user/profile:
    patch:
      tags:
      - Authorization API
      summary: Synchronizing your Profile with Discord
      description: Forces a request for the current avatar, avatar decoration, and username from the Discord API
        and updates the entry in the database.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Profile has been successfully updated.
  /ai/credits/balance:
    get:
      tags:
      - AI Studio
      summary: AI credit balance
      description: Returns the balance of AI credits, coins, exchange rate (1 Coin = 1 AI Credit) and pricing scale
        (niya-1, emmy-1, hubert-1) for the owner of the transferred API key.
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: Balance of credits and coins.
        '401':
          description: Not authorized.
  /ai/credits/exchange:
    post:
      tags:
      - AI Studio
      summary: Exchange coins for AI credits
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - coins
              properties:
                coins:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Coins exchanged (success, exchanged_coins, credits_added, new_credits, remaining_coins).
  /ai/keys:
    get:
      tags:
      - AI Studio
      summary: List of AI keys
      description: Returns keys of the form sk-agent-*/sk-chat-*/sk-voice-* of the current user (id, token, name,
        scope, created_at, is_active, tools_enabled).
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: List of keys.
    post:
      tags:
      - AI Studio
      summary: Creating an AI Key
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Studio Key
                scope:
                  type: string
                  enum:
                  - agent
                  - chat
                  - voice
      responses:
        '200':
          description: The key has been created (id, token, name, scope, created_at, is_active, tools_enabled).
    delete:
      tags:
      - AI Studio
      summary: Removing an AI key (via Header / Body / Query)
      description: Deletes the current user's AI key. The deletion key can be passed in the `target-api-key` (or
        `token`) header, in the JSON body `{"token":"..."}`, through the query parameter `?token=...`, or without
        parameters (to revoke the request key itself).
      parameters:
      - name: target-api-key
        in: header
        required: false
        description: Token of the deleted key
        schema:
          type: string
      - name: token
        in: query
        required: false
        description: Token of the deleted key
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: integer
      responses:
        '200':
          description: 'Key deleted ({success: true, deleted: true, token: "..."}).'
  /ai/keys/{id}:
    delete:
      tags:
      - AI Studio
      summary: Removing an AI key by ID/Token in a URL
      description: Removes the current user's AI key by token or numeric ID in the URL path.
      parameters:
      - name: id
        in: path
        required: true
        description: Key token (sk-chat-...) or numeric ID.
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: 'Key deleted ({success: true, deleted: true, token: "..."}).'
  /ai/audio/pricing:
    get:
      tags:
      - AI Audio
      summary: Тарифы и ограничения голосового API
      description: Возвращает модель, стоимость, максимальную длительность и формат аудио для распознавания речи.
      responses:
        '200':
          description: Параметры голосового API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: {type: string}
                  credits_per_minute: {type: number}
                  speech_credits_per_1000_characters: {type: number}
                  speech_max_characters: {type: integer}
                  speech_voice: {type: string}
                  billing_unit: {type: string}
                  max_duration_seconds: {type: integer}
                  format: {type: string}
  /ai/audio/transcriptions:
    post:
      tags:
      - AI Audio
      summary: Распознавание речи
      description: Принимает WAV в mono PCM 16-bit 16000 Hz длительностью до 120 секунд. Нужен AI-ключ с правом voice.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          default: ru
      responses:
        '200':
          description: Распознанный текст и сведения о списании кредитов.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: {type: string}
                  model: {type: string}
                  duration_seconds: {type: number}
                  credits_charged: {type: number}
        '400':
          description: Некорректный или повреждённый WAV-файл.
        '401':
          description: AI-ключ отсутствует или недействителен.
        '413':
          description: Аудио длиннее 120 секунд.
        '415':
          description: Требуется Content-Type audio/wav.
        '503':
          description: Сервис распознавания недоступен.
  /ai/title:
    post:
      tags:
      - AI Studio
      summary: Chat title generation
      description: Generates a concise chat title (2-4 words). For user API keys, writes off AI credits according
        to tokens. Works unlimited with Master Key. An executive AI key does not provide rights to manage credits,
        other keys, CDNs, or redirects.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                locale:
                  type: string
                  default: ru
                model:
                  type: string
      responses:
        '200':
          description: Title generated ({title, success, cost_credits, usage}).
  /ads/upload:
    post:
      tags:
      - Рекламные кампании V3
      summary: Загрузка баннера рекламы
      description: Загружает изображение баннера на images.erlcrussia.com (максимум 5 МБ, форматы PNG, JPEG, WebP, GIF, AVIF).
      security:
      - CookieAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Баннер успешно загружен.
          content:
            application/json:
              schema:
                type: object
                required: [bannerUrl, size, mimeType, domain, path]
                properties:
                  bannerUrl: {type: string, example: "https://images.erlcrussia.com/ads/banners/0123456789abcdef.png"}
                  size: {type: integer, example: 245000}
                  mimeType: {type: string, example: "image/png"}
                  domain: {type: string, example: "images.erlcrussia.com"}
                  path: {type: string, example: "ads/banners/0123456789abcdef.png"}
        '400':
          description: Недопустимый формат файла или повреждённые данные.
        '401':
          description: Требуется авторизация пользователя.
        '413':
          description: Размер файла превышает 5 МБ.

  /ads/campaigns:
    get:
      tags:
      - Рекламные кампании V3
      summary: Список рекламных кампаний
      description: Возвращает все рекламные кампании текущего пользователя.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Список кампаний.
          content:
            application/json:
              schema:
                type: object
                required: [campaigns]
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdCampaign'
    post:
      tags:
      - Рекламные кампании V3
      summary: Создание рекламной кампании
      description: Создаёт новую заявку на рекламную кампанию со списанием 10 eCoins за модерацию.
      security:
      - CookieAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, bannerUrl, targetUrl]
              properties:
                title: {type: string, example: "Сервер Moscow RP"}
                bannerUrl: {type: string, example: "https://images.erlcrussia.com/ads/banners/0123456789abcdef.png"}
                targetUrl: {type: string, example: "https://discord.gg/moscowrp"}
                buttonText: {type: string, example: "Присоединиться"}
                placement: {type: string, enum: [all, bot, site], default: all}
      responses:
        '201':
          description: Кампания успешно создана и ожидает модерации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaign'
        '400':
          description: Ошибка валидации параметров.
        '402':
          description: Недостаточно eCoins для оплаты модерации (требуется 10 eCoins).

  /ads/campaigns/{id}:
    get:
      tags:
      - Рекламные кампании V3
      summary: Получение рекламной кампании
      description: Возвращает детальную информацию о рекламной кампании по её идентификатору.
      security:
      - CookieAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        example: "camp_0123456789abcdef"
      responses:
        '200':
          description: Информация о кампании.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaign'
        '403':
          description: Доступ запрещён (кампания принадлежит другому пользователю).
        '404':
          description: Кампания не найдена.

  /ads/campaigns/{id}/buy:
    post:
      tags:
      - Рекламные кампании V3
      summary: Покупка показов рекламы
      description: Покупка пакета показов за eCoins для одобренной модератором кампании.
      security:
      - CookieAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        example: "camp_0123456789abcdef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [impressions, costCoins]
              properties:
                impressions: {type: integer, enum: [500, 1500, 5000, 10000], example: 1500}
                costCoins: {type: integer, enum: [45, 120, 350, 600], example: 120}
      responses:
        '200':
          description: Показы успешно начислены, кампания активирована.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaign'
        '400':
          description: Кампания ещё не одобрена модератором или выбран неверный пакет.
        '402':
          description: Недостаточно eCoins на балансе пользователя.

  /ads/campaigns/{id}/toggle:
    post:
      tags:
      - Рекламные кампании V3
      summary: Переключение активности кампании
      description: Приостанавливает (paused) или возобновляет (active) показ кампании при наличии доступных показов.
      security:
      - CookieAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        example: "camp_0123456789abcdef"
      responses:
        '200':
          description: Статус кампании переключён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaign'

  /ads/packages:
    get:
      tags:
      - Рекламные кампании V3
      summary: Пакеты показов и тарифы
      description: Возвращает список доступных пакетов показов и стоимость модерации в eCoins.
      responses:
        '200':
          description: Тарифы рекламы.
          content:
            application/json:
              schema:
                type: object
                required: [packages, moderationFeeCoins]
                properties:
                  packages:
                    type: array
                    items:
                      type: object
                      required: [impressions, costCoins]
                      properties:
                        impressions: {type: integer, example: 1500}
                        costCoins: {type: integer, example: 120}
                  moderationFeeCoins: {type: integer, example: 10}

  /ads/serve:
    get:
      tags:
      - Рекламные кампании V3
      summary: Выдача рекламного баннера
      description: Возвращает активный рекламный баннер для размещения (с проверкой подписчиков и ротацией).
      parameters:
      - name: placement
        in: query
        required: false
        schema: {type: string, enum: [all, bot, site], default: all}
      - name: userId
        in: query
        required: false
        schema: {type: string}
      - name: guildId
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: Рекламный баннер для показа.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, example: "camp_0123456789abcdef"}
                  title: {type: string, example: "Сервер Moscow RP"}
                  bannerUrl: {type: string, example: "https://images.erlcrussia.com/ads/banners/0123456789abcdef.png"}
                  targetUrl: {type: string, example: "https://discord.gg/moscowrp"}
                  buttonText: {type: string, example: "Присоединиться"}
                  placement: {type: string, example: "all"}
        '204':
          description: Реклама отключена (подписчик) или нет доступных кампаний.

  /ads/{id}/click:
    post:
      tags:
      - Рекламные кампании V3
      summary: Учёт клика по рекламе
      description: Фиксирует переход пользователя по рекламному баннеру и возвращает целевую ссылку.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        example: "camp_0123456789abcdef"
      - name: userId
        in: query
        required: false
        schema: {type: string}
      - name: guildId
        in: query
        required: false
        schema: {type: string}
      responses:
        '200':
          description: Клик учтён.
          content:
            application/json:
              schema:
                type: object
                required: [success, targetUrl]
                properties:
                  success: {type: boolean, example: true}
                  targetUrl: {type: string, example: "https://discord.gg/moscowrp"}
  /health:
    get:
      tags:
      - State API
      summary: Functionality check
      description: HTTP 503 only when the database is unavailable. Redis or game cache problems may return HTTP
        200 with status=degraded; check both values.
      responses:
        '200':
          description: The service is completely fine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Service is correct
                  value:
                    status: ok
                    version: v3
                    uptime: 1h59m5s
                    timestamp: '2026-09-14T12:44:52Z'
                    services:
                      database:
                        status: ok
                        ping: 3.19ms
                      redis:
                        status: ok
                        ping: 10.72ms
                      erlc_servers:
                        status: ok
                        servers:
                        - name: ER:LC Сервер 1
                          server_id: srv_8f9a2b1c4e
                          title: Moscow RolePlay I RU
                          status: ok
                          cache: ok
                          current_players: 1
                          max_players: 50
                          ttl: 9m50s
                          bans_cached: true
                        - name: ER:LC Сервер 2
                          server_id: srv_3d5e7f9a1b
                          title: Moscow RolePlay I Global
                          status: ok
                          cache: ok
                          current_players: 0
                          max_players: 50
                          ttl: 9m50s
                          bans_cached: true
        '503':
          description: The database or critical services are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                disconnected:
                  summary: Database connection failure
                  value:
                    status: degraded
                    version: v3
                    uptime: 1h59m5s
                    timestamp: '2026-09-14T12:44:52Z'
                    services:
                      database:
                        status: disconnected
                      redis:
                        status: ok
                        ping: 10.72ms
                      erlc_servers:
                        status: ok
