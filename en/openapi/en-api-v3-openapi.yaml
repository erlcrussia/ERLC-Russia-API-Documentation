        message:
          type: string
          example: Forbidden
          description: System error message in English.
    CdnAsset:
      type: object
      description: Organizational asset; domain/path and fullPath specify the MinIO key. folderId specifies the grouping.
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        domain:
          type: string
          description: Namespace, first path segment.
          example: default
        path:
          type: string
          description: A path within a namespace.
          example: branding/logo.png
        fullPath:
          type: string
          description: Full path `{domain}/{path}`.
          example: default/branding/logo.png
        full_path:
          type: string
        folderId:
          type:
          - string
          - 'null'
        folder_id:
          type:
          - string
          - 'null'
        folder:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
        sourceType:
          type: string
          enum:
          - LOCAL
          - EXTERNAL
        source_type:
          type: string
        sourceUrl:
          type: string
          description: For LOCAL - the object key in MinIO, for EXTERNAL - the original address.
        source_url:
          type: string
        isPinned:
          type: boolean
        is_pinned:
          type: integer
        mimeType:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          description: Size in bytes.
        sha256:
          type:
          - string
          - 'null'
        downloads:
          type: integer
          description: Always 0, files are sent by edge directly from MinIO.
        createdAt:
          type: string
        created_at:
          type: string
        updatedAt:
          type: string
        updated_at:
          type: string
        teamId:
          type: string
    CdnFolder:
      type: object
      description: Organization folder. Renaming and changing pathEnabled does not rewrite the URL of already downloaded files.
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        pathEnabled:
          type: boolean
          default: true
          description: Adds slug folders only to new downloads without an explicitly specified path. false leaves the folder as an interface group.
        sortOrder:
          type: integer
        sort_order:
          type: integer
        asset_count:
          type: integer
        createdAt:
          type: string
        created_at:
          type: string
        updatedAt:
          type: string
        updated_at:
          type: string
        teamId:
          type: string
    CdnStats:
      type: object
      description: Storage summary, separate statistics endpoint is not used.
      properties:
        totalAssets:
          type: integer
        total_assets:
          type: integer
        totalFolders:
          type: integer
        total_folders:
          type: integer
        pinnedAssets:
          type: integer
        pinned_assets:
          type: integer
        localAssets:
          type: integer
        local_assets:
          type: integer
        externalAssets:
          type: integer
        external_assets:
          type: integer
        totalBytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        totalDownloads:
          type: integer
          format: int64
        total_downloads:
          type: integer
          format: int64
    APIError:
      type: object
      properties:
        code: *id002
        message: *id008
        error: *id008
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
    CDNCustomDomain:
      type: object
      properties:
        id: *id008
        domain: *id008
        teamId:
          type:
          - string
          - 'null'
        scope: *id008
        type:
          type: string
          const: cdn
        userId:
          type:
          - string
          - 'null'
        isVerified: *id001
        cnameVerified: *id001
        cfStatus:
          type:
          - string
          - 'null'
        cfSslStatus:
          type:
          - string
          - 'null'
        cfCustomHostnameId:
          type:
          - string
          - 'null'
        originUrl:
          type:
          - string
          - 'null'
        deployHookToken:
          type:
          - string
          - 'null'
          writeOnly: false
        s3Backup: *id001
        ownershipName:
          type:
          - string
          - 'null'
        ownershipValue:
          type:
          - string
          - 'null'
        sslTxtName:
          type:
          - string
          - 'null'
        sslTxtValue:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _count:
          type: object
          properties:
            shortLinks: *id002
      required:
      - id
      - domain
      - isVerified
  responses:
    BadRequestError:
      description: Bad Request (400) - invalid request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_params:
              summary: Missing Parameters (5002)
              value:
                code: 5002
                message: Missing Parameters
            invalid_json:
              summary: Invalid JSON (5034)
              value:
                code: 5034
                message: Invalid Json
            invalid_param:
              summary: Invalid Param Name (5004)
              value:
                code: 5004
                message: Invalid Param Name
    UnauthorizedError:
      description: Unauthorized (401) — the API token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_token:
              summary: Missing Token (5007)
              value:
                code: 5007
                message: Missing Token
            invalid_token:
              summary: Invalid Token (5008)
              value:
                code: 5008
                message: Invalid Token
    ForbiddenError:
      description: Forbidden (403) - access is prohibited (key, action or server restrictions).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Forbidden (5009)
              value:
                code: 5009
                message: Forbidden
    NotFoundError:
      description: Not Found (404) — the requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              summary: Resource Not Found (5020)
              value:
                code: 5020
                message: Not Found
            token_not_found:
              summary: Token Not Found (5013)
              value:
                code: 5013
                message: Token Not Found
    RateLimitError:
      description: Too Many Requests (429) - the request limit has been exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limit:
              summary: Rate Limit Exceeded (5016)
              value:
                code: 5016
                message: Rate Limit Exceeded
    InternalServerError:
      description: Internal Server Error (500) - internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              summary: Internal Error (5017)
              value:
                code: 5017
                message: Internal Error
  parameters:
    XCacheRefresh:
      name: x-cache-refresh
      in: header
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      description: Forced reset of the economy Redis cache when set to "true".
