      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Token(s) have been successfully regenerated.
          content:
            application/json:
              schema:
                type: object
              examples:
                api_only:
                  summary: Regenerating only the API key (?api=true)
                  value:
                    success: true
                    message: API key regenerated successfully
                    oldToken: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    newToken: qR7tY1uI3oP5aS7dF9gH1jK3-srv_8f9a2b1c4e
                    token: qR7tY1uI3oP5aS7dF9gH1jK3-srv_8f9a2b1c4e
                    apiKey: qR7tY1uI3oP5aS7dF9gH1jK3-srv_8f9a2b1c4e
                    key: qR7tY1uI3oP5aS7dF9gH1jK3-srv_8f9a2b1c4e
                    userId: '403258784102940682'
                    serverId: srv_8f9a2b1c4e
                websocket_only:
                  summary: Regenerating only the WebSocket key (?websocket=true)
                  value:
                    success: true
                    message: WebSocket key regenerated successfully
                    oldToken: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    newToken: ws_m8K0lO2pQ4rS6tU8vW0xY2a4-srv_3d5e7f9a1b
                    token: ws_m8K0lO2pQ4rS6tU8vW0xY2a4-srv_3d5e7f9a1b
                    apiKey: ws_m8K0lO2pQ4rS6tU8vW0xY2a4-srv_3d5e7f9a1b
                    key: ws_m8K0lO2pQ4rS6tU8vW0xY2a4-srv_3d5e7f9a1b
                    userId: '403258784102940682'
                    serverId: srv_3d5e7f9a1b
                both:
