      description: Adds a new webhook URL for receiving events. If the key is limited to a specific ServerID, binding
        to other servers is automatically blocked (403 Forbidden).
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  example: https://my-bot.domain.com/erlc-events
                isActive:
                  type: boolean
                  default: true
                  example: true
                serverIds:
                  type: array
                  items:
                    type: string
                  example:
                  - '12345678'
                description:
                  type: string
                  example: Live Kill Logs Hook
      responses:
        '201':
          description: The webhook has been successfully registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Вебхук успешно добавлен
                  discord_id:
                    type: string
                    example: '403258784102940682'
        '403':
          description: It is prohibited to bind a webhook to this server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Вам запрещено привязывать вебхук к серверу '999999'. Разрешенный сервер для вашего
                      ключа '12345678'
                  forbidden_server_id:
