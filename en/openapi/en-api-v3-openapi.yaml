components:
  securitySchemes:
    AIManagementKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Regular user API key for managing loans and AI keys; executive sk-chat/sk-agent/sk-voice are
        not allowed.
    AIExecutionKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Executive sk-chat/sk-agent/sk-voice key according to the method.
    BearerAuth:
      type: http
      scheme: bearer
      description: API key in the Authorization header in the format `Bearer <token>`.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-key
      description: Custom API key. Store on the server; do not include client-side JavaScript.
    WebSocketKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-websocket-key
      description: Single WebSocket key header erlcrussia-websocket-key.
    CookieAuth:
      type: apiKey
      in: cookie
      name: erlc_auth
      description: Session HTTP-Only authorization cookie on the portal.
    CDNDeployToken:
      type: apiKey
      in: header
      name: erlcrussia-api-cdn-token
      description: A separate deploy token for a verified CDN domain.
  schemas:
    UserAsset:
      type: object
      required:
      - id
      - domain
      - path
      - name
