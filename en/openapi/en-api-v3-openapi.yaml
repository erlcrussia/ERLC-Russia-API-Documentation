openapi: 3.1.0
info:
  title: ER:LC Russia API V3
  description: ER:LC Russia API for servers, users, CDN, redirects, subscriptions, and access keys.
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
  description: Production server (com)
- url: https://api.erlcrussia.xyz/v3
  description: Backup server (xyz)
tags:
- name: ER:LC Server
  description: Obtaining status, online, lists of players and staff of the ER:LC server.
- name: ER:LC Teams
  description: Sending and queuing in-game server commands (:h, :m, :kick, :ban, etc.).
- name: Economics
  description: Interaction with the economic system (users, businesses, mafias, stores, advertising).
- name: Statistics API
  description: High-performance obtaining statistics of discord servers and game servers (online, participants, bots).
- name: Verification API
  description: Search and comparison of Discord ID and Roblox ID accounts.
- name: CDN Assets
  description: Load, manage, statistic and clear MinIO/Edge CDN object storage file cache.
- name: CDN Folders
  description: Hierarchical structure and sorting of CDN media library folders.
- name: Punishment API
  description: Manage the balance and transaction history of players' points.
- name: Subscriptions API
  description: Catalog of plans, FunPay orders, accrual of benefits and activation of subscriptions.
- name: Authorization API
  description: Login via Discord and Roblox OAuth2, manage user sessions and link accounts.
- name: Management API - WebSocket Keys
  description: Managing access keys to the WebSocket gateway and channel subscriptions.
- name: Management API - Webhooks
  description: Registration, accessibility validation and monitoring of custom webhooks.
- name: Control API - Panel
  description: Management of users, subscriptions, tariffs, manual balance and system statistics.
- name: State API
  description: Monitoring the performance of the service, connections to PostgreSQL and Redis.
- name: AI Audio
- name: AI Studio
- name: AI administration
- name: API Keys
- name: Admin API - Servers
- name: Administration of E-Coins
- name: CDN
- name: CDN Domains
- name: CDN V3
- name: Custom Webhooks
- name: Management API - Servers
- name: Management API - Tokens
- name: Organization redirects V3
- name: Private files and library
- name: Рекламные кампании V3
paths:
  /erlc/server:
    get:
      tags:
      - ER:LC Server
      summary: Information
      description: Server name, online count and status. Query parameters add players, staff, queue and logs.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Включить детальный список игроков на сервере.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Включить список сотрудников и модераторов (Admins, Mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Включить журнал входов и выходов.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Включить состояние очереди ожидания подключения.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Включить журнал убийств.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Включить журнал выполненных команд.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Включить активные вызовы модераторов.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Включить список заспавненных транспортных средств.
        schema:
          type: boolean
      responses:
        '200':
          description: Successful response with server data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Name:
                    type: string
                  OwnerId:
                    type: integer
                  CoOwnerIds:
                    type: array
                    items:
                      type: integer
                  CurrentPlayers:
                    type: integer
                  MaxPlayers:
                    type: integer
                  JoinKey:
                    type: string
                  AccVerifiedReq:
                    type: string
                  TeamBalance:
                    type: boolean
                  Players:
                    type: array
                    items:
                      type: object
                      properties:
                        Player:
                          type: string
                        Permission:
                          type: string
                        Callsign:
                          type: string
                        Team:
                          type: string
                  Queue:
                    type: array
                    items:
                      type: integer
              example:
                Name: Moscow RolePlay I RU
                OwnerId: 1234567
                CoOwnerIds:
                - 7654321
                CurrentPlayers: 32
                MaxPlayers: 40
                JoinKey: MRPRU
                AccVerifiedReq: Disabled
                TeamBalance: true
                Players:
                - Player: Builderman:156
                  Permission: Server Administrator
                  Callsign: 1-A-12
                  Team: Police
                Queue:
                - 261
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:LC Server
      summary: Server bans
      description: Banned players of the ER:LC server.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: List of banned users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  '156':
                    type: string
                  '261':
                    type: string
              example:
                '156': Builderman
                '261': Shedletsky
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - ER:LC Teams
      summary: Run a command
      description: Runs a command on the ER:LC server, for example `:h Message`. On a temporary ER:LC error the command is queued for retry.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: Текст команды с двоеточием (например, ":m Сервер перезагружается").
            example:
              command: :h Сервер перезапустится через 5 минут
      responses:
        '200':
          description: The command was successfully sent to the server or queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                  QueueSize:
                    type: integer
              example:
                Status: Queued
                QueueSize: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - Economics
      summary: 'Economy: player money'
      description: Player balance, the money leaderboard, rank and command cooldowns.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Economic data.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                cash: 15000
                bank: 82000
                rank: 14
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  cash:
                    type: integer
                  bank:
                    type: integer
                  rank:
                    type: integer
    post:
      tags:
      - Economics
      summary: 'Economy: money operations'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fromUserId:
                  type: string
                toUserId:
                  type: string
                amount:
                  type: integer
            example:
              fromUserId: '123456789012345678'
              toUserId: '234567890123456789'
              amount: 500
      responses:
        '200':
          description: Successful update.
          content:
            application/json:
              example:
                success: true
                fromUserId: '123456789012345678'
                toUserId: '234567890123456789'
                amount: 500
                newBalance:
                  cash: 14500
                  bank: 82000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  fromUserId:
                    type: string
                  toUserId:
                    type: string
                  amount:
                    type: integer
                  newBalance:
                    type: object
                    properties:
                      cash:
                        type: integer
                      bank:
                        type: integer
      description: Transfers, bank, adding, removing, resetting balance and cooldowns.
  /civops/users:
    get:
      tags:
      - Economics
      summary: 'Economy: player'
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Player profile data.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                inventory:
                - name: Аптечка
                  amount: 2
                  description: Восстанавливает здоровье
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  inventory:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: integer
                        description:
                          type: string
      description: A player inventory and transaction history.
    post:
      tags:
      - Economics
      summary: 'Economy: player inventory'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                item:
                  type: object
                  properties:
                    name:
                      type: string
                    amount:
                      type: integer
            example:
              userId: '123456789012345678'
              item:
                name: Аптечка
                amount: 1
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                amount: 1
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  amount:
                    type: integer
      description: Adding and removing items, clearing the inventory.
  /civops/businesses:
    get:
      tags:
      - Economics
      summary: 'Economy: businesses'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of registered enterprises.
          content:
            application/json:
              example:
                page: 1
                total: 1
                businesses:
                - id: B7K2Q9XZ
                  name: Кафе «Арбат»
                  form: ООО
                  status: active
                  owner_id: '123456789012345678'
                  owner_name: player
                  address: ул. Арбат, 10
                  bank: 120000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  businesses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        form:
                          type: string
                        status:
                          type: string
                        owner_id:
                          type: string
                        owner_name:
                          type: string
                        address:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Businesses: list, details, balance, employees, items, transfers, rating and requests.'
    post:
      tags:
      - Economics
      summary: 'Economy: business actions'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                amount:
                  type: integer
            example:
              businessId: B7K2Q9XZ
              amount: 5000
      responses:
        '200':
          description: The operation is completed.
          content:
            application/json:
              example:
                success: true
                businessId: B7K2Q9XZ
                added: 5000
                newBalance: 125000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  businessId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Requests, creating and deleting businesses, money, employees and items.
  /civops/mafias:
    get:
      tags:
      - Economics
      summary: 'Economy: mafias'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of mafias and groups.
          content:
            application/json:
              example:
                page: 1
                total: 1
                mafias:
                - id: M3X8P1
                  name: Солнцевские
                  leader_id: '123456789012345678'
                  leader_name: player
                  color: '#8B0000'
                  bank: 54000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  mafias:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        leader_id:
                          type: string
                        leader_name:
                          type: string
                        color:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Mafias: list, details, balance, members, transfers and logs.'
    post:
      tags:
      - Economics
      summary: 'Economy: mafia actions'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mafiaId:
                  type: string
                amount:
                  type: integer
            example:
              mafiaId: M3X8P1
              amount: 1000
      responses:
        '200':
          description: Operation status.
          content:
            application/json:
              example:
                success: true
                mafiaId: M3X8P1
                added: 1000
                newBalance: 55000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mafiaId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Creating and deleting mafias, money, transfers and members.
  /civops/government:
    get:
      tags:
      - Economics
      summary: 'Economy: budget'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: State of the state budget and departments.
          content:
            application/json:
              example:
                balance:
                  bank: 2500000
              schema:
                type: object
                properties:
                  balance:
                    type: object
                    properties:
                      bank:
                        type: integer
      description: Government budget balance and transfers.
    post:
      tags:
      - Economics
      summary: 'Economy: budget actions'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
            example:
              amount: 10000
      responses:
        '200':
          description: Settings have been updated.
          content:
            application/json:
              example:
                success: true
                added: 10000
                newBalance: 2510000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Adding to and taking from the budget, transfers to a player, business or mafia.
  /civops/store:
    get:
      tags:
      - Economics
      summary: 'Economy: store'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Catalog of store goods.
          content:
            application/json:
              example:
                count: 1
                items:
                - name: Аптечка
                  description: Восстанавливает здоровье
                  price_buy: 250
                  price_sell: 100
                  quantity: null
                  can_use: true
                  can_sell: true
                  createdAt: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        price_buy:
                          type: integer
                        price_sell:
                          type: integer
                        quantity:
                          type:
                          - string
                          - 'null'
                        can_use:
                          type: boolean
                        can_sell:
                          type: boolean
                        createdAt:
                          type: integer
      description: Items of the in-game store.
    post:
      tags:
      - Economics
      summary: 'Economy: store actions'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                itemName:
                  type: string
                quantity:
                  type: integer
            example:
              userId: '123456789012345678'
              itemName: Аптечка
              quantity: 2
      responses:
        '200':
          description: The result of the transaction.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                quantity: 2
                totalPrice: 500
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  quantity:
                    type: integer
                  totalPrice:
                    type: integer
      description: Adding and removing items, buying from and selling to the store.
  /civops/ads:
    get:
      tags:
      - Economics
      summary: 'Economy: ads'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Active advertising campaigns.
          content:
            application/json:
              example:
                count: 1
                ads:
                - id: 5
                  user_id: '123456789012345678'
                  username: player
                  business_name: Кафе «Арбат»
                  address: ул. Арбат, 10
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  ads:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: string
                        username:
                          type: string
                        business_name:
                          type: string
                        address:
                          type: string
                        created_at:
                          type: integer
      description: In-game ad requests (`action=list`).
    post:
      tags:
      - Economics
      summary: 'Economy: submit an ad'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                username:
                  type: string
                businessName:
                  type: string
                address:
                  type: string
            example:
              userId: '123456789012345678'
              username: player
              businessName: Кафе «Арбат»
              address: ул. Арбат, 10
      responses:
        '200':
          description: The advertisement has been posted.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                businessName: Кафе «Арбат»
                address: ул. Арбат, 10
                adSent: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  businessName:
                    type: string
                  address:
                    type: string
                  adSent:
                    type: boolean
      description: Creates an in-game ad request (`action=create`).
  /civops/system:
    get:
      tags:
      - Economics
      summary: 'Economy: summary'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Economy version and configuration.
          content:
            application/json:
              example:
                users: 5120
                businesses: 34
                mafias: 6
                governmentBalance: 2500000
                uptime: 86400.5
                memory:
                  rss: 152043520
                  heapTotal: 98304000
                  heapUsed: 71303168
                  external: 2097152
                timestamp: '2026-10-21T12:00:00.000Z'
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  businesses:
                    type: integer
                  mafias:
                    type: integer
                  governmentBalance:
                    type: integer
                  uptime:
                    type: number
                  memory:
                    type: object
                    properties:
                      rss:
                        type: integer
                      heapTotal:
                        type: integer
                      heapUsed:
                        type: integer
                      external:
                        type: integer
                  timestamp:
                    type: string
                    format: date-time
      description: Overall economy statistics and service uptime.
  /civops/health:
    get:
      tags:
      - Economics
      summary: 'Economy: health'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: The economy service is active.
          content:
            application/json:
              example:
                status: ok
                service: Economy API
                timestamp: '2026-10-21T12:00:00.000Z'
                uptime: 86400.5
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
      description: Whether the economy module is up. No key needed.
  /stats:
    get:
      tags:
      - Statistics API
      summary: Server statistics
      description: ER:LC online count and Discord server member counts. Several servers and metrics can be requested at once.
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Имена серверов. Выберите один или несколько серверов из выпадающего списка:

          - `MRP` — Moscow RolePlay (поддерживает все 4 метрики)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` — поддерживают `membercount`, `allmembercount`, `botcount`

          - `DOT` — поддерживает только `membercount`

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Типы запрашиваемых метрик:

          - `playercount` — онлайн игроков в игре ER:LC (**доступен ТОЛЬКО для `MRP`**)

          - `membercount` — количество участников Discord онлайн (доступен для всех)

          - `allmembercount` — общее число участников Discord сервера (все кроме `DOT`)

          - `botcount` — количество ботов на сервере (все кроме `DOT`)

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
        example:
        - playercount
      responses:
        '200':
          description: An object with statistics for each server and the requested metrics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: integer
                example:
                  MRP:
                    membercount: 1450
                    playercount: 38
                  MVD:
                    membercount: 320
                    playercount: 12
        '400':
          $ref: '#/components/responses/BadRequestError'
  /users:
    get:
      tags:
      - Verification API
      summary: Discord and Roblox links
      description: Finds the Roblox ID by Discord ID and the other way round. One ID returns an object, several return an array. Pass IDs as strings.
      parameters:
      - name: discordId
        in: query
        description: Discord ID пользователя.
        schema:
          type: string
      - name: robloxId
        in: query
        description: Roblox ID пользователя.
        schema:
          type: string
      - name: discordIds
        in: query
        description: Несколько Discord ID через запятую.
        schema:
          type: string
      - name: robloxIds
        in: query
        description: Несколько Roblox ID через запятую.
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  robloxId:
                    type: string
              example:
                robloxId: '156'
        '404':
          description: The connection was not found with a single GET.
      security:
      - ApiKeyHeader: []
    post:
      tags:
