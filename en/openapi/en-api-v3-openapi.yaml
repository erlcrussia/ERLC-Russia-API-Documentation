  /cdn/assets/purge:
    post:
      tags:
      - CDN Assets
      summary: Purge file cache
      description: 'Purges the cache of files by `ids`, `path` or `prefix`; without them, the whole namespace. `success` means the purge was accepted, not finished.


        Without ids/path/prefix, a whole-namespace purge runs in the background: HTTP 202, status=queued, acceptedCount counts selected assets, not completed work. One request per minute
        per team and namespace; respect Retry-After on 429. Completion or failure is recorded in the API audit log. Targeted purge keeps HTTP 200 and purgedCount. A new unique release URL
        usually needs no purge immediately after upload: doing so evicts the warmed cache.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Пространство имён.
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Точный путь ассета.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: Список ID ассетов. Передаётся только в теле запроса, не в query.
                  items:
                    type: string
            example:
              ids:
              - ast_7Kq2Zp
      responses:
        '200':
          description: The cache has been cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - path
                    - ids
                    - prefix
                  purgedCount:
                    type: integer
              examples:
                purge_ok:
                  summary: Purge ok
                  value:
                    success: true
                    domain: default
                    scope: ids
                    purgedCount: 1
        '401':
          description: Unauthorized (401) - the key was not transferred.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: Forbidden (403) - there is a key, but not enough rights.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: Request limit has been reached. Consider Retry-After; Don't run unlimited parallel downloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
        '202':
          description: 'Without ids/path/prefix, a whole-namespace purge runs in the background: HTTP 202, status=queued, acceptedCount counts selected assets, not completed work. One request
            per minute per team and namespace; respect Retry-After on 429. Completion or failure is recorded in the API audit log. Targeted purge keeps HTTP 200 and purgedCount. A new unique
            release URL usually needs no purge immediately after upload: doing so evicts the warmed cache.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - domain
                  status:
                    type: string
                    enum:
                    - queued
                  acceptedCount:
                    type: integer
