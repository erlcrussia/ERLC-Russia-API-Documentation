                    edgePurged: true
                    timestamp: '2026-10-15T12:00:00Z'
                partial:
                  value:
                    success: false
                    domain: files.example.com
                    cloudflarePurged: false
                    edgePurged: true
                    timestamp: '2026-10-15T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
