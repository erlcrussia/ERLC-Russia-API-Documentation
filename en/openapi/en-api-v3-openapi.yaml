            schema:
              type: object
              properties:
                paths:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                  description: Exact file paths within the domain. An empty or missing array resets the entire domain.
                    Query prefix is ​​not supported.
            example:
              paths:
              - releases/RELEASE_ID/logo.png
      description: 'Reset Cloudflare and Go Edge. Pass JSON paths, not query prefix. HTTP 200 is also possible in
        case of failure: check success, cloudflarePurged and edgePurged. Without paths, the operation affects the
        entire domain.'
