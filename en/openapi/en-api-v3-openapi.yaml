  /keys:
    get:
      tags:
      - API Keys
      summary: My keys
      description: 'Your API and WebSocket keys. Pass `api=true` and/or `websocket=true`; `restrictions=true` adds permissions.


        The full secret is returned only on creation or rotation. AI key lists, renaming and deletion return a masked token. GET /keys reveals only the calling key; all sibling keys, including
        your own, are masked. teamId is the bound team ID or null.'
      parameters:
      - name: api
        in: query
        description: Запросить список HTTP API токенов
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Запросить список WebSocket токенов
        schema:
          type: boolean
        example: true
      - name: restrictions
        in: query
        description: Включить ограничения прав (указывается после api или websocket)
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: List of requested keys (array or object when requesting api and websocket simultaneously).
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: array
                    items:
                      type: object
                      properties:
                        teamId:
                          type: string
                        id:
                          type: string
                        key:
                          type: string
                        apiKey:
                          type: string
                        userId:
                          type: string
                        serverId:
                          type: string
                        isActive:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        restrictions:
                          type: object
                          properties:
                            endpoints:
                              type: array
                              items:
                                type: string
                            versions:
                              type: array
                              items:
                                type: string
                            queryParams:
                              type: array
                              items:
                                type: string
                            actions:
                              type: array
                              items: {}
                  websocket:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        key:
                          type: string
                        apiKey:
                          type: string
                        userId:
                          type: string
                        serverId:
                          type: string
                        isActive:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        restrictions:
                          type: object
                          properties:
                            channels:
                              type: array
                              items:
                                type: string
                            blockedIPs:
                              type: array
                              items: {}
              example:
                api:
                - teamId: team_7f3a
                  id: '15'
                  key: a8Fk2LmQ9zXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhJkL
                  apiKey: a8Fk2LmQ9zXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhJkL
                  userId: '123456789012345678'
                  serverId: '12345678'
                  isActive: true
                  createdAt: '2026-10-21T12:00:00Z'
                  restrictions:
                    endpoints:
                    - erlc.server
                    versions:
                    - v3
                    queryParams:
                    - query:Players
                    actions: []
                websocket:
                - id: '4'
                  key: ws_K3j...hJkL
                  apiKey: ws_K3j...hJkL
                  userId: '123456789012345678'
                  serverId: '12345678'
                  isActive: true
                  createdAt: '2026-10-21T12:00:00Z'
                  restrictions:
                    channels:
                    - players
                    blockedIPs: []
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - API Keys
      summary: Regenerate keys
      description: 'Reissues the API and/or WebSocket key. The old one stops working; permissions and subscriptions move to the new one.


        A key may be rotated once every five minutes; respect Retry-After on 429. Successful rotation is audited with key ID and IP, without the secret.'
      parameters:
      - name: api
        in: query
        description: Перегенерировать HTTP API ключ
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Перегенерировать WebSocket ключ
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Token(s) have been successfully regenerated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  oldToken:
                    type: string
                  newToken:
                    type: string
                  token:
                    type: string
                  apiKey:
                    type: string
                  key:
                    type: string
                  userId:
                    type: string
                  serverId:
                    type: string
              example:
                success: true
                message: API key regenerated successfully
                oldToken: a8Fk2L...hJkL
                newToken: Zp4Kq9LmQ2xXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhW8
                token: Zp4Kq9LmQ2xXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhW8
                apiKey: Zp4Kq9LmQ2xXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhW8
                key: Zp4Kq9LmQ2xXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhW8
                userId: '123456789012345678'
                serverId: '12345678'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /webhooks:
    get:
      tags:
      - Custom Webhooks
      summary: My webhooks
      description: Your webhook URLs and their status.
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: List of user webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  discord_id:
                    type: string
                  server_id:
                    type: string
                  is_active:
                    type: boolean
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
                  count:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
              example:
                discord_id: '123456789012345678'
                server_id: '12345678'
                is_active: true
                urls:
                - url: https://my-bot.example.com/erlc-events
                  isActive: true
                  serverIds:
                  - '12345678'
                count: 1
                created_at: '2026-10-01T12:00:00Z'
                updated_at: '2026-10-21T12:00:00Z'
    delete:
      tags:
      - Custom Webhooks
      summary: Delete all URLs
      description: Deletes all your webhook URLs.
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Webhooks have been removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: All user webhooks deleted successfully
    post:
      tags:
      - Custom Webhooks
      summary: Game event intake
      description: ER:LC sends server events here, signed with Ed25519. The API checks the signature and forwards the event to your URLs.
      security:
      - SignatureTimestamp: []
        SignatureEd25519: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server:
                  type: string
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      event:
                        type: string
                      timestamp:
                        type: integer
                      origin:
                        type: string
                      data:
                        type: object
                        properties:
                          command:
                            type: string
                          player:
                            type: string
            example:
              server: '12345678'
              events:
              - event: CustomCommand
                timestamp: 1792083600
                origin: '12345678'
                data:
                  command: ;help
                  player: Builderman
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                status: received
                event_type: CustomCommand
                server_id: '12345678'
              schema:
                type: object
                properties:
                  status:
                    type: string
                  event_type:
                    type: string
                  server_id:
                    type: string
  /webhooks/add-url:
    post:
      tags:
      - Custom Webhooks
      summary: Add a URL
      description: Adds a URL for game events. Only a URL that verifies the signature is accepted, and it is enabled right away. A key bound to a server can only subscribe to that server.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                serverIds:
                  type: array
                  items:
                    type: string
            example:
              url: https://my-bot.example.com/erlc-events
              serverIds:
              - '12345678'
      responses:
        '201':
          description: The webhook has been successfully registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
                  is_active:
                    type: boolean
                  discord_id:
                    type: string
              example:
                success: true
                message: Webhook URL added successfully
                urls:
                - url: https://my-bot.example.com/erlc-events
                  isActive: true
                  serverIds:
                  - '12345678'
                is_active: true
                discord_id: '123456789012345678'
        '403':
          description: It is prohibited to bind a webhook to this server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Вам запрещено привязывать вебхук к серверу '999999'. Разрешенный сервер для вашего ключа '12345678'
                  forbidden_server_id:
                    type: string
                    example: '999999'
                  allowed_server_id:
                    type: string
                    example: '12345678'
        '400':
          description: 'The URL failed the check: it must answer 2xx to a correctly signed request and 4xx to a forged one. The reason is in `reason`, the URL answer in `status`.'
          content:
            application/json:
              example:
                code: 5051
                message: Webhook Verification Failed
                reason: forged_accepted
                status: 200
