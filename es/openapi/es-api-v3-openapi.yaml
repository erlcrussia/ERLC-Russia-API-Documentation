  /cdn/assets:
    get:
      tags:
      - Activos CDN
      summary: Archivos
      description: Lista de archivos con estadísticas y páginas. Con una `path` exacta devuelve uno. 50 por defecto, máximo 100.
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Пространство имён (первый сегмент пути файла).
        schema:
          type: string
