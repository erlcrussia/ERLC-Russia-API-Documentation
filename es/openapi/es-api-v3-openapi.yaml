openapi: 3.1.0
info:
  title: ER:LC Rusia API V3
  description: API de ER:LC Russia para servidores, usuarios, CDN, redirecciones, suscripciones y claves de acceso.
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
  description: Servidor de producción (com)
- url: https://api.erlcrussia.xyz/v3
  description: Servidor de respaldo (xyz)
tags:
- name: ER:Servidor LC
  description: Obtención de estados, online, listados de jugadores y staff del servidor ER:LC.
- name: 'ER: Equipos LC'
  description: Enviar y poner en cola comandos del servidor del juego (:h, :m, :kick, :ban, etc.).
- name: economía
  description: Interacción con el sistema económico (usuarios, comercios, mafias, comercios, publicidad).
- name: API de estadísticas
  description: Obtención de estadísticas de alto rendimiento de servidores de discord y servidores de juegos (en línea, participantes, bots).
- name: API de verificación
  description: Búsqueda y comparación de cuentas de Discord ID y Roblox ID.
- name: Activos CDN
  description: Cargue, administre, realice estadísticas y borre la caché de archivos de almacenamiento de objetos MinIO/Edge CDN.
- name: Carpetas CDN
  description: Estructura jerárquica y clasificación de carpetas de la biblioteca multimedia CDN.
- name: API de castigo
  description: Administre el saldo y el historial de transacciones de los puntos de los jugadores.
- name: API de suscripciones
  description: Catálogo de planes, pedidos FunPay, acumulación de beneficios y activación de suscripciones.
- name: API de autorización
  description: Inicie sesión a través de Discord y Roblox OAuth2, administre sesiones de usuario y vincule cuentas.
- name: 'API de administración: claves WebSocket'
  description: Gestión de claves de acceso a la puerta de enlace WebSocket y suscripciones a canales.
- name: 'API de administración: webhooks'
  description: Registro, validación de accesibilidad y seguimiento de webhooks personalizados.
- name: API de control - Panel
  description: Gestión de usuarios, suscripciones, tarifas, saldo manual y estadísticas del sistema.
- name: API estatal
  description: Monitoreo del desempeño del servicio, conexiones a PostgreSQL y Redis.
- name: AI Audio
- name: AI Studio
- name: 'API de administración: servidores'
- name: 'API de administración: tokens'
- name: Administración de AI
- name: Administración de monedas electrónicas
- name: Archivos privados y biblioteca
- name: CDN
- name: CDN V3
- name: Claves API
- name: Dominios CDN
- name: La organización redirecciona V3
- name: Webhooks personalizados
- name: Рекламные кампании V3
paths:
  /erlc/server:
    get:
      tags:
      - ER:Servidor LC
      summary: Información
      description: Nombre, jugadores en línea y estado. Con parámetros se añaden jugadores, staff, cola y registros.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Включить детальный список игроков на сервере.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Включить список сотрудников и модераторов (Admins, Mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Включить журнал входов и выходов.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Включить состояние очереди ожидания подключения.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Включить журнал убийств.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Включить журнал выполненных команд.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Включить активные вызовы модераторов.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Включить список заспавненных транспортных средств.
        schema:
          type: boolean
      responses:
        '200':
          description: Respuesta exitosa con datos del servidor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Name:
                    type: string
                  OwnerId:
                    type: integer
                  CoOwnerIds:
                    type: array
                    items:
                      type: integer
                  CurrentPlayers:
                    type: integer
                  MaxPlayers:
                    type: integer
                  JoinKey:
                    type: string
                  AccVerifiedReq:
                    type: string
                  TeamBalance:
                    type: boolean
                  Players:
                    type: array
                    items:
                      type: object
                      properties:
                        Player:
                          type: string
                        Permission:
                          type: string
                        Callsign:
                          type: string
                        Team:
                          type: string
                  Queue:
                    type: array
                    items:
                      type: integer
              example:
                Name: Moscow RolePlay I RU
                OwnerId: 1234567
                CoOwnerIds:
                - 7654321
                CurrentPlayers: 32
                MaxPlayers: 40
                JoinKey: MRPRU
                AccVerifiedReq: Disabled
                TeamBalance: true
                Players:
                - Player: Builderman:156
                  Permission: Server Administrator
                  Callsign: 1-A-12
                  Team: Police
                Queue:
                - 261
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:Servidor LC
      summary: Baneos del servidor
      description: Jugadores bloqueados del servidor de ER:LC.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Lista de usuarios prohibidos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  '156':
                    type: string
                  '261':
                    type: string
              example:
                '156': Builderman
                '261': Shedletsky
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - 'ER: Equipos LC'
      summary: Ejecutar un comando
      description: Ejecuta un comando en el servidor de ER:LC, por ejemplo `:h Mensaje`. Ante un error temporal se reintenta.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: Текст команды с двоеточием (например, ":m Сервер перезагружается").
            example:
              command: :h Сервер перезапустится через 5 минут
      responses:
        '200':
          description: El comando se envió correctamente al servidor o se puso en cola.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                  QueueSize:
                    type: integer
              example:
                Status: Queued
                QueueSize: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - economía
      summary: 'Economía: dinero de jugadores'
      description: Saldo del jugador, ranking, posición y tiempos de espera de comandos.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Datos económicos.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                cash: 15000
                bank: 82000
                rank: 14
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  cash:
                    type: integer
                  bank:
                    type: integer
                  rank:
                    type: integer
    post:
      tags:
      - economía
      summary: 'Economía: operaciones'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fromUserId:
                  type: string
                toUserId:
                  type: string
                amount:
                  type: integer
            example:
              fromUserId: '123456789012345678'
              toUserId: '234567890123456789'
              amount: 500
      responses:
        '200':
          description: Actualización exitosa.
          content:
            application/json:
              example:
                success: true
                fromUserId: '123456789012345678'
                toUserId: '234567890123456789'
                amount: 500
                newBalance:
                  cash: 14500
                  bank: 82000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  fromUserId:
                    type: string
                  toUserId:
                    type: string
                  amount:
                    type: integer
                  newBalance:
                    type: object
                    properties:
                      cash:
                        type: integer
                      bank:
                        type: integer
      description: Transferencias, banco, añadir, quitar, reiniciar saldo y tiempos de espera.
  /civops/users:
    get:
      tags:
      - economía
      summary: 'Economía: jugador'
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Datos del perfil del jugador.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                inventory:
                - name: Аптечка
                  amount: 2
                  description: Восстанавливает здоровье
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  inventory:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: integer
                        description:
                          type: string
      description: Inventario e historial de operaciones del jugador.
    post:
      tags:
      - economía
      summary: 'Economía: inventario'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                item:
                  type: object
                  properties:
                    name:
                      type: string
                    amount:
                      type: integer
            example:
              userId: '123456789012345678'
              item:
                name: Аптечка
                amount: 1
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                amount: 1
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  amount:
                    type: integer
      description: Añadir y quitar objetos, vaciar el inventario.
  /civops/businesses:
    get:
      tags:
      - economía
      summary: 'Economía: negocios'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Lista de empresas registradas.
          content:
            application/json:
              example:
                page: 1
                total: 1
                businesses:
                - id: B7K2Q9XZ
                  name: Кафе «Арбат»
                  form: ООО
                  status: active
                  owner_id: '123456789012345678'
                  owner_name: player
                  address: ул. Арбат, 10
                  bank: 120000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  businesses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        form:
                          type: string
                        status:
                          type: string
                        owner_id:
                          type: string
                        owner_name:
                          type: string
                        address:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Negocios: lista, ficha, saldo, empleados, productos, transferencias, ranking y solicitudes.'
    post:
      tags:
      - economía
      summary: 'Economía: acciones de negocios'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                amount:
                  type: integer
            example:
              businessId: B7K2Q9XZ
              amount: 5000
      responses:
        '200':
          description: La operación está completa.
          content:
            application/json:
              example:
                success: true
                businessId: B7K2Q9XZ
                added: 5000
                newBalance: 125000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  businessId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Solicitudes, crear y eliminar negocios, dinero, empleados y productos.
  /civops/mafias:
    get:
      tags:
      - economía
      summary: 'Economía: mafias'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Listado de mafias y grupos.
          content:
            application/json:
              example:
                page: 1
                total: 1
                mafias:
                - id: M3X8P1
                  name: Солнцевские
                  leader_id: '123456789012345678'
                  leader_name: player
                  color: '#8B0000'
                  bank: 54000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  mafias:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        leader_id:
                          type: string
                        leader_name:
                          type: string
                        color:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Mafias: lista, ficha, saldo, miembros, transferencias y registros.'
    post:
      tags:
      - economía
      summary: 'Economía: acciones de mafias'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mafiaId:
                  type: string
                amount:
                  type: integer
            example:
              mafiaId: M3X8P1
              amount: 1000
      responses:
        '200':
          description: Estado de operación.
          content:
            application/json:
              example:
                success: true
                mafiaId: M3X8P1
                added: 1000
                newBalance: 55000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mafiaId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Crear y eliminar mafias, dinero, transferencias y miembros.
  /civops/government:
    get:
      tags:
      - economía
      summary: 'Economía: presupuesto'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Estado del presupuesto y departamentos estatales.
          content:
            application/json:
              example:
                balance:
                  bank: 2500000
              schema:
                type: object
                properties:
                  balance:
                    type: object
                    properties:
                      bank:
                        type: integer
      description: Saldo del presupuesto y transferencias del gobierno.
    post:
      tags:
      - economía
      summary: 'Economía: acciones del presupuesto'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
            example:
              amount: 10000
      responses:
        '200':
          description: La configuración ha sido actualizada.
          content:
            application/json:
              example:
                success: true
                added: 10000
                newBalance: 2510000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Añadir y retirar del presupuesto, transferencias a jugador, negocio o mafia.
  /civops/store:
    get:
      tags:
      - economía
      summary: 'Economía: tienda'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Catálogo de productos de la tienda.
          content:
            application/json:
              example:
                count: 1
                items:
                - name: Аптечка
                  description: Восстанавливает здоровье
                  price_buy: 250
                  price_sell: 100
                  quantity: null
                  can_use: true
                  can_sell: true
                  createdAt: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        price_buy:
                          type: integer
                        price_sell:
                          type: integer
                        quantity:
                          type:
                          - string
                          - 'null'
                        can_use:
                          type: boolean
                        can_sell:
                          type: boolean
                        createdAt:
                          type: integer
      description: Productos de la tienda del juego.
    post:
      tags:
      - economía
      summary: 'Economía: acciones de la tienda'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                itemName:
                  type: string
                quantity:
                  type: integer
            example:
              userId: '123456789012345678'
              itemName: Аптечка
              quantity: 2
      responses:
        '200':
          description: El resultado de la transacción.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                quantity: 2
                totalPrice: 500
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  quantity:
                    type: integer
                  totalPrice:
                    type: integer
      description: Añadir y quitar productos, comprar y vender a la tienda.
  /civops/ads:
    get:
      tags:
      - economía
      summary: 'Economía: anuncios'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Campañas publicitarias activas.
          content:
            application/json:
              example:
                count: 1
                ads:
                - id: 5
                  user_id: '123456789012345678'
                  username: player
                  business_name: Кафе «Арбат»
                  address: ул. Арбат, 10
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  ads:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: string
                        username:
                          type: string
                        business_name:
                          type: string
                        address:
                          type: string
                        created_at:
                          type: integer
      description: Solicitudes de anuncios del juego (`action=list`).
    post:
      tags:
      - economía
      summary: 'Economía: enviar un anuncio'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                username:
                  type: string
                businessName:
                  type: string
                address:
                  type: string
            example:
              userId: '123456789012345678'
              username: player
              businessName: Кафе «Арбат»
              address: ул. Арбат, 10
      responses:
        '200':
          description: El anuncio ha sido publicado.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                businessName: Кафе «Арбат»
                address: ул. Арбат, 10
                adSent: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  businessName:
                    type: string
                  address:
                    type: string
                  adSent:
                    type: boolean
      description: Crea una solicitud de anuncio (`action=create`).
  /civops/system:
    get:
      tags:
      - economía
      summary: 'Economía: resumen'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Versión y configuración económica.
          content:
            application/json:
              example:
                users: 5120
                businesses: 34
                mafias: 6
                governmentBalance: 2500000
                uptime: 86400.5
                memory:
                  rss: 152043520
                  heapTotal: 98304000
                  heapUsed: 71303168
                  external: 2097152
                timestamp: '2026-10-21T12:00:00.000Z'
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  businesses:
                    type: integer
                  mafias:
                    type: integer
                  governmentBalance:
                    type: integer
                  uptime:
                    type: number
                  memory:
                    type: object
                    properties:
                      rss:
                        type: integer
                      heapTotal:
                        type: integer
                      heapUsed:
                        type: integer
                      external:
                        type: integer
                  timestamp:
                    type: string
                    format: date-time
      description: Estadísticas generales de la economía y tiempo de actividad.
  /civops/health:
    get:
      tags:
      - economía
      summary: 'Economía: estado'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: El servicio económico está activo.
          content:
            application/json:
              example:
                status: ok
                service: Economy API
                timestamp: '2026-10-21T12:00:00.000Z'
                uptime: 86400.5
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
      description: Si el módulo de economía funciona. No requiere clave.
  /stats:
    get:
      tags:
      - API de estadísticas
      summary: Estadísticas de servidores
      description: Jugadores en línea de ER:LC y miembros de servidores de Discord. Se pueden pedir varios a la vez.
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Имена серверов. Выберите один или несколько серверов из выпадающего списка:

          - `MRP` — Moscow RolePlay (поддерживает все 4 метрики)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` — поддерживают `membercount`, `allmembercount`, `botcount`

          - `DOT` — поддерживает только `membercount`

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Типы запрашиваемых метрик:

          - `playercount` — онлайн игроков в игре ER:LC (**доступен ТОЛЬКО для `MRP`**)

          - `membercount` — количество участников Discord онлайн (доступен для всех)

          - `allmembercount` — общее число участников Discord сервера (все кроме `DOT`)

          - `botcount` — количество ботов на сервере (все кроме `DOT`)

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
