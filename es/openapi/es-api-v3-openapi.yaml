        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Запросить список WebSocket токенов
        schema:
          type: boolean
        example: true
      - name: restrictions
        in: query
        description: Включить ограничения прав (указывается после api или websocket)
