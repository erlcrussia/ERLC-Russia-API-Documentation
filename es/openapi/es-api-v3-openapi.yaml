        un bot de Discord.
      parameters:
      - name: token
        in: query
        description: Token de bot HMAC para enlace de sesión.
        schema:
          type: string
      responses:
        '302':
          description: Redirigir a roblox.com/oauth/v1/authorize.
  /auth/roblox/callback:
    get:
      tags:
      - API de autorización
      summary: Roblox OAuth2 Callback
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirigir a `https://erlcrussia.com/<lang>/login` (si se realizó correctamente) o `.../login/roblox`
            (si se produjo un error).
  /auth/session:
    get:
