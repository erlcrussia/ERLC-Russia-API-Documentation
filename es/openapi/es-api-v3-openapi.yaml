                      type: string
                      format: date-time
                    is_active:
                      type: boolean
                    tools_enabled:
                      type: boolean
    post:
      tags:
      - AI Studio
      summary: Crear una clave de IA
      security:
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Studio Key
                scope:
                  type: string
                  enum:
                  - agent
                  - chat
                  - voice
            example:
              name: Discord-бот
              scope: chat
      responses:
        '403':
          description: Owner session required; an ordinary HTTP key cannot authorize this operation.
        '200':
          description: Se ha creado la clave (id, token, nombre, alcance, created_at, is_active, tools_enabled).
          content:
            application/json:
              example:
                id: '21'
                token: sk-chat-3f9c2a1e5b7d4e9fa1c32b4d6e8f0a1c3f9c2a1e5b7d4e9fa1c32b4d6e8f0a1c
                name: Discord-бот
                scope: chat
                created_at: '2026-10-21T12:00:00Z'
                is_active: true
                tools_enabled: false
              schema:
                type: object
                properties:
                  id:
                    type: string
                  token:
                    type: string
                  name:
                    type: string
                  scope:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  is_active:
                    type: boolean
                  tools_enabled:
                    type: boolean
      description: 'Crea una clave de IA para la API compatible con OpenAI: agent, chat o voice.


        Crear una clave IA e intercambiar monedas requieren la sesión del propietario. Una clave HTTP normal, incluso con acceso completo, no permite estas operaciones. Los servicios de
        confianza usan los métodos administrativos con clave maestra.'
  /ai/keys/{id}:
    delete:
      tags:
      - AI Studio
      summary: Eliminar una clave de IA
      description: 'Elimina tu clave de IA por ID o valor.


        El secreto completo solo se devuelve al crear o rotar. Las listas de claves IA, el cambio de nombre y la eliminación devuelven una máscara. GET /keys solo muestra completa la clave
        que hace la llamada; las demás, incluso propias, están ocultas. teamId es el ID del equipo vinculado o null.'
      parameters:
      - name: id
        in: path
        required: true
        description: Токен ключа (sk-chat-...) или числовой ID.
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: 'Clave eliminada ({éxito: verdadero, eliminada: verdadero, token: "..."}).'
          content:
            application/json:
              example:
                success: true
                deleted: true
                token: sk-chat-3...0a1c
