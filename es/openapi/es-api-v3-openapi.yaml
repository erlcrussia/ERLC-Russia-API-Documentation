components:
  securitySchemes:
    AIManagementKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Clave API de usuario habitual para gestionar préstamos y claves AI; No se permiten sk-chat ejecutivo/sk-agent/sk-voice.
    AIExecutionKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Tecla ejecutiva sk-chat/sk-agent/sk-voice según el método.
    BearerAuth:
      type: http
      scheme: bearer
      description: Clave API en el encabezado Autorización en el formato `Bearer <token>`.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-key
      description: Clave API personalizada. Almacenar en el servidor; no incluya JavaScript del lado del cliente.
    WebSocketKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-websocket-key
      description: Encabezado de clave WebSocket único erlcrussia-websocket-key.
    CookieAuth:
      type: apiKey
      in: cookie
      name: erlc_auth
      description: Cookie de autorización de sesión únicamente HTTP en el portal.
    CDNDeployToken:
      type: apiKey
      in: header
      name: erlcrussia-api-cdn-token
      description: Un token de implementación independiente para un dominio CDN verificado.
  schemas:
    UserAsset:
      type: object
      required:
      - id
      - domain
