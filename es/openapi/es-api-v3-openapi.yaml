              schema:
                type: object
                properties:
                  id:
                    type: string
                  token:
                    type: string
                  name:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  is_active:
                    type: boolean
        '400':
          description: Respuesta correcta.
        '403':
          description: Respuesta correcta.
      description: 'Cambia el nombre de tu clave de IA por ID o valor.


