      - name: path
        in: query
        required: false
        description: Точный путь ассета внутри пространства имён.
        schema:
          type: string
        example: branding/logo.png
      - name: prefix
        in: query
        required: false
        description: Префикс пути для выборки группы файлов.
        schema:
          type: string
        example: branding/
      - name: folderId
        in: query
        required: false
        description: 'ID папки UI. Папка — только визуальная группировка, на путь файла не влияет.

          `root` или `null` — файлы без папки, `all` — без фильтра.

          '
        schema:
          type: string
        example: root
      - name: search
        in: query
        required: false
        description: Поиск по имени, слагу и полному пути.
        schema:
          type: string
      - name: sourceType
        in: query
        required: false
        description: Фильтр по типу источника.
        schema:
          type: string
          enum:
          - LOCAL
          - EXTERNAL
          - all
      - name: isPinned
        in: query
        required: false
        description: Фильтр по закреплению.
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        description: Номер страницы, начиная с 1.
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        description: Количество элементов на странице, максимум 100.
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
