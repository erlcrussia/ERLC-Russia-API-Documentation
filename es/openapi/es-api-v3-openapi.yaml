          description: Información sobre límites y estados activos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  discordId:
                    type: string
                    example: '403258784102940682'
                  violationLimit:
                    type: integer
                    example: 50
                  hasVip:
                    type: boolean
                    example: false
                  hasPremium:
                    type: boolean
                    example: true
                  hasBooster:
                    type: boolean
                    example: false
                  hasTverskaya:
                    type: boolean
                    example: true
                  hasKreml:
                    type: boolean
                    example: false
