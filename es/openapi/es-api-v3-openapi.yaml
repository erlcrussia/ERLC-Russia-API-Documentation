    post:
      tags:
      - Activos CDN
      summary: Purgar caché de archivos
      description: 'Purga la caché por `ids`, `path` o `prefix`; sin ellos, todo el espacio. `success` indica que se aceptó, no que terminó.


        Sin ids/path/prefix, la purga de todo el namespace se ejecuta en segundo plano: HTTP 202, status=queued y acceptedCount cuenta objetos seleccionados, no trabajo terminado. Una solicitud
        por minuto por equipo y namespace; respeta Retry-After con 429. El resultado se registra en la auditoría del API. La purga específica mantiene HTTP 200 y purgedCount. Una URL de
        versión nueva y única normalmente no necesita purge justo después de subir: eso elimina la caché precalentada.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Пространство имён.
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Точный путь ассета.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: Список ID ассетов. Передаётся только в теле запроса, не в query.
                  items:
                    type: string
            example:
              ids:
              - ast_7Kq2Zp
      responses:
        '200':
          description: El caché ha sido borrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - path
                    - ids
                    - prefix
                  purgedCount:
                    type: integer
              examples:
                purge_ok:
                  summary: Purge ok
                  value:
                    success: true
                    domain: default
                    scope: ids
                    purgedCount: 1
        '401':
          description: 'No autorizado (401): la clave no se transfirió.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: 'Prohibido (403): hay una clave, pero no suficientes derechos.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: Se ha alcanzado el límite de solicitudes. Considere Reintentar después y Retry-After; No ejecute descargas paralelas ilimitadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
        '202':
          description: 'Sin ids/path/prefix, la purga de todo el namespace se ejecuta en segundo plano: HTTP 202, status=queued y acceptedCount cuenta objetos seleccionados, no trabajo terminado.
            Una solicitud por minuto por equipo y namespace; respeta Retry-After con 429. El resultado se registra en la auditoría del API. La purga específica mantiene HTTP 200 y purgedCount.
            Una URL de versión nueva y única normalmente no necesita purge justo después de subir: eso elimina la caché precalentada.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - domain
                  status:
                    type: string
                    enum:
                    - queued
                  acceptedCount:
                    type: integer
