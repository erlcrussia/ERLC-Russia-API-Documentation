      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Configurar la cookie `erlc_auth` y redirigir a su cuenta personal.
  /auth/roblox:
    get:
      tags:
      - API de autorización
      summary: Autorización a través de Roblox
