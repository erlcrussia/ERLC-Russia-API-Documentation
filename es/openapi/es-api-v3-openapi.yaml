  /auth/user/sessions:
    get:
      tags:
      - API de autorización
      summary: Lista de sesiones de usuarios activos
      description: Devuelve una lista de todas las sesiones activas de navegador y API con direcciones IP y dispositivos.
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Listado de sesiones.
    delete:
      tags:
      - API de autorización
      summary: Finalizar todas las demás sesiones
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Todas las sesiones excepto la actual han finalizado.
  /auth/user/sessions/{id}:
    delete:
      tags:
      - API de autorización
