  /webhooks/add-url:
    post:
      tags:
      - Webhooks personalizados
      summary: Añadir una URL
      description: Añade una URL para eventos del juego. Solo se acepta si verifica la firma y queda activada al momento. Una clave ligada a un servidor solo suscribe a ese servidor.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                serverIds:
                  type: array
                  items:
                    type: string
            example:
              url: https://my-bot.example.com/erlc-events
              serverIds:
              - '12345678'
      responses:
        '201':
          description: El webhook se ha registrado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
                  is_active:
                    type: boolean
                  discord_id:
                    type: string
              example:
                success: true
                message: Webhook URL added successfully
                urls:
                - url: https://my-bot.example.com/erlc-events
                  isActive: true
                  serverIds:
                  - '12345678'
                is_active: true
                discord_id: '123456789012345678'
        '403':
          description: Está prohibido vincular un webhook a este servidor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Вам запрещено привязывать вебхук к серверу '999999'. Разрешенный сервер для вашего ключа '12345678'
                  forbidden_server_id:
                    type: string
                    example: '999999'
                  allowed_server_id:
                    type: string
                    example: '12345678'
        '400':
          description: 'La URL no superó la comprobación: debe responder 2xx a una solicitud bien firmada y 4xx a una falsa. El motivo está en `reason`, la respuesta de la URL en `status`.'
          content:
            application/json:
              example:
                code: 5051
                message: Webhook Verification Failed
                reason: forged_accepted
                status: 200
  /webhooks/url:
    put:
      tags:
      - Webhooks personalizados
      summary: Actualizar una URL
      description: Cambia la dirección de la URL y los servidores. La nueva dirección se comprueba con firma; si la URL está activada no cambia.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldUrl:
                  type: string
                url:
                  type: string
                serverIds:
                  type: array
                  items:
                    type: string
            example:
              oldUrl: https://my-bot.example.com/erlc-events
              url: https://my-bot.example.com/erlc-events-v2
              serverIds:
              - '12345678'
      responses:
        '200':
          description: Webhook actualizado correctamente.
          content:
            application/json:
              example:
                success: true
                message: Webhook updated successfully
                urls:
                - url: https://my-bot.example.com/erlc-events-v2
                  isActive: true
                  serverIds:
                  - '12345678'
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
        '400':
          description: 'La URL no superó la comprobación: debe responder 2xx a una solicitud bien firmada y 4xx a una falsa. El motivo está en `reason`, la respuesta de la URL en `status`.'
          content:
            application/json:
              example:
                code: 5051
                message: Webhook Verification Failed
                reason: forged_accepted
                status: 200
    delete:
      tags:
      - Webhooks personalizados
      summary: Quitar una URL
      description: Quita una URL de tus webhooks.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
            example:
              url: https://my-bot.example.com/erlc-events
      parameters:
      - name: url
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Webhook eliminado.
          content:
            application/json:
              example:
                success: true
                message: Webhook URL removed successfully
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
