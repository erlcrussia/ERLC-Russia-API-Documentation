      - name
      - mimeType
      - kind
      - status
      - url
      - size
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
        domain:
          type: string
        path:
          type: string
        name:
          type: string
        mimeType:
          type: string
        kind:
          type: string
        status:
          type: string
        url:
          type: string
        size:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
