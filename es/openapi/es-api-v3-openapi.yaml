    patch:
      tags:
      - API de autorización
      summary: Sincronizando tu perfil con Discord
      description: Fuerza una solicitud del avatar actual, la decoración del avatar y el nombre de usuario desde
        la API de Discord y actualiza la entrada en la base de datos.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: El perfil se ha actualizado correctamente.
  /ai/credits/balance:
    get:
      tags:
      - AI Studio
      summary: Saldo de crédito de IA
      description: Devuelve el saldo de créditos de IA, monedas, tipo de cambio (1 moneda = 1 crédito de IA) y escala
        de precios (niya-1, emmy-1, hubert-1) para el propietario de la clave API transferida.
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: Saldo de créditos y monedas.
        '401':
          description: No autorizado.
  /ai/credits/exchange:
    post:
      tags:
      - AI Studio
      summary: Cambia monedas por créditos de IA
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - coins
              properties:
                coins:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Monedas intercambiadas (éxito, exchanged_coins, credits_added, new_credits, remaining_coins).
  /ai/keys:
    get:
      tags:
      - AI Studio
      summary: Lista de claves de IA
      description: Devuelve claves con el formato sk-agent-*/sk-chat-*/sk-voice-* del usuario actual (id, token,
        nombre, alcance, created_at, is_active, tools_enabled).
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: Lista de claves.
    post:
      tags:
      - AI Studio
      summary: Creando una clave AI
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Studio Key
                scope:
                  type: string
                  enum:
                  - agent
                  - chat
                  - voice
      responses:
        '200':
          description: Se ha creado la clave (id, token, nombre, alcance, created_at, is_active, tools_enabled).
    delete:
      tags:
      - AI Studio
      summary: Eliminar una clave AI (a través de Encabezado/Cuerpo/Consulta)
      description: Elimina la clave AI del usuario actual. La clave de eliminación se puede pasar en el encabezado
        `target-api-key` (o `token`), en el cuerpo JSON `{"token":"..."}`, a través del parámetro de consulta `?token=...`
        o sin parámetros (para revocar la clave de solicitud).
      parameters:
      - name: target-api-key
        in: header
        required: false
        description: Token de la clave eliminada
        schema:
          type: string
      - name: token
        in: query
        required: false
        description: Token de la clave eliminada
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: integer
      responses:
        '200':
          description: 'Clave eliminada ({éxito: verdadero, eliminada: verdadero, token: "..."}).'
  /ai/keys/{id}:
    delete:
      tags:
      - AI Studio
      summary: Eliminar una clave AI por ID/Token en una URL
      description: Elimina la clave AI del usuario actual mediante token o ID numérico en la ruta URL.
      parameters:
      - name: id
        in: path
        required: true
        description: Token de clave (sk-chat-...) o ID numérico.
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: 'Clave eliminada ({éxito: verdadero, eliminada: verdadero, token: "..."}).'
  /ai/audio/pricing:
    get:
      tags:
      - AI Audio
      summary: Тарифы и ограничения голосового API
      description: Возвращает модель, стоимость, максимальную длительность и формат аудио для распознавания речи.
      responses:
        '200':
          description: Параметры голосового API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: {type: string}
                  credits_per_minute: {type: number}
                  speech_credits_per_1000_characters: {type: number}
                  speech_max_characters: {type: integer}
                  speech_voice: {type: string}
                  billing_unit: {type: string}
                  max_duration_seconds: {type: integer}
                  format: {type: string}
  /ai/audio/transcriptions:
    post:
      tags:
      - AI Audio
      summary: Распознавание речи
      description: Принимает WAV в mono PCM 16-bit 16000 Hz длительностью до 120 секунд. Нужен AI-ключ с правом voice.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          default: ru
      responses:
        '200':
          description: Распознанный текст и сведения о списании кредитов.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: {type: string}
                  model: {type: string}
                  duration_seconds: {type: number}
                  credits_charged: {type: number}
        '400':
          description: Некорректный или повреждённый WAV-файл.
        '401':
          description: AI-ключ отсутствует или недействителен.
        '413':
          description: Аудио длиннее 120 секунд.
        '415':
          description: Требуется Content-Type audio/wav.
        '503':
          description: Сервис распознавания недоступен.
  /ai/title:
    post:
      tags:
      - AI Studio
      summary: Generación de títulos de chat
      description: Genera un título de chat conciso (2-4 palabras). Para claves API personalizadas, cancela los
        créditos de IA según los tokens. Funciona ilimitadamente con Master Key. Una clave de IA ejecutiva no otorga
        derechos para administrar créditos, otras claves, CDN o redirecciones.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                locale:
                  type: string
                  default: ru
                model:
                  type: string
      responses:
        '200':
          description: Título generado ({título, éxito, cost_credits, uso}).
  /ads/upload:
    post:
      tags:
      - Рекламные кампании V3
      summary: Загрузка баннера рекламы
      description: Загружает изображение баннера на images.erlcrussia.com (максимум 5 МБ, форматы PNG, JPEG, WebP, GIF, AVIF).
      security:
      - CookieAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Баннер успешно загружен.
          content:
            application/json:
              schema:
                type: object
                required: [bannerUrl, size, mimeType, domain, path]
                properties:
                  bannerUrl: {type: string, example: "https://images.erlcrussia.com/ads/banners/0123456789abcdef.png"}
                  size: {type: integer, example: 245000}
                  mimeType: {type: string, example: "image/png"}
                  domain: {type: string, example: "images.erlcrussia.com"}
                  path: {type: string, example: "ads/banners/0123456789abcdef.png"}
        '400':
          description: Недопустимый формат файла или повреждённые данные.
        '401':
          description: Требуется авторизация пользователя.
        '413':
          description: Размер файла превышает 5 МБ.

  /ads/campaigns:
    get:
      tags:
      - Рекламные кампании V3
      summary: Список рекламных кампаний
      description: Возвращает все рекламные кампании текущего пользователя.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Список кампаний.
          content:
            application/json:
              schema:
                type: object
                required: [campaigns]
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdCampaign'
    post:
      tags:
      - Рекламные кампании V3
      summary: Создание рекламной кампании
      description: Создаёт новую заявку на рекламную кампанию со списанием 10 eCoins за модерацию.
