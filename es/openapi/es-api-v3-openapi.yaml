  /keys:
    get:
      tags:
      - Claves API
      summary: Obtención de claves y restricciones
      description: "Un punto final universal para obtener una lista de tokens API y WebSocket, así como sus restricciones.\n\
        Para ejecutar una solicitud, debe pasar uno de los parámetros de consulta `api=true` o `websocket=true`.\n\
        Para habilitar restricciones de permisos para una clave, pase el parámetro `restrictions=true` después del\
        \ tipo apropiado (por ejemplo, `?api=true&restrictions=true` o `?api=true&restrictions=true&websocket=true&restrictions=true`).\n\
        \ La respuesta contiene las claves privadas del propietario, incluidos sus otros servidores. No llame desde\
        \ una aplicación de navegador y no registre la respuesta. La matriz de restricciones refleja las entradas\
        \ permitidas explícitamente, en lugar de la política de acceso efectiva completa."
      parameters:
      - name: api
        in: query
        description: Solicite una lista de tokens API HTTP
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Solicite una lista de tokens WebSocket
        schema:
          type: boolean
        example: true
      - name: restrictions
        in: query
        description: Habilitar restricciones de derechos (especificadas después de api o websocket)
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Lista de claves solicitadas (matriz u objeto al solicitar api y websocket simultáneamente).
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ApiKeyItem'
                - type: array
                  items:
                    $ref: '#/components/schemas/WebSocketKeyItem'
                - type: object
                  properties:
                    api:
                      type: array
                      items:
                        $ref: '#/components/schemas/ApiKeyItem'
                    websocket:
                      type: array
                      items:
                        $ref: '#/components/schemas/WebSocketKeyItem'
              examples:
                api_only:
                  summary: Solicitar solo claves API (?api=true&restrictions=true)
                  value:
                  - id: '1'
                    key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    userId: '403258784102940682'
                    serverId: srv_8f9a2b1c4e
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      endpoints:
                      - erlc.server
                      - civops.economy
                      versions:
                      - v3
                      queryParams:
                      - Players
                      - Staff
                      actions:
                      - webhook:add
                      - logs:read
                websocket_only:
                  summary: Solicitar solo claves WebSocket (?websocket=true&restrictions=true)
                  value:
                  - id: '1'
                    key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    userId: '403258784102940682'
                    serverId: srv_3d5e7f9a1b
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      channels:
                      - server:players
                      - server:logs
                      blockedIPs: []
                both:
                  summary: Solicitud de ambos tipos (?api=true&websocket=true)
                  value:
                    api:
                    - id: '1'
                      key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      userId: '403258784102940682'
                      serverId: srv_8f9a2b1c4e
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
                    websocket:
                    - id: '1'
                      key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      userId: '403258784102940682'
                      serverId: srv_3d5e7f9a1b
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Claves API
      summary: Regeneración clave
      description: 'Punto final universal para regenerar tokens API y/o WebSocket.

