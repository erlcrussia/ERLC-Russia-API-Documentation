openapi: 3.1.0
info:
  title: ER:LC Rusia API V3
  description: "API de ER:LC Russia para servidores, usuarios, CDN, redirecciones, suscripciones y claves de acceso."
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
- url: https://api.erlcrussia.xyz/v3
tags:
- name: ER:Servidor LC
  description: Obtención de estados, online, listados de jugadores y staff del servidor ER:LC.
- name: 'ER: Equipos LC'
  description: Enviar y poner en cola comandos del servidor del juego (:h, :m, :kick, :ban, etc.).
- name: economía
  description: Interacción con el sistema económico (usuarios, comercios, mafias, comercios, publicidad).
- name: API de estadísticas
  description: Obtención de estadísticas de alto rendimiento de servidores de discord y servidores de juegos (en
    línea, participantes, bots).
- name: API de verificación
  description: Búsqueda y comparación de cuentas de Discord ID y Roblox ID.
- name: Activos CDN
  description: Cargue, administre, realice estadísticas y borre la caché de archivos de almacenamiento de objetos
    MinIO/Edge CDN.
- name: Carpetas CDN
  description: Estructura jerárquica y clasificación de carpetas de la biblioteca multimedia CDN.
- name: API de castigo
  description: Administre el saldo y el historial de transacciones de los puntos de los jugadores.
- name: API de suscripciones
  description: Catálogo de planes, pedidos FunPay, acumulación de beneficios y activación de suscripciones.
- name: API de autorización
  description: Inicie sesión a través de Discord y Roblox OAuth2, administre sesiones de usuario y vincule cuentas.
- name: API estatal
  description: Monitoreo del desempeño del servicio, conexiones a PostgreSQL y Redis.
paths:
  /erlc/server:
    get:
      tags:
      - ER:Servidor LC
      summary: Información sobre el servidor ER:LC
      description: 'Devuelve información general sobre el servidor ER:LC (nombre, actual en línea, límite máximo,
        estado).

        Usando parámetros de consulta, puedes solicitar opcionalmente listas de jugadores, personal, cola, registros
        de entradas/salidas, eliminaciones y equipos.'
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Habilite una lista detallada de jugadores en el servidor.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Incluya una lista de personal y moderadores (administradores, mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Habilitar inicio de sesión y cierre de sesión.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Habilite el estado de la cola de espera de conexión.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Habilitar el registro de muertes.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Habilitar el registro de comandos ejecutados.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Habilitar llamadas de moderación activa.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Incluya una lista de vehículos generados.
        schema:
          type: boolean
      responses:
        '200':
          description: Respuesta exitosa con datos del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCServerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:Servidor LC
      summary: Lista de prohibiciones de servidores
      description: Devuelve la lista actual de usuarios bloqueados en el servidor ER:LC.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Lista de usuarios prohibidos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ERLCBanItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - 'ER: Equipos LC'
      summary: Ejecutar un comando en el servidor
      description: 'Envía un comando al servidor ER:LC (por ejemplo, `:h Сообщение`, `:m Внимание`, `:kick Nick`,
        `:ban Nick`).

        Para errores temporales de PRC de red (códigos 1001, 1002, 9999), el comando se coloca automáticamente en
        la cola de reintentos.'
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - command
              properties:
                command:
                  type: string
                  description: Texto del comando con dos puntos (por ejemplo, ":m El servidor se está reiniciando").
                  example: :m Внимание, плановый рестарт через 5 минут
      responses:
        '200':
          description: El comando se envió correctamente al servidor o se puso en cola.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCCommandResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - economía
      summary: Obtener datos económicos
      description: Datos resumidos del sistema financiero Economía (facturación total, impuestos, tesorería).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Datos económicos.
    post:
      tags:
      - economía
      summary: Cambiando los parámetros de la economía
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Actualización exitosa.
  /civops/users:
    get:
      tags:
      - economía
      summary: Perfil de usuario en economía
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Datos del perfil del jugador.
    post:
      tags:
      - economía
      summary: Modificación del perfil de usuario
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Perfil actualizado.
  /civops/businesses:
    get:
      tags:
      - economía
      summary: Lista de empresas
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Lista de empresas registradas.
    post:
      tags:
      - economía
      summary: Crear/Editar Negocios
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: La operación está completa.
  /civops/mafias:
    get:
      tags:
      - economía
      summary: Datos de organizaciones criminales
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Listado de mafias y grupos.
    post:
      tags:
      - economía
      summary: Gestión de grupos
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Estado de operación.
  /civops/government:
    get:
      tags:
      - economía
      summary: Datos de agencias gubernamentales y tesorería.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Estado del presupuesto y departamentos estatales.
    post:
      tags:
      - economía
      summary: Cambiar los parámetros de las estructuras estatales
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: La configuración ha sido actualizada.
  /civops/store:
    get:
      tags:
      - economía
      summary: Tienda de artículos económicos
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Catálogo de productos de la tienda.
    post:
      tags:
      - economía
      summary: Compras/Gestión de Productos
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: El resultado de la transacción.
  /civops/ads:
    get:
      tags:
      - economía
      summary: Lista de anuncios
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Campañas publicitarias activas.
    post:
      tags:
      - economía
      summary: Enviar un anuncio
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: El anuncio ha sido publicado.
  /civops/system:
    get:
      tags:
      - economía
      summary: Economía de la información del sistema
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Versión y configuración económica.
  /civops/health:
    get:
      tags:
      - economía
      summary: Comprobar disponibilidad API económica
      security:
      - BearerAuth: []
      responses:
        '200':
          description: El servicio económico está activo.
  /stats:
    get:
      tags:
      - API de estadísticas
      summary: Estadísticas del servidor universal
      description: 'Punto final de alto rendimiento para monitorear gremios de Discord y servidores de juegos ER:LC.

        Admite múltiples parámetros `servers` y `metrics` (incluidos parámetros de consulta duplicados):

        - `membercount` - participantes en línea;

        - `allmembercount` — número total de participantes del servidor;

        - `botcount` — número de robots;

        - `playercount` - jugadores en línea actuales en ER:LC.'
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Nombres de servidores. Seleccione uno o más servidores de la lista desplegable:

          - `MRP` - Juego de roles de Moscú (admite las 4 métricas)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` - compatible con `membercount`, `allmembercount`, `botcount`

          - `DOT` - solo admite `membercount`'
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Tipos de métricas solicitadas:

          - `playercount` - jugadores en línea en el juego ER:LC (**disponible SÓLO para `MRP`**)

          - `membercount` - número de miembros de Discord en línea (disponible para todos)

          - `allmembercount`: el número total de participantes en el servidor de Discord (todos excepto `DOT`)

          - `botcount` - número de bots en el servidor (todos excepto `DOT`)'
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
        example:
        - playercount
      responses:
        '200':
          description: Un objeto con estadísticas para cada servidor y las métricas solicitadas.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: integer
                example:
                  MRP:
                    membercount: 1450
                    playercount: 38
                  MVD:
                    membercount: 320
                    playercount: 12
        '400':
          $ref: '#/components/responses/BadRequestError'
  /users:
    get:
      tags:
      - API de verificación
      summary: Encontrar enlaces ID de Discord <-> ID de Roblox
      description: 'Busque rápidamente una cuenta vinculada mediante identificadores únicos o por lotes. Pasar ID
        como cadenas: el copo de nieve numérico de Discord pierde precisión en JavaScript. GET con un parámetro
        singular devuelve un objeto; Los parámetros plural y POST siempre devuelven una matriz. Se omiten las conexiones
        faltantes en el lote; el pedido no está garantizado. Lote vacío: HTTP 200 y []. Falta una única conexión:
        HTTP 404.'
      parameters:
      - name: discordId
        in: query
        description: ID de usuario de discordia.
        schema:
          type: string
      - name: robloxId
        in: query
        description: Identificación de usuario de Roblox.
        schema:
          type: string
      - name: discordIds
        in: query
        description: Múltiples ID de Discord separados por comas.
        schema:
          type: string
      - name: robloxIds
        in: query
        description: Múltiples ID de Roblox separadas por comas.
        schema:
          type: string
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersLookupResponse'
              examples:
                single:
                  value:
                    robloxId: '123456789'
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: No se encontró la conexión con un solo GET.
      security:
      - ApiKeyHeader: []
    post:
      tags:
      - API de verificación
      summary: Búsqueda por lotes
      description: 'Búsqueda por lotes de usuarios a través del cuerpo de solicitud JSON. Pasar ID como cadenas:
        el copo de nieve numérico de Discord pierde precisión en JavaScript. GET con un parámetro singular devuelve
        un objeto; Los parámetros plural y POST siempre devuelven una matriz. Se omiten las conexiones faltantes
        en el lote; el pedido no está garantizado. Lote vacío: HTTP 200 y []. Falta una única conexión: HTTP 404.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discordIds:
                  type: array
                  items:
                    type: string
                robloxIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                type: array
                items: &id005
                  type: object
                  properties:
                    discordId: &id001
                      type: string
                    robloxId: *id001
                  required:
                  - discordId
                  - robloxId
              examples:
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: No se encontró la conexión con un solo GET.
      security:
      - ApiKeyHeader: []
  /cdn/manifest:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - Activos CDN
      summary: Manifiesto de archivo de almacenamiento
      description: 'Espacio de nombres de metadatos de instantáneas: éxito, recuento, dominio, activos. Máximo 10.000
        activos; para obtener un catálogo grande y completo, utilice la paginación GET /cdn/assets.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Espacio de nombres. `default` es nuestro dominio general o de cliente.
        schema:
          type: string
        example: acme
      responses:
        '200':
          description: Lista de activos del espacio de nombres.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  domain:
                    type: string
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/CdnAsset'
              examples:
                manifest_ok:
                  summary: Manifest ok
                  value:
                    success: true
                    count: 1
                    domain: default
                    assets:
                    - name: Инструкция
                      slug: manual.png
                      domain: default
                      path: docs/manual.png
                      fullPath: default/docs/manual.png
                      full_path: default/docs/manual.png
                      folderId: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      folder_id: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      sourceType: LOCAL
                      source_type: LOCAL
                      sourceUrl: default/docs/manual.png
                      source_url: default/docs/manual.png
                      isPinned: true
                      is_pinned: 1
                      mimeType: image/png
                      mime_type: image/png
                      size: 70
                      sha256: c2153f77e11087fcb078ae38527fa83bef29791e3700e30cc87fec4405a66d0f
                      downloads: 0
                      createdAt: '2026-10-06T14:56:09.0798434Z'
                      created_at: '2026-10-06T14:56:09.0798434Z'
                      updatedAt: '2026-10-06T14:56:09.0798434Z'
                      updated_at: '2026-10-06T14:56:09.0798434Z'
                      folder:
                        name: Документы
                        slug: docs
        '401':
          description: 'No autorizado (401): la clave no se transfirió.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: 'Prohibido (403): hay una clave, pero no suficientes derechos.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: Se ha alcanzado el límite de solicitudes. Considere Reintentar después y retry_after; No
            ejecute descargas paralelas ilimitadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
                retry_after: 30
                details:
                  count: 21
                  excess: 1
                  limit: 20
                  reset_at: 1792083600000
  /cdn/assets:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - Activos CDN
      summary: Lista de activos
      description: 'Sin ruta: activos, paginación, estadísticas, éxito. Con ruta exacta sin identificadores ni prefijo:
        activo, éxito. El límite predeterminado es 50, máximo 100. totalPages mínimo 1 incluso para un resultado
        vacío.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Espacio de nombres (primer segmento de la ruta del archivo).
        schema:
          type: string
        example: acme
      - name: path
        in: query
        required: false
        description: La ruta exacta del activo dentro del espacio de nombres.
        schema:
          type: string
        example: branding/logo.png
      - name: prefix
        in: query
        required: false
        description: Prefijo de ruta para seleccionar un grupo de archivos.
        schema:
          type: string
        example: branding/
      - name: folderId
        in: query
        required: false
        description: 'ID de la carpeta de la interfaz de usuario. La carpeta es solo una agrupación visual y no
          afecta la ruta del archivo.

          `root` o `null`: archivos sin carpeta, `all`, sin filtro.'
        schema:
          type: string
        example: root
      - name: search
        in: query
        required: false
        description: Busque por nombre, slug y ruta completa.
        schema:
          type: string
      - name: sourceType
        in: query
        required: false
        description: Filtrar por tipo de fuente.
        schema:
          type: string
          enum:
          - LOCAL
          - EXTERNAL
          - all
      - name: isPinned
        in: query
        required: false
        description: Filtrar fijando.
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        description: Número de página a partir de 1.
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        description: Número de elementos por página, máximo 100.
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success: &id002
                      type: boolean
                    asset:
                      $ref: '#/components/schemas/CdnAsset'
                  required:
                  - success
                  - asset
                - type: object
                  properties:
                    success: *id002
                    assets:
                      type: array
                      items:
                        $ref: '#/components/schemas/CdnAsset'
                    pagination:
                      type: object
                      properties:
                        page: &id003
                          type: integer
                        limit: *id003
                        total: *id003
                        totalPages: *id003
                    stats:
                      $ref: '#/components/schemas/CdnStats'
                  required:
                  - success
                  - assets
                  - pagination
                  - stats
              examples:
                emptyList:
                  value:
                    success: true
                    assets: []
                    pagination:
                      page: 1
                      limit: 50
                      total: 0
                      totalPages: 1
                    stats:
                      totalAssets: 0
                      total_assets: 0
                      totalFolders: 0
                      total_folders: 0
                      pinnedAssets: 0
                      pinned_assets: 0
                      localAssets: 0
                      local_assets: 0
                      externalAssets: 0
                      external_assets: 0
                      totalBytes: 0
                      total_bytes: 0
                      totalDownloads: 0
                      total_downloads: 0
        '401':
          description: 'No autorizado (401): la clave no se transfirió.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: 'Prohibido (403): hay una clave, pero no suficientes derechos.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '404':
          description: 'No encontrado (404): recurso no encontrado.'
          content:
            application/json:
              examples:
                asset_not_found:
                  summary: Asset not found
                  value:
                    code: 5041
                    message: Asset Not Found
        '429':
          description: Se ha alcanzado el límite de solicitudes. Considere Reintentar después y retry_after; No
            ejecute descargas paralelas ilimitadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
                retry_after: 30
                details:
                  count: 21
                  excess: 1
                  limit: 20
                  reset_at: 1792083600000
    post:
      tags:
      - Activos CDN
      summary: Carga de archivos
      description: 'Cargue datos multiparte/formulario con el campo de archivo. No establezca el tipo de contenido
        manualmente: el cliente debe agregar un límite. el dominio y la ruta se pueden pasar a multiparte; El dominio
        multiparte explícito tiene prioridad sobre la consulta. Para fragmentos, utilice compress=false y MIME text/javascript
        o text/css. Se admiten la ruta _next/static y los nombres _app.js. Respuesta HTTP 200, no 201. Al volver
        a intentar una ruta obviamente ocupada se devuelve 409 sin reescribir. Archivo máximo 250 MiB. los valores
        predeterminados de compresión son verdaderos: JPEG/PNG hasta 24 megapíxeles; Los vídeos requieren FFmpeg/FFprobe.
        El resultado de la optimización se guarda solo si es más pequeño que el original.'
      security:
