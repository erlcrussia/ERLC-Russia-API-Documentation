        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
            example:
              name: Бот поддержки
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              example:
                id: '21'
                token: sk-chat-3...0a1c
                name: Бот поддержки
                created_at: '2026-10-21T12:00:00Z'
