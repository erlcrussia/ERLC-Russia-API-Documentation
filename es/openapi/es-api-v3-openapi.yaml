      type: object
      properties:
        id:
          type: string
          example: '1'
        key:
          type: string
          example: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
        apiKey:
          type: string
          example: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
        userId:
          type: string
          example: '403258784102940682'
        serverId:
          type: string
          example: srv_8f9a2b1c4e
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          example: '2026-09-01T12:00:00.000Z'
        restrictions:
          type: object
          properties:
            endpoints:
              type: array
              items:
                type: string
              example:
              - erlc.server
              - civops.economy
            versions:
              type: array
              items:
                type: string
              example:
              - v3
            queryParams:
              type: array
              items:
                type: string
              example:
              - Players
              - Staff
            actions:
              type: array
              items:
                type: string
              example:
              - webhook:add
              - logs:read
    WebSocketKeyItem:
      type: object
      properties:
        id:
          type: string
          example: '1'
        key:
          type: string
          example: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
        apiKey:
          type: string
          example: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
        userId:
          type: string
          example: '403258784102940682'
        serverId:
          type: string
          example: srv_3d5e7f9a1b
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          example: '2026-09-01T12:00:00.000Z'
        restrictions:
          type: object
          properties:
            channels:
              type: array
              items:
                type: string
              example:
              - server:players
              - server:logs
            blockedIPs:
              type: array
              items:
                type: object
                properties:
                  ipAddress:
                    type: string
                  reason:
                    type: string
                  expiresAt:
                    type: string
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          example: 5009
          description: Código de error numérico ER:LC Rusia API.
        message:
          type: string
          example: Forbidden
          description: Mensaje de error del sistema en inglés.
    CdnAsset:
      type: object
      description: Activo organizacional; dominio/ruta y fullPath especifican la clave MinIO. folderId especifica
        la agrupación.
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        domain:
          type: string
          description: Espacio de nombres, primer segmento de ruta.
          example: default
        path:
          type: string
          description: Una ruta dentro de un espacio de nombres.
          example: branding/logo.png
        fullPath:
          type: string
          description: Ruta completa `{domain}/{path}`.
          example: default/branding/logo.png
        full_path:
          type: string
        folderId:
          type:
          - string
          - 'null'
        folder_id:
          type:
          - string
          - 'null'
        folder:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
        sourceType:
          type: string
          enum:
          - LOCAL
          - EXTERNAL
        source_type:
          type: string
        sourceUrl:
          type: string
          description: 'Para LOCAL: la clave del objeto en MinIO, para EXTERNO: la dirección original.'
        source_url:
          type: string
        isPinned:
          type: boolean
        is_pinned:
          type: integer
        mimeType:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          description: Tamaño en bytes.
        sha256:
          type:
          - string
          - 'null'
        downloads:
          type: integer
          description: Siempre 0, los archivos se envían por borde directamente desde MinIO.
        createdAt:
          type: string
        created_at:
          type: string
        updatedAt:
          type: string
        updated_at:
          type: string
        teamId:
          type: string
    CdnFolder:
      type: object
      description: Carpeta de organización. Cambiar el nombre y cambiar pathEnabled no reescribe la URL de los archivos
        ya descargados.
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        pathEnabled:
          type: boolean
          default: true
          description: Agrega carpetas slug solo a las descargas nuevas sin una ruta especificada explícitamente.
            false deja la carpeta como un grupo de interfaz.
        sortOrder:
          type: integer
        sort_order:
          type: integer
        asset_count:
          type: integer
        createdAt:
          type: string
        created_at:
          type: string
        updatedAt:
          type: string
        updated_at:
          type: string
        teamId:
          type: string
    CdnStats:
      type: object
      description: Resumen de almacenamiento, no se utiliza un punto final de estadísticas independiente.
      properties:
        totalAssets:
          type: integer
        total_assets:
          type: integer
        totalFolders:
          type: integer
        total_folders:
          type: integer
        pinnedAssets:
          type: integer
        pinned_assets:
          type: integer
        localAssets:
          type: integer
        local_assets:
          type: integer
        externalAssets:
          type: integer
        external_assets:
          type: integer
        totalBytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        totalDownloads:
          type: integer
          format: int64
        total_downloads:
          type: integer
          format: int64
    APIError:
      type: object
      properties:
        code: *id003
        message: *id001
        error: *id001
        details:
          type: object
          additionalProperties: true
        retry_after: *id003
      required:
      - code
      - message
    CDNCustomDomain:
      type: object
      properties:
        id: *id001
        domain: *id001
        teamId:
          type:
          - string
          - 'null'
        scope: *id001
        type:
          type: string
          const: cdn
        userId:
          type:
          - string
          - 'null'
        isVerified: *id002
        cnameVerified: *id002
        cfStatus:
          type:
          - string
          - 'null'
        cfSslStatus:
          type:
          - string
          - 'null'
        cfCustomHostnameId:
          type:
          - string
          - 'null'
        originUrl:
          type:
          - string
          - 'null'
        deployHookToken:
          type:
          - string
          - 'null'
          writeOnly: false
        s3Backup: *id002
        ownershipName:
          type:
          - string
          - 'null'
        ownershipValue:
          type:
          - string
          - 'null'
        sslTxtName:
          type:
          - string
          - 'null'
        sslTxtValue:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _count:
          type: object
          properties:
            shortLinks: *id003
      required:
      - id
      - domain
      - isVerified
  responses:
    BadRequestError:
      description: 'Solicitud incorrecta (400): parámetros de solicitud no válidos.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_params:
              summary: Missing Parameters (5002)
              value:
                code: 5002
                message: Missing Parameters
            invalid_json:
              summary: Invalid JSON (5034)
              value:
                code: 5034
                message: Invalid Json
            invalid_param:
              summary: Invalid Param Name (5004)
              value:
                code: 5004
                message: Invalid Param Name
    UnauthorizedError:
      description: 'No autorizado (401): falta el token de API o no es válido.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_token:
              summary: Missing Token (5007)
              value:
                code: 5007
                message: Missing Token
            invalid_token:
              summary: Invalid Token (5008)
              value:
                code: 5008
                message: Invalid Token
    ForbiddenError:
      description: 'Prohibido (403): el acceso está prohibido (restricciones de clave, acción o servidor).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Forbidden (5009)
              value:
                code: 5009
                message: Forbidden
    NotFoundError:
      description: 'No encontrado (404): no se encontró el recurso solicitado.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              summary: Resource Not Found (5020)
              value:
                code: 5020
                message: Not Found
            token_not_found:
              summary: Token Not Found (5013)
              value:
                code: 5013
                message: Token Not Found
    RateLimitError:
      description: 'Demasiadas solicitudes (429): se superó el límite de solicitudes.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limit:
              summary: Rate Limit Exceeded (5016)
              value:
                code: 5016
                message: Rate Limit Exceeded
    InternalServerError:
      description: 'Error interno del servidor (500): error interno del servidor.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              summary: Internal Error (5017)
              value:
                code: 5017
                message: Internal Error
  parameters:
    XCacheRefresh:
      name: x-cache-refresh
      in: header
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      description: Restablecimiento forzado de la caché económica de Redis cuando se establece en "verdadero".
