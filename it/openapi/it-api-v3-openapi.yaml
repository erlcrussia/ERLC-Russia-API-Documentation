          description: Доступ запрещён (кампания принадлежит другому пользователю).
        '404':
          description: Кампания не найдена.

  /ads/campaigns/{id}/buy:
    post:
      tags:
      - Рекламные кампании V3
      summary: Покупка показов рекламы
      description: Покупка пакета показов за eCoins для одобренной модератором кампании.
      security:
      - CookieAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        example: "camp_0123456789abcdef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [impressions, costCoins]
              properties:
                impressions: {type: integer, enum: [500, 1500, 5000, 10000], example: 1500}
                costCoins: {type: integer, enum: [45, 120, 350, 600], example: 120}
      responses:
        '200':
          description: Показы успешно начислены, кампания активирована.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdCampaign'
        '400':
          description: Кампания ещё не одобрена модератором или выбран неверный пакет.
        '402':
          description: Недостаточно eCoins на балансе пользователя.

