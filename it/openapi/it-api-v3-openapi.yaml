      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: integer
                  minimum: 1
                reason:
                  type: string
      responses:
        '200':
          description: I punti sono stati cancellati con successo.
  /points/{serverId}/{robloxId}:
    get:
      tags:
      - API di punizione
      summary: Saldo punti
      description: Alias della variante userId con esplicita indicazione del server. serverId viene preso dal percorso
        e deve corrispondere al ServerID della chiave API; robloxId - ID giocatore Roblox. Sono supportati anche
        i fallback delle query userId/robloxId e i campi del corpo userId/robloxId per l'aggiunta/rimozione.
      parameters:
      - name: serverId
        in: path
        required: true
        schema:
          type: string
      - name: robloxId
        in: path
        required: true
        description: ID giocatore Roblox.
        schema:
          type: string
      - name: userId
        in: query
        required: false
        schema:
          type: string
      - name: robloxId
        in: query
        required: false
        schema:
          type: string
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Saldo punti attuale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsBalanceResponse'
  /points/{serverId}/{robloxId}/history:
    get:
      tags:
      - API di punizione
      summary: Cronologia punti
      parameters:
      - name: serverId
        in: path
        required: true
        schema:
          type: string
      - name: robloxId
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Limite di record (predefinito 50, massimo 100).
        schema:
          type: integer
          default: 50
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Storia di addebiti e cancellazioni.
  /points/{serverId}/{robloxId}/add:
    post:
      tags:
      - API di punizione
      summary: Accumulo di punti
      parameters:
      - name: serverId
        in: path
        required: true
        schema:
          type: string
      - name: robloxId
        in: path
        required: true
        schema:
          type: string
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                itemId:
                  type: string
                userId:
                  type: string
                robloxId:
                  type: string
      responses:
        '200':
          description: I punti sono stati assegnati con successo.
  /points/{serverId}/{robloxId}/remove:
    post:
      tags:
      - API di punizione
      summary: Cancellazione dei punti
      parameters:
      - name: serverId
        in: path
        required: true
        schema:
          type: string
      - name: robloxId
        in: path
        required: true
        schema:
          type: string
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                itemId:
                  type: string
                userId:
                  type: string
                robloxId:
                  type: string
      responses:
        '200':
          description: I punti sono stati cancellati con successo.
  /subscriptions/config/funpay:
    get:
      tags:
      - API degli abbonamenti
      summary: Configurazione del negozio FunPay
      description: Restituisce un elenco di lotti disponibili per l'acquisto, prezzi e descrizioni dei prodotti
        FunPay.
      responses:
        '200':
          description: Configurazione prodotto.
  /subscriptions/config/plans:
    get:
      tags:
      - API degli abbonamenti
      summary: Piani tariffari e limiti
      description: Restituisce una matrice di piani di abbonamento (gratuito, Premium, Enterprise), limiti di richiesta
        e funzionalità disponibili.
      responses:
        '200':
          description: Catalogo dei piani.
  /subscriptions/store:
    get:
      tags:
      - API degli abbonamenti
      summary: Vetrina del negozio
      description: Alias GET /subscriptions/config/plans. Restituisce un catalogo di piani tariffari e limiti.
      responses:
        '200':
          description: Catalogo dei piani.
  /subscriptions/user:
    get:
      tags:
      - API degli abbonamenti
      summary: Abbonamenti utente attivi
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Elenco degli abbonamenti attuali con date di scadenza.
  /subscriptions/user-benefits:
    get:
      tags:
      - API degli abbonamenti
      summary: Vantaggi per gli utenti attivi
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Elenco riepilogativo delle opzioni abilitate (ruoli, limiti, accessi).
  /subscriptions/funpay/create-order:
    post:
      tags:
      - API degli abbonamenti
      summary: Creazione di un ordine FunPay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - planId
              properties:
                planId:
                  type: string
                discordId:
                  type: string
      responses:
        '200':
          description: L'ordine è stato completato. Viene restituito un codice di verifica.
  /subscriptions/funpay/order-status/{code}:
    get:
      tags:
      - API degli abbonamenti
      summary: Controllo dello stato dell'ordine FunPay
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stato del pagamento e dell'attivazione dell'ordine.
  /subscriptions/purchase-with-coins:
    post:
      tags:
      - API degli abbonamenti
      summary: Acquistare un abbonamento con le monete
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - planId
              properties:
                planId:
                  type: string
      responses:
        '200':
          description: L'abbonamento è stato acquistato con monete cancellate dal saldo.
  /subscriptions/user-limits:
    get:
      tags:
      - API degli abbonamenti
      summary: Limiti di punti e privilegi utente
      description: Restituisce il limite attivo di punti (violazioni) dell'utente, tenendo conto di tutti gli abbonamenti
        e vantaggi attivi (VIP, Premium, Booster, Tverskaya, Cremlino).
      parameters:
      - name: discordId
        in: query
        required: false
        schema:
          type: string
        description: ID utente Discord (se non specificato, preso dalla sessione).
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Informazioni sui limiti e sugli stati attivi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  discordId:
                    type: string
                    example: '403258784102940682'
                  violationLimit:
                    type: integer
                    example: 50
                  hasVip:
                    type: boolean
                    example: false
                  hasPremium:
                    type: boolean
                    example: true
                  hasBooster:
                    type: boolean
                    example: false
                  hasTverskaya:
                    type: boolean
                    example: true
                  hasKreml:
                    type: boolean
                    example: false
  /subscriptions/user-limits/{discordId}:
    get:
      tags:
      - API degli abbonamenti
      summary: Limiti di punti per ID Discord
      description: Restituisce i limiti di violazione e i flag di privilegio per uno specifico ID Discord.
      parameters:
      - name: discordId
        in: path
        required: true
        schema:
          type: string
        description: ID utente discorde.
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Limiti utente.
  /subscriptions/coins/balance:
    get:
      tags:
      - API degli abbonamenti
      summary: Saldo E-Coin dell'utente
      description: Restituisce il saldo attuale della valuta interna delle monete elettroniche per l'ID Discord
        o la sessione corrente specificati.
      parameters:
      - name: discordId
        in: query
        required: false
        schema:
          type: string
        description: ID utente Discord (se non specificato, preso dalla sessione).
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Saldo delle monete elettroniche.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  discordId:
                    type: string
                    example: '403258784102940682'
                  coins:
                    type: integer
                    example: 1250
  /auth/discord:
    get:
      tags:
      - API di autorizzazione
      summary: Autorizzazione tramite Discord
      description: Inizializza il flusso Discord OAuth2 e reindirizza l'utente alla pagina di consenso Discord.
      responses:
        '302':
          description: Reindirizzamento a discord.com/oauth2/authorize.
  /auth/discord/callback:
    get:
      tags:
      - API di autorizzazione
      summary: Discord OAuth2 Callback
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Impostazione del cookie `erlc_auth` e reindirizzamento al tuo account personale.
  /auth/roblox:
    get:
      tags:
      - API di autorizzazione
      summary: Autorizzazione tramite Roblox
      description: Inizializza il flusso Roblox OAuth2. Supporta il parametro `token` per la verifica da un bot
        Discord.
      parameters:
      - name: token
        in: query
        description: Token bot HMAC per l'associazione di sessioni.
        schema:
          type: string
      responses:
        '302':
          description: Reindirizzamento a roblox.com/oauth/v1/authorize.
  /auth/roblox/callback:
    get:
      tags:
      - API di autorizzazione
      summary: Roblox OAuth2 Callback
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Reindirizzamento a `https://erlcrussia.com/<lang>/login` (in caso di successo) o `.../login/roblox`
            (in caso di errore).
  /auth/session:
    get:
      tags:
      - API di autorizzazione
      summary: Controllo della sessione utente
      description: Controlla la validità del token di sessione dal cookie o dall'intestazione `erlc_auth`.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Sessione attiva e dati del profilo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
  /auth/me:
    get:
      tags:
      - API di autorizzazione
      summary: Profilo utente autorizzato corrente
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Dati del profilo (Discord, Roblox, ruoli, avatar).
  /auth/logout:
    post:
      tags:
      - API di autorizzazione
      summary: Conclusione di una sessione
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Sessione eliminata, cookie cancellati.
  /auth/user/roblox:
    post:
      tags:
      - API di autorizzazione
      summary: Collegamento dell'account Roblox
      security:
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - robloxId
              - robloxName
              properties:
                discordId:
                  type: string
                robloxId:
                  type: string
                robloxName:
                  type: string
                robloxDisplayName:
                  type: string
                robloxAvatar:
                  type: string
      responses:
        '200':
          description: L'account Roblox è collegato.
    delete:
      tags:
      - API di autorizzazione
      summary: Scollegamento dell'account Roblox
      security:
      - CookieAuth: []
      responses:
        '200':
          description: L'account Roblox è stato scollegato.
  /auth/user/roblox/refresh:
    patch:
      tags:
      - API di autorizzazione
      summary: Aggiornamento della cache del profilo Roblox
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Dati Roblox e avatar aggiornati.
  /auth/user/sessions:
    get:
      tags:
      - API di autorizzazione
      summary: Elenco delle sessioni utente attive
      description: Restituisce un elenco di tutte le sessioni API e browser attive con indirizzi IP e dispositivi.
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Elenco delle sessioni.
    delete:
      tags:
      - API di autorizzazione
      summary: Fine di tutte le altre sessioni
      security:
      - CookieAuth: []
      responses:
        '200':
          description: Tutte le sessioni tranne quella attuale sono terminate.
  /auth/user/sessions/{id}:
    delete:
      tags:
      - API di autorizzazione
      summary: Revisione di una sessione specifica
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - CookieAuth: []
      responses:
        '200':
          description: La sessione è stata revocata.
  /auth/user/roblox/reverify:
    patch:
      tags:
      - API di autorizzazione
      summary: Ripristino Roblox per la nuova verifica
      description: Scollega l'account Roblox collegato dalla sessione corrente per sottoporlo a una nuova verifica.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: L'associazione è stata reimpostata.
  /auth/user/profile:
    patch:
      tags:
      - API di autorizzazione
      summary: Sincronizzazione del tuo profilo con Discord
      description: Forza una richiesta per l'avatar corrente, la decorazione dell'avatar e il nome utente dall'API
        Discord e aggiorna la voce nel database.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Il profilo è stato aggiornato con successo.
  /ai/credits/balance:
    get:
      tags:
      - AI Studio
      summary: Saldo del credito AI
      description: Restituisce il saldo di crediti AI, monete, tasso di cambio (1 moneta = 1 credito AI) e scala
        dei prezzi (niya-1, emmy-1, hubert-1) per il proprietario della chiave API trasferita.
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: Saldo di crediti e monete.
        '401':
          description: Non autorizzato.
  /ai/credits/exchange:
    post:
      tags:
      - AI Studio
      summary: Scambia monete con crediti AI
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - coins
              properties:
                coins:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Monete scambiate (successo, exchanged_coins, credits_added, new_credits, remaining_coins).
  /ai/keys:
    get:
      tags:
      - AI Studio
      summary: Elenco delle chiavi AI
      description: Restituisce le chiavi nel formato sk-agent-*/sk-chat-*/sk-voice-* dell'utente corrente (id, token,
        nome, ambito, created_at, is_active, tools_enabled).
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: Elenco delle chiavi.
    post:
      tags:
      - AI Studio
      summary: Creazione di una chiave AI
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Studio Key
                scope:
                  type: string
                  enum:
                  - agent
                  - chat
                  - voice
      responses:
        '200':
          description: La chiave è stata creata (id, token, nome, ambito, created_at, is_active, tools_enabled).
    delete:
      tags:
      - AI Studio
      summary: Rimozione di una chiave AI (tramite Intestazione/Corpo/Query)
      description: Elimina la chiave AI dell'utente corrente. La chiave di cancellazione può essere passata nell'intestazione
        `target-api-key` (o `token`), nel corpo JSON `{"token":"..."}`, tramite il parametro di query `?token=...`,
        oppure senza parametri (per revocare la chiave di richiesta stessa).
      parameters:
      - name: target-api-key
        in: header
        required: false
        description: Token della chiave eliminata
        schema:
          type: string
      - name: token
        in: query
        required: false
        description: Token della chiave eliminata
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: integer
      responses:
        '200':
          description: 'Chiave eliminata ({successo: true, eliminata: true, token: "..."}).'
  /ai/keys/{id}:
    delete:
      tags:
      - AI Studio
      summary: Rimozione di una chiave AI tramite ID/token in un URL
      description: Rimuove la chiave AI dell'utente corrente tramite token o ID numerico nel percorso URL.
      parameters:
      - name: id
        in: path
        required: true
        description: Token chiave (sk-chat-...) o ID numerico.
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: 'Chiave eliminata ({successo: true, eliminata: true, token: "..."}).'
  /ai/audio/pricing:
    get:
      tags:
      - AI Audio
      summary: Тарифы и ограничения голосового API
      description: Возвращает модель, стоимость, максимальную длительность и формат аудио для распознавания речи.
      responses:
        '200':
          description: Параметры голосового API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: {type: string}
                  credits_per_minute: {type: number}
                  speech_credits_per_1000_characters: {type: number}
                  speech_max_characters: {type: integer}
                  speech_voice: {type: string}
                  billing_unit: {type: string}
                  max_duration_seconds: {type: integer}
                  format: {type: string}
  /ai/audio/transcriptions:
    post:
      tags:
      - AI Audio
      summary: Распознавание речи
      description: Принимает WAV в mono PCM 16-bit 16000 Hz длительностью до 120 секунд. Нужен AI-ключ с правом voice.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          default: ru
      responses:
        '200':
          description: Распознанный текст и сведения о списании кредитов.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: {type: string}
                  model: {type: string}
                  duration_seconds: {type: number}
                  credits_charged: {type: number}
        '400':
          description: Некорректный или повреждённый WAV-файл.
        '401':
          description: AI-ключ отсутствует или недействителен.
        '413':
          description: Аудио длиннее 120 секунд.
        '415':
          description: Требуется Content-Type audio/wav.
        '503':
          description: Сервис распознавания недоступен.
  /ai/title:
    post:
      tags:
      - AI Studio
      summary: Generazione del titolo della chat
      description: Genera un titolo di chat conciso (2-4 parole). Per le chiavi API personalizzate, cancella i crediti
        AI in base ai token. Funziona senza limiti con la chiave principale. Una chiave AI esecutiva non fornisce
        i diritti per gestire crediti, altre chiavi, CDN o reindirizzamenti.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                locale:
                  type: string
                  default: ru
                model:
                  type: string
      responses:
        '200':
          description: Titolo generato ({titolo, successo, cost_credits, utilizzo}).
  /ads/upload:
    post:
      tags:
      - Рекламные кампании V3
      summary: Загрузка баннера рекламы
      description: Загружает изображение баннера на images.erlcrussia.com (максимум 5 МБ, форматы PNG, JPEG, WebP, GIF, AVIF).
      security:
      - CookieAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Баннер успешно загружен.
          content:
            application/json:
              schema:
                type: object
                required: [bannerUrl, size, mimeType, domain, path]
                properties:
                  bannerUrl: {type: string, example: "https://images.erlcrussia.com/ads/banners/0123456789abcdef.png"}
                  size: {type: integer, example: 245000}
                  mimeType: {type: string, example: "image/png"}
                  domain: {type: string, example: "images.erlcrussia.com"}
                  path: {type: string, example: "ads/banners/0123456789abcdef.png"}
        '400':
          description: Недопустимый формат файла или повреждённые данные.
        '401':
          description: Требуется авторизация пользователя.
        '413':
          description: Размер файла превышает 5 МБ.

  /ads/campaigns:
    get:
      tags:
      - Рекламные кампании V3
      summary: Список рекламных кампаний
      description: Возвращает все рекламные кампании текущего пользователя.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Список кампаний.
          content:
            application/json:
              schema:
                type: object
                required: [campaigns]
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdCampaign'
    post:
      tags:
      - Рекламные кампании V3
      summary: Создание рекламной кампании
      description: Создаёт новую заявку на рекламную кампанию со списанием 10 eCoins за модерацию.
      security:
      - CookieAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, bannerUrl, targetUrl]
              properties:
                title: {type: string, example: "Сервер Moscow RP"}
