components:
  securitySchemes:
    AIManagementKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Chiave API utente regolare per la gestione dei prestiti e chiavi AI; executive sk-chat/sk-agent/sk-voice
        non sono consentiti.
    AIExecutionKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Tasto esecutivo sk-chat/sk-agent/sk-voice in base al metodo.
    BearerAuth:
      type: http
      scheme: bearer
      description: Chiave API nell'intestazione Autorizzazione nel formato `Bearer <token>`.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-key
      description: Chiave API personalizzata. Memorizzare sul server; non includere JavaScript lato client.
    WebSocketKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-websocket-key
      description: Intestazione della chiave WebSocket singola erlcrussia-websocket-key.
    CookieAuth:
      type: apiKey
      in: cookie
      name: erlc_auth
      description: Cookie di autorizzazione di sessione solo HTTP sul portale.
    CDNDeployToken:
      type: apiKey
      in: header
      name: erlcrussia-api-cdn-token
      description: Un token di distribuzione separato per un dominio CDN verificato.
  schemas:
    UserAsset:
      type: object
      required:
      - id
      - domain
      - path
      - name
      - mimeType
      - kind
      - status
      - url
      - size
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
        domain:
          type: string
        path:
          type: string
        name:
          type: string
        mimeType:
          type: string
        kind:
          type: string
        status:
          type: string
        url:
          type: string
        size:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    CoinOperation:
      type: object
      required:
      - id
      - resourceKey
      - discordId
      - amount
      - state
      properties:
        id:
          type: string
        resourceKey:
          type: string
        discordId:
          type: string
        amount:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - pending
          - deducted
          - refunded
        remainingCoins:
          type:
          - integer
          - 'null'
        refundBalance:
          type:
          - integer
          - 'null'
        reason:
          type:
          - string
          - 'null'
        replayed:
          type: boolean
    CDNAssetListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CDNAsset'
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 6
    UsersLookupResponse:
      oneOf:
      - type: object
        properties:
          discordId: *id001
        required:
        - discordId
        additionalProperties: false
      - type: object
        properties:
          robloxId: *id001
        required:
        - robloxId
        additionalProperties: false
      - type: object
        properties:
