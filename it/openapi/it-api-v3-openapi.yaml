openapi: 3.1.0
info:
  title: ER:LC Russia API V3
  description: API ER:LC Russia per server, utenti, CDN, reindirizzamenti, abbonamenti e chiavi di accesso.
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
  description: Server di produzione (com)
- url: https://api.erlcrussia.xyz/v3
  description: Server di backup (xyz)
tags:
- name: ER:Server LC
  description: Ottenere status, online, elenchi di giocatori e staff del server ER:LC.
- name: 'ER: Squadre LC'
  description: Invio e accodamento di comandi del server di gioco (:h, :m, :kick, :ban, ecc.).
- name: Economia
  description: Interazione con il sistema economico (utenti, imprese, mafie, negozi, pubblicità).
- name: API statistiche
  description: Statistiche di acquisizione ad alte prestazioni dei server Discord e dei server di gioco (online, partecipanti, bot).
- name: API di verifica
  description: Ricerca e confronto di account Discord ID e Roblox ID.
- name: Risorse CDN
  description: Carica, gestisci, esegui statistiche e cancella la cache dei file di archiviazione di oggetti CDN MinIO/Edge.
- name: Cartelle CDN
  description: Struttura gerarchica e ordinamento delle cartelle della libreria multimediale CDN.
- name: API di punizione
  description: Gestisci il saldo e la cronologia delle transazioni dei punti dei giocatori.
- name: API degli abbonamenti
  description: Catalogo dei piani, ordini FunPay, maturazione dei vantaggi e attivazione degli abbonamenti.
- name: API di autorizzazione
  description: Accedi tramite Discord e Roblox OAuth2, gestisci le sessioni utente e collega gli account.
- name: 'API di gestione: chiavi WebSocket'
  description: Gestione delle chiavi di accesso al gateway WebSocket e agli abbonamenti ai canali.
- name: 'API di gestione: webhook'
  description: Registrazione, convalida dell'accessibilità e monitoraggio dei webhook personalizzati.
- name: API di controllo - Pannello
  description: Gestione utenti, abbonamenti, tariffe, saldo manuale e statistiche di sistema.
- name: API di stato
  description: Monitoraggio delle prestazioni del servizio, connessioni a PostgreSQL e Redis.
- name: AI Audio
- name: AI Studio
- name: 'API di amministrazione: server'
- name: API di gestione - Server
- name: 'API di gestione: token'
- name: Amministrazione AI
- name: Amministrazione delle monete elettroniche
- name: CDN
- name: CDN V3
- name: Chiavi API
- name: Domini CDN
- name: File privati e libreria
- name: L'organizzazione reindirizza la V3
- name: Webhook personalizzati
- name: Рекламные кампании V3
paths:
  /erlc/server:
    get:
      tags:
      - ER:Server LC
      summary: Informazioni
      description: Nome, giocatori online e stato. Con i parametri si aggiungono giocatori, staff, coda e registri.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Включить детальный список игроков на сервере.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Включить список сотрудников и модераторов (Admins, Mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Включить журнал входов и выходов.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Включить состояние очереди ожидания подключения.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Включить журнал убийств.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Включить журнал выполненных команд.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Включить активные вызовы модераторов.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Включить список заспавненных транспортных средств.
        schema:
          type: boolean
      responses:
        '200':
          description: Risposta riuscita con i dati del server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Name:
                    type: string
                  OwnerId:
                    type: integer
                  CoOwnerIds:
                    type: array
                    items:
                      type: integer
                  CurrentPlayers:
                    type: integer
                  MaxPlayers:
                    type: integer
                  JoinKey:
                    type: string
                  AccVerifiedReq:
                    type: string
                  TeamBalance:
                    type: boolean
                  Players:
                    type: array
                    items:
                      type: object
                      properties:
                        Player:
                          type: string
                        Permission:
                          type: string
                        Callsign:
                          type: string
                        Team:
                          type: string
                  Queue:
                    type: array
                    items:
                      type: integer
              example:
                Name: Moscow RolePlay I RU
                OwnerId: 1234567
                CoOwnerIds:
                - 7654321
                CurrentPlayers: 32
                MaxPlayers: 40
                JoinKey: MRPRU
                AccVerifiedReq: Disabled
                TeamBalance: true
                Players:
                - Player: Builderman:156
                  Permission: Server Administrator
                  Callsign: 1-A-12
                  Team: Police
                Queue:
                - 261
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:Server LC
      summary: Ban del server
      description: Giocatori bannati del server ER:LC.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Elenco degli utenti esclusi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  '156':
                    type: string
                  '261':
                    type: string
              example:
                '156': Builderman
                '261': Shedletsky
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - 'ER: Squadre LC'
      summary: Esegui un comando
      description: Esegue un comando sul server ER:LC, ad esempio `:h Messaggio`. In caso di errore temporaneo viene ritentato.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: Текст команды с двоеточием (например, ":m Сервер перезагружается").
            example:
              command: :h Сервер перезапустится через 5 минут
      responses:
        '200':
          description: Il comando è stato inviato con successo al server o messo in coda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                  QueueSize:
                    type: integer
              example:
                Status: Queued
                QueueSize: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - Economia
      summary: 'Economia: denaro dei giocatori'
      description: Saldo del giocatore, classifica, posizione e attese dei comandi.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Dati economici.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                cash: 15000
                bank: 82000
                rank: 14
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  cash:
                    type: integer
                  bank:
                    type: integer
                  rank:
                    type: integer
    post:
      tags:
      - Economia
      summary: 'Economia: operazioni'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fromUserId:
                  type: string
                toUserId:
                  type: string
                amount:
                  type: integer
            example:
              fromUserId: '123456789012345678'
              toUserId: '234567890123456789'
              amount: 500
      responses:
        '200':
          description: Aggiornamento riuscito.
          content:
            application/json:
              example:
                success: true
                fromUserId: '123456789012345678'
                toUserId: '234567890123456789'
                amount: 500
                newBalance:
                  cash: 14500
                  bank: 82000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  fromUserId:
                    type: string
                  toUserId:
                    type: string
                  amount:
                    type: integer
                  newBalance:
                    type: object
                    properties:
                      cash:
                        type: integer
                      bank:
                        type: integer
      description: Trasferimenti, banca, aggiunta, rimozione, azzeramento di saldo e attese.
  /civops/users:
    get:
      tags:
      - Economia
      summary: 'Economia: giocatore'
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Dati del profilo del giocatore.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                inventory:
                - name: Аптечка
                  amount: 2
                  description: Восстанавливает здоровье
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  inventory:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: integer
                        description:
                          type: string
      description: Inventario e cronologia delle operazioni del giocatore.
    post:
      tags:
      - Economia
      summary: 'Economia: inventario'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                item:
                  type: object
                  properties:
                    name:
                      type: string
                    amount:
                      type: integer
            example:
              userId: '123456789012345678'
              item:
                name: Аптечка
                amount: 1
      responses:
        '200':
          description: Profilo aggiornato.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                amount: 1
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  amount:
                    type: integer
      description: Aggiunta e rimozione di oggetti, svuotamento dell'inventario.
  /civops/businesses:
    get:
      tags:
      - Economia
      summary: 'Economia: attività'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Elenco delle imprese registrate.
          content:
            application/json:
              example:
                page: 1
                total: 1
                businesses:
                - id: B7K2Q9XZ
                  name: Кафе «Арбат»
                  form: ООО
                  status: active
                  owner_id: '123456789012345678'
                  owner_name: player
                  address: ул. Арбат, 10
                  bank: 120000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  businesses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        form:
                          type: string
                        status:
                          type: string
                        owner_id:
                          type: string
                        owner_name:
                          type: string
                        address:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Attività: elenco, scheda, saldo, dipendenti, prodotti, trasferimenti, classifica e richieste.'
    post:
      tags:
      - Economia
      summary: 'Economia: azioni sulle attività'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                amount:
                  type: integer
            example:
              businessId: B7K2Q9XZ
              amount: 5000
      responses:
        '200':
          description: L'operazione è completata.
          content:
            application/json:
              example:
                success: true
                businessId: B7K2Q9XZ
                added: 5000
                newBalance: 125000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  businessId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Richieste, creazione ed eliminazione di attività, denaro, dipendenti e prodotti.
  /civops/mafias:
    get:
      tags:
      - Economia
      summary: 'Economia: mafie'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Elenco delle mafie e dei gruppi.
          content:
            application/json:
              example:
                page: 1
                total: 1
                mafias:
                - id: M3X8P1
                  name: Солнцевские
                  leader_id: '123456789012345678'
                  leader_name: player
                  color: '#8B0000'
                  bank: 54000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  mafias:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        leader_id:
                          type: string
                        leader_name:
                          type: string
                        color:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Mafie: elenco, scheda, saldo, membri, trasferimenti e registri.'
    post:
      tags:
      - Economia
      summary: 'Economia: azioni sulle mafie'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mafiaId:
                  type: string
                amount:
                  type: integer
            example:
              mafiaId: M3X8P1
              amount: 1000
      responses:
        '200':
          description: Stato dell'operazione.
          content:
            application/json:
              example:
                success: true
                mafiaId: M3X8P1
                added: 1000
                newBalance: 55000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mafiaId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Creazione ed eliminazione di mafie, denaro, trasferimenti e membri.
  /civops/government:
    get:
      tags:
      - Economia
      summary: 'Economia: bilancio'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Stato del bilancio e dei dipartimenti dello Stato.
          content:
            application/json:
              example:
                balance:
                  bank: 2500000
              schema:
                type: object
                properties:
                  balance:
                    type: object
                    properties:
                      bank:
                        type: integer
      description: Saldo del bilancio e trasferimenti del governo.
    post:
      tags:
      - Economia
      summary: 'Economia: azioni sul bilancio'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
            example:
              amount: 10000
      responses:
        '200':
          description: Le impostazioni sono state aggiornate.
          content:
            application/json:
              example:
                success: true
                added: 10000
                newBalance: 2510000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Aggiunte e prelievi dal bilancio, trasferimenti a giocatore, attività o mafia.
  /civops/store:
    get:
      tags:
      - Economia
      summary: 'Economia: negozio'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Catalogo dei prodotti del negozio.
          content:
            application/json:
              example:
                count: 1
                items:
                - name: Аптечка
                  description: Восстанавливает здоровье
                  price_buy: 250
                  price_sell: 100
                  quantity: null
                  can_use: true
                  can_sell: true
                  createdAt: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        price_buy:
                          type: integer
                        price_sell:
                          type: integer
                        quantity:
                          type:
                          - string
                          - 'null'
                        can_use:
                          type: boolean
                        can_sell:
                          type: boolean
                        createdAt:
                          type: integer
      description: Prodotti del negozio di gioco.
    post:
      tags:
      - Economia
      summary: 'Economia: azioni sul negozio'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                itemName:
                  type: string
                quantity:
                  type: integer
            example:
              userId: '123456789012345678'
              itemName: Аптечка
              quantity: 2
      responses:
        '200':
          description: Il risultato della transazione.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                quantity: 2
                totalPrice: 500
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  quantity:
                    type: integer
                  totalPrice:
                    type: integer
      description: Aggiunta e rimozione di prodotti, acquisto e vendita al negozio.
  /civops/ads:
    get:
      tags:
      - Economia
      summary: 'Economia: annunci'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Campagne pubblicitarie attive.
          content:
            application/json:
              example:
                count: 1
                ads:
                - id: 5
                  user_id: '123456789012345678'
                  username: player
                  business_name: Кафе «Арбат»
                  address: ул. Арбат, 10
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  ads:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: string
                        username:
                          type: string
                        business_name:
                          type: string
                        address:
                          type: string
                        created_at:
                          type: integer
      description: Richieste di annunci di gioco (`action=list`).
    post:
      tags:
      - Economia
      summary: 'Economia: invia un annuncio'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                username:
                  type: string
                businessName:
                  type: string
                address:
                  type: string
            example:
              userId: '123456789012345678'
              username: player
              businessName: Кафе «Арбат»
              address: ул. Арбат, 10
      responses:
        '200':
          description: L'annuncio è stato pubblicato.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                businessName: Кафе «Арбат»
                address: ул. Арбат, 10
                adSent: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  businessName:
                    type: string
                  address:
                    type: string
                  adSent:
                    type: boolean
      description: Crea una richiesta di annuncio (`action=create`).
  /civops/system:
    get:
      tags:
      - Economia
      summary: 'Economia: riepilogo'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Versione e configurazione economica.
          content:
            application/json:
              example:
                users: 5120
                businesses: 34
                mafias: 6
                governmentBalance: 2500000
                uptime: 86400.5
                memory:
                  rss: 152043520
                  heapTotal: 98304000
                  heapUsed: 71303168
                  external: 2097152
                timestamp: '2026-10-21T12:00:00.000Z'
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  businesses:
                    type: integer
                  mafias:
                    type: integer
                  governmentBalance:
                    type: integer
                  uptime:
                    type: number
                  memory:
                    type: object
                    properties:
                      rss:
                        type: integer
                      heapTotal:
                        type: integer
                      heapUsed:
                        type: integer
                      external:
                        type: integer
                  timestamp:
                    type: string
                    format: date-time
      description: Statistiche generali dell'economia e tempo di attività.
  /civops/health:
    get:
      tags:
      - Economia
      summary: 'Economia: stato'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: È attivo il servizio economy.
          content:
            application/json:
              example:
                status: ok
                service: Economy API
                timestamp: '2026-10-21T12:00:00.000Z'
                uptime: 86400.5
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
      description: Se il modulo economia funziona. Nessuna chiave richiesta.
  /stats:
    get:
      tags:
      - API statistiche
      summary: Statistiche dei server
      description: Giocatori online ER:LC e membri dei server Discord. Si possono richiedere più server e metriche insieme.
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Имена серверов. Выберите один или несколько серверов из выпадающего списка:

          - `MRP` — Moscow RolePlay (поддерживает все 4 метрики)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` — поддерживают `membercount`, `allmembercount`, `botcount`

          - `DOT` — поддерживает только `membercount`

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Типы запрашиваемых метрик:

          - `playercount` — онлайн игроков в игре ER:LC (**доступен ТОЛЬКО для `MRP`**)

          - `membercount` — количество участников Discord онлайн (доступен для всех)

          - `allmembercount` — общее число участников Discord сервера (все кроме `DOT`)

          - `botcount` — количество ботов на сервере (все кроме `DOT`)

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
        example:
        - playercount
