      summary: Svuota cache dei file
      description: 'Svuota la cache per `ids`, `path` o `prefix`; senza, l''intero spazio. `success` indica che è stato accettato, non completato.


        Senza ids/path/prefix, lo svuotamento dell’intero namespace avviene in background: HTTP 202, status=queued e acceptedCount conta gli oggetti selezionati, non il lavoro completato.
        Una richiesta al minuto per team e namespace; rispetta Retry-After con 429. Il risultato viene registrato nell’audit del API. Lo svuotamento mirato mantiene HTTP 200 e purgedCount.
        Un URL di versione nuovo e unico normalmente non richiede purge subito dopo il caricamento: questo elimina la cache preriscaldata.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Пространство имён.
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Точный путь ассета.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: Список ID ассетов. Передаётся только в теле запроса, не в query.
                  items:
                    type: string
            example:
              ids:
              - ast_7Kq2Zp
      responses:
        '200':
          description: La cache è stata svuotata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - path
                    - ids
                    - prefix
                  purgedCount:
                    type: integer
              examples:
                purge_ok:
                  summary: Purge ok
                  value:
                    success: true
                    domain: default
                    scope: ids
                    purgedCount: 1
        '401':
          description: 'Non autorizzato (401): la chiave non è stata trasferita.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: 'Proibito (403): c''è una chiave, ma non abbastanza diritti.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: È stato raggiunto il limite delle richieste. Considera Retry-After; Non eseguire download paralleli illimitati.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
        '202':
          description: 'Senza ids/path/prefix, lo svuotamento dell’intero namespace avviene in background: HTTP 202, status=queued e acceptedCount conta gli oggetti selezionati, non il lavoro
            completato. Una richiesta al minuto per team e namespace; rispetta Retry-After con 429. Il risultato viene registrato nell’audit del API. Lo svuotamento mirato mantiene HTTP
            200 e purgedCount. Un URL di versione nuovo e unico normalmente non richiede purge subito dopo il caricamento: questo elimina la cache preriscaldata.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - domain
                  status:
                    type: string
                    enum:
                    - queued
                  acceptedCount:
                    type: integer
