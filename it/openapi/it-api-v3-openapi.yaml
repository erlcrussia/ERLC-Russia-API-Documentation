openapi: 3.1.0
info:
  title: ER:LC Russia API V3
  description: "API ER:LC Russia per server, utenti, CDN, reindirizzamenti, abbonamenti e chiavi di accesso."
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
- url: https://api.erlcrussia.xyz/v3
tags:
- name: ER:Server LC
  description: Ottenere status, online, elenchi di giocatori e staff del server ER:LC.
- name: 'ER: Squadre LC'
  description: Invio e accodamento di comandi del server di gioco (:h, :m, :kick, :ban, ecc.).
- name: Economia
  description: Interazione con il sistema economico (utenti, imprese, mafie, negozi, pubblicità).
- name: API statistiche
  description: Statistiche di acquisizione ad alte prestazioni dei server Discord e dei server di gioco (online,
    partecipanti, bot).
- name: API di verifica
  description: Ricerca e confronto di account Discord ID e Roblox ID.
- name: Risorse CDN
  description: Carica, gestisci, esegui statistiche e cancella la cache dei file di archiviazione di oggetti CDN
    MinIO/Edge.
- name: Cartelle CDN
  description: Struttura gerarchica e ordinamento delle cartelle della libreria multimediale CDN.
- name: API di punizione
  description: Gestisci il saldo e la cronologia delle transazioni dei punti dei giocatori.
- name: API degli abbonamenti
  description: Catalogo dei piani, ordini FunPay, maturazione dei vantaggi e attivazione degli abbonamenti.
- name: API di autorizzazione
  description: Accedi tramite Discord e Roblox OAuth2, gestisci le sessioni utente e collega gli account.
- name: API di stato
  description: Monitoraggio delle prestazioni del servizio, connessioni a PostgreSQL e Redis.
paths:
  /erlc/server:
    get:
      tags:
      - ER:Server LC
      summary: Informazioni sul server ER:LC
      description: 'Restituisce informazioni generali sul server ER:LC (nome, corrente online, limite massimo, stato).

        Utilizzando i parametri di query, puoi facoltativamente richiedere elenchi di giocatori, personale, code,
        registri di entrate/uscite, uccisioni e squadre.'
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Abilita un elenco dettagliato dei giocatori sul server.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Includi un elenco dello staff e dei moderatori (amministratori, mod).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Abilita accesso e disconnessione.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Abilita lo stato della coda di attesa della connessione.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Abilita il registro delle uccisioni.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Abilita il registro dei comandi eseguiti.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Abilita le chiamate di moderazione attive.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Includi un elenco dei veicoli generati.
        schema:
          type: boolean
      responses:
        '200':
          description: Risposta riuscita con i dati del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCServerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:Server LC
      summary: Elenco dei divieti dei server
      description: Restituisce l'elenco corrente degli utenti bloccati sul server ER:LC.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Elenco degli utenti esclusi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ERLCBanItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - 'ER: Squadre LC'
      summary: Esecuzione di un comando sul server
      description: 'Invia un comando al server ER:LC (ad esempio, `:h Сообщение`, `:m Внимание`, `:kick Nick`, `:ban
        Nick`).

        Per errori PRC di rete temporanei (codici 1001, 1002, 9999), il comando viene automaticamente inserito nella
        coda dei tentativi.'
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - command
              properties:
                command:
                  type: string
                  description: Testo del comando con due punti (ad esempio, ":m Il server si sta riavviando").
                  example: :m Внимание, плановый рестарт через 5 минут
      responses:
        '200':
          description: Il comando è stato inviato con successo al server o messo in coda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCCommandResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - Economia
      summary: Ottenere dati economici
      description: Dati riepilogativi del sistema finanziario Economia (fatturato totale, tasse, tesoreria).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Dati economici.
    post:
      tags:
      - Economia
      summary: Modifica dei parametri economici
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Aggiornamento riuscito.
  /civops/users:
    get:
      tags:
      - Economia
      summary: Profilo utente in Economia
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Dati del profilo del giocatore.
    post:
      tags:
      - Economia
      summary: Modifica del profilo utente
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Profilo aggiornato.
  /civops/businesses:
    get:
      tags:
      - Economia
      summary: Elenco delle imprese
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Elenco delle imprese registrate.
    post:
      tags:
      - Economia
      summary: Creazione/modifica attività
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: L'operazione è completata.
  /civops/mafias:
    get:
      tags:
      - Economia
      summary: Dati sull'organizzazione criminale
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Elenco delle mafie e dei gruppi.
    post:
      tags:
      - Economia
      summary: Gestione del gruppo
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Stato dell'operazione.
  /civops/government:
    get:
      tags:
      - Economia
      summary: Dati provenienti da agenzie governative e Ministero del Tesoro
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Stato del bilancio e dei dipartimenti dello Stato.
    post:
      tags:
      - Economia
      summary: Modifica dei parametri delle strutture statali
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Le impostazioni sono state aggiornate.
  /civops/store:
    get:
      tags:
      - Economia
      summary: Negozio di articoli economici
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Catalogo dei prodotti del negozio.
    post:
      tags:
      - Economia
      summary: Acquisti/Gestione prodotti
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Il risultato della transazione.
  /civops/ads:
    get:
      tags:
      - Economia
      summary: Elenco degli annunci
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Campagne pubblicitarie attive.
    post:
      tags:
      - Economia
      summary: Invio di un annuncio
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: L'annuncio è stato pubblicato.
  /civops/system:
    get:
      tags:
      - Economia
      summary: Economia dell'informazione di sistema
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Versione e configurazione economica.
  /civops/health:
    get:
      tags:
      - Economia
      summary: Disponibilità Verifica API Economy
      security:
      - BearerAuth: []
      responses:
        '200':
          description: È attivo il servizio economy.
  /stats:
    get:
      tags:
      - API statistiche
      summary: Statistiche del server universale
      description: 'Endpoint ad alte prestazioni per il monitoraggio delle gilde Discord e dei server di gioco ER:LC.

        Supporta più parametri `servers` e `metrics` (inclusi parametri di query duplicati):

        - `membercount` - partecipanti online;

        - `allmembercount`: numero totale di partecipanti al server;

        - `botcount`: numero di bot;

        - `playercount` - attuali giocatori online in ER:LC.'
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Nomi dei server. Seleziona uno o più server dall''elenco a discesa:

          - `MRP` - Mosca RolePlay (supporta tutte e 4 le metriche)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` - supporta `membercount`, `allmembercount`, `botcount`

          - `DOT` - supporta solo `membercount`'
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Tipi di metriche richieste:

          - `playercount` - giocatori online nel gioco ER:LC (**disponibile SOLO per `MRP`**)

          - `membercount` - numero di membri Discord online (disponibile per tutti)

          - `allmembercount` - il numero totale di partecipanti al server Discord (tutti tranne `DOT`)

          - `botcount` - numero di bot sul server (tutti tranne `DOT`)'
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
        example:
        - playercount
      responses:
        '200':
          description: Un oggetto con statistiche per ciascun server e le metriche richieste.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: integer
                example:
                  MRP:
                    membercount: 1450
                    playercount: 38
                  MVD:
                    membercount: 320
                    playercount: 12
        '400':
          $ref: '#/components/responses/BadRequestError'
  /users:
    get:
      tags:
      - API di verifica
      summary: Trovare collegamenti ID Discord <-> ID Roblox
      description: 'Cerca rapidamente un account collegato tramite identificatori singoli o batch. Passa gli ID
        come stringhe: il fiocco di neve numerico Discord perde precisione in JavaScript. GET con un parametro singolare
        restituisce un oggetto; I parametri plurale e POST restituiscono sempre un array. Le connessioni mancanti
        nel batch vengono saltate, l''ordine non è garantito. Batch vuoto: HTTP 200 e []. Singola connessione mancante:
        HTTP 404.'
      parameters:
      - name: discordId
        in: query
        description: ID utente discorde.
        schema:
          type: string
      - name: robloxId
        in: query
        description: ID utente Roblox.
        schema:
          type: string
      - name: discordIds
        in: query
        description: Più ID Discord separati da virgole.
        schema:
          type: string
      - name: robloxIds
        in: query
        description: Più ID Roblox separati da virgole.
        schema:
          type: string
      responses:
        '200':
          description: Risposta riuscita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersLookupResponse'
              examples:
                single:
                  value:
                    robloxId: '123456789'
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: La connessione non è stata trovata con un singolo GET.
      security:
      - ApiKeyHeader: []
    post:
      tags:
      - API di verifica
      summary: Ricerca in batch
      description: 'Ricerca batch per utenti tramite il corpo della richiesta JSON. Passa gli ID come stringhe:
        il fiocco di neve numerico Discord perde precisione in JavaScript. GET con un parametro singolare restituisce
        un oggetto; I parametri plurale e POST restituiscono sempre un array. Le connessioni mancanti nel batch
        vengono saltate, l''ordine non è garantito. Batch vuoto: HTTP 200 e []. Singola connessione mancante: HTTP
        404.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discordIds:
                  type: array
                  items:
                    type: string
                robloxIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Risposta riuscita.
          content:
            application/json:
              schema:
                type: array
                items: &id005
                  type: object
                  properties:
                    discordId: &id001
                      type: string
                    robloxId: *id001
                  required:
                  - discordId
                  - robloxId
              examples:
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: La connessione non è stata trovata con un singolo GET.
      security:
      - ApiKeyHeader: []
  /cdn/manifest:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - Risorse CDN
      summary: Manifesto del file di archiviazione
      description: 'Spazio dei nomi dei metadati dello snapshot: successo, conteggio, dominio, risorse. Massimo
        10.000 asset; per un catalogo completo e di grandi dimensioni, utilizzare l''impaginazione GET /cdn/assets.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Spazio dei nomi. `default` è il nostro dominio generale o cliente.
        schema:
          type: string
        example: acme
      responses:
        '200':
          description: Elenco delle risorse dello spazio dei nomi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  domain:
                    type: string
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/CdnAsset'
              examples:
                manifest_ok:
                  summary: Manifest ok
                  value:
                    success: true
                    count: 1
                    domain: default
                    assets:
                    - name: Инструкция
                      slug: manual.png
                      domain: default
                      path: docs/manual.png
                      fullPath: default/docs/manual.png
                      full_path: default/docs/manual.png
                      folderId: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      folder_id: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      sourceType: LOCAL
                      source_type: LOCAL
                      sourceUrl: default/docs/manual.png
                      source_url: default/docs/manual.png
                      isPinned: true
                      is_pinned: 1
                      mimeType: image/png
                      mime_type: image/png
                      size: 70
                      sha256: c2153f77e11087fcb078ae38527fa83bef29791e3700e30cc87fec4405a66d0f
                      downloads: 0
                      createdAt: '2026-10-06T14:56:09.0798434Z'
                      created_at: '2026-10-06T14:56:09.0798434Z'
                      updatedAt: '2026-10-06T14:56:09.0798434Z'
                      updated_at: '2026-10-06T14:56:09.0798434Z'
                      folder:
                        name: Документы
                        slug: docs
        '401':
          description: 'Non autorizzato (401): la chiave non è stata trasferita.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: 'Proibito (403): c''è una chiave, ma non abbastanza diritti.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: È stato raggiunto il limite delle richieste. Considera Retry-After e retry_after; Non eseguire
            download paralleli illimitati.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
                retry_after: 30
                details:
                  count: 21
                  excess: 1
                  limit: 20
                  reset_at: 1792083600000
  /cdn/assets:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - Risorse CDN
      summary: Elenco dei beni
      description: 'Senza percorso: asset, impaginazione, statistiche, successo. Con percorso esatto senza ID e
        prefisso: risorsa, successo. il limite predefinito è 50, massimo 100. totalPages minimo 1 anche per un risultato
        vuoto.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Spazio dei nomi (primo segmento del percorso del file).
        schema:
          type: string
        example: acme
      - name: path
        in: query
        required: false
        description: Il percorso esatto della risorsa all'interno dello spazio dei nomi.
        schema:
          type: string
        example: branding/logo.png
      - name: prefix
        in: query
        required: false
        description: Prefisso del percorso per la selezione di un gruppo di file.
        schema:
          type: string
        example: branding/
      - name: folderId
        in: query
        required: false
        description: 'ID della cartella dell''interfaccia utente. La cartella è solo un raggruppamento visivo e
          non influisce sul percorso del file.

          `root` o `null` - file senza cartella, `all` - senza filtro.'
        schema:
          type: string
        example: root
      - name: search
        in: query
        required: false
        description: Cerca per nome, slug e percorso completo.
        schema:
          type: string
      - name: sourceType
        in: query
        required: false
        description: Filtra per tipo di fonte.
        schema:
          type: string
          enum:
          - LOCAL
          - EXTERNAL
          - all
      - name: isPinned
        in: query
        required: false
        description: Filtra bloccando.
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        description: Numero di pagina a partire da 1.
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        description: Numero di elementi per pagina, massimo 100.
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
        '200':
          description: Risposta riuscita.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success: &id002
                      type: boolean
                    asset:
                      $ref: '#/components/schemas/CdnAsset'
                  required:
                  - success
                  - asset
                - type: object
                  properties:
                    success: *id002
                    assets:
                      type: array
                      items:
                        $ref: '#/components/schemas/CdnAsset'
                    pagination:
                      type: object
                      properties:
                        page: &id003
                          type: integer
                        limit: *id003
                        total: *id003
                        totalPages: *id003
                    stats:
                      $ref: '#/components/schemas/CdnStats'
                  required:
                  - success
                  - assets
                  - pagination
                  - stats
              examples:
                emptyList:
                  value:
                    success: true
                    assets: []
                    pagination:
                      page: 1
                      limit: 50
                      total: 0
                      totalPages: 1
                    stats:
                      totalAssets: 0
                      total_assets: 0
                      totalFolders: 0
                      total_folders: 0
                      pinnedAssets: 0
                      pinned_assets: 0
                      localAssets: 0
                      local_assets: 0
                      externalAssets: 0
                      external_assets: 0
                      totalBytes: 0
                      total_bytes: 0
                      totalDownloads: 0
                      total_downloads: 0
        '401':
          description: 'Non autorizzato (401): la chiave non è stata trasferita.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: 'Proibito (403): c''è una chiave, ma non abbastanza diritti.'
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '404':
          description: Non trovato (404) - risorsa non trovata.
          content:
            application/json:
              examples:
                asset_not_found:
                  summary: Asset not found
                  value:
                    code: 5041
                    message: Asset Not Found
        '429':
          description: È stato raggiunto il limite delle richieste. Considera Retry-After e retry_after; Non eseguire
            download paralleli illimitati.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
                retry_after: 30
                details:
                  count: 21
                  excess: 1
                  limit: 20
                  reset_at: 1792083600000
    post:
      tags:
      - Risorse CDN
      summary: Caricamento file
      description: 'Carica multipart/form-data con il campo file. Non impostare manualmente il tipo di contenuto:
        il client deve aggiungere un limite. dominio e percorso possono essere passati a multipart; il dominio multiparte
        esplicito ha la precedenza sulla query. Per i blocchi utilizzare compress=false e MIME text/javascript o
        text/css. Sono supportati il ​​percorso _next/static e i nomi _app.js. Risposta HTTP 200, non 201. Il nuovo
        tentativo di un percorso ovviamente occupato restituisce 409 senza riscrivere. File massimo 250 MiB. comprime
        le impostazioni predefinite su true: JPEG/PNG fino a 24 megapixel; i video richiedono FFmpeg/FFprobe. Il
        risultato dell''ottimizzazione viene salvato solo se è più piccolo dell''originale.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Spazio dei nomi. `default` è il nostro spazio dei nomi comune o il dominio del cliente per
          i suoi file.
        schema:
          type: string
        example: client.ru
