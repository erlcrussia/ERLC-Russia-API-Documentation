  /keys:
    get:
      tags:
      - Chiavi API
      summary: Ottenere chiavi e restrizioni
      description: "Un endpoint universale per ottenere un elenco di token API e WebSocket, nonché le relative restrizioni.\n\
        Per eseguire una richiesta, è necessario passare uno dei parametri di query `api=true` o `websocket=true`.\n\
        Per abilitare le restrizioni sui permessi per una chiave, passare il parametro `restrictions=true` dopo\
        \ il tipo appropriato (ad esempio, `?api=true&restrictions=true` o `?api=true&restrictions=true&websocket=true&restrictions=true`).\n\
        \ La risposta contiene le chiavi private del proprietario, inclusi gli altri suoi server. Non chiamare da\
        \ un'applicazione browser e non registrare la risposta. L'array delle restrizioni riflette le voci consentite\
        \ esplicitamente, piuttosto che la politica di accesso effettiva completa."
      parameters:
      - name: api
        in: query
        description: Richiedi un elenco di token API HTTP
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Richiedi un elenco di token WebSocket
        schema:
          type: boolean
        example: true
      - name: restrictions
        in: query
        description: Abilita le restrizioni sui diritti (specificate dopo API o websocket)
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Elenco delle chiavi richieste (array o oggetto quando si richiedono API e websocket contemporaneamente).
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ApiKeyItem'
                - type: array
                  items:
                    $ref: '#/components/schemas/WebSocketKeyItem'
                - type: object
                  properties:
                    api:
                      type: array
                      items:
                        $ref: '#/components/schemas/ApiKeyItem'
                    websocket:
                      type: array
                      items:
                        $ref: '#/components/schemas/WebSocketKeyItem'
              examples:
                api_only:
                  summary: Richiedi solo chiavi API (?api=true&restrictions=true)
                  value:
                  - id: '1'
                    key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    userId: '403258784102940682'
                    serverId: srv_8f9a2b1c4e
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      endpoints:
                      - erlc.server
                      - civops.economy
                      versions:
                      - v3
                      queryParams:
                      - Players
                      - Staff
                      actions:
                      - webhook:add
                      - logs:read
                websocket_only:
                  summary: Richiedi solo chiavi WebSocket (?websocket=true&restrictions=true)
                  value:
                  - id: '1'
                    key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    userId: '403258784102940682'
                    serverId: srv_3d5e7f9a1b
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      channels:
                      - server:players
                      - server:logs
                      blockedIPs: []
                both:
                  summary: Richiesta di entrambi i tipi (?api=true&websocket=true)
                  value:
                    api:
                    - id: '1'
                      key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      userId: '403258784102940682'
                      serverId: srv_8f9a2b1c4e
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
                    websocket:
                    - id: '1'
                      key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      userId: '403258784102940682'
                      serverId: srv_3d5e7f9a1b
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Chiavi API
      summary: Rigenerazione chiave
      description: 'Endpoint universale per rigenerare token API e/o WebSocket.

        Richiede il passaggio di almeno un parametro di query `api=true` o `websocket=true`.

        Il token precedente viene annullato e tutte le restrizioni e i vincoli vengono automaticamente trasferiti
        al nuovo token.'
