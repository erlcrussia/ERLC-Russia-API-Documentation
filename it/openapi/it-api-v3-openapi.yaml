  /webhooks/add-url:
    post:
      tags:
      - Webhook personalizzati
      summary: Aggiungi un URL
      description: Aggiunge un URL per gli eventi di gioco. Si accetta solo se verifica la firma ed è subito attivo. Una chiave legata a un server può iscriversi solo a quel server.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                serverIds:
                  type: array
                  items:
                    type: string
            example:
              url: https://my-bot.example.com/erlc-events
              serverIds:
              - '12345678'
      responses:
        '201':
          description: Il webhook è stato registrato con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
                  is_active:
                    type: boolean
                  discord_id:
                    type: string
              example:
                success: true
                message: Webhook URL added successfully
                urls:
                - url: https://my-bot.example.com/erlc-events
                  isActive: true
                  serverIds:
                  - '12345678'
                is_active: true
                discord_id: '123456789012345678'
        '403':
          description: È vietato associare un webhook a questo server.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Вам запрещено привязывать вебхук к серверу '999999'. Разрешенный сервер для вашего ключа '12345678'
                  forbidden_server_id:
                    type: string
                    example: '999999'
                  allowed_server_id:
                    type: string
                    example: '12345678'
        '400':
          description: 'L''URL non ha superato il controllo: deve rispondere 2xx a una richiesta firmata correttamente e 4xx a una falsa. Il motivo è in `reason`, la risposta dell''URL in `status`.'
          content:
            application/json:
              example:
                code: 5051
                message: Webhook Verification Failed
                reason: forged_accepted
                status: 200
  /webhooks/url:
    put:
