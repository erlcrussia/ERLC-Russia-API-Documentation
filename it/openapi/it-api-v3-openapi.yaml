  /keys:
    get:
      tags:
      - Chiavi API
      summary: Le mie chiavi
      description: 'Le tue chiavi API e WebSocket. Passa `api=true` e/o `websocket=true`; `restrictions=true` aggiunge i permessi.


        Il segreto completo viene restituito solo alla creazione o rotazione. Gli elenchi delle chiavi IA, la rinomina e l’eliminazione restituiscono una maschera. GET /keys rivela solo
        la chiave chiamante; le altre, anche proprie, sono mascherate. teamId è l’ID del team associato o null.'
      parameters:
      - name: api
        in: query
        description: Запросить список HTTP API токенов
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Запросить список WebSocket токенов
        schema:
          type: boolean
        example: true
      - name: restrictions
        in: query
        description: Включить ограничения прав (указывается после api или websocket)
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Elenco delle chiavi richieste (array o oggetto quando si richiedono API e websocket contemporaneamente).
          content:
            application/json:
              schema:
                type: object
                properties:
                  api:
                    type: array
                    items:
                      type: object
                      properties:
                        teamId:
                          type: string
                        id:
                          type: string
                        key:
                          type: string
                        apiKey:
                          type: string
                        userId:
                          type: string
                        serverId:
                          type: string
                        isActive:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        restrictions:
                          type: object
                          properties:
                            endpoints:
                              type: array
                              items:
                                type: string
                            versions:
                              type: array
                              items:
                                type: string
                            queryParams:
                              type: array
                              items:
                                type: string
                            actions:
                              type: array
                              items: {}
                  websocket:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        key:
                          type: string
                        apiKey:
                          type: string
                        userId:
                          type: string
                        serverId:
                          type: string
                        isActive:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        restrictions:
                          type: object
                          properties:
                            channels:
                              type: array
                              items:
                                type: string
                            blockedIPs:
                              type: array
                              items: {}
              example:
                api:
                - teamId: team_7f3a
                  id: '15'
                  key: a8Fk2LmQ9zXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhJkL
                  apiKey: a8Fk2LmQ9zXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhJkL
                  userId: '123456789012345678'
                  serverId: '12345678'
                  isActive: true
                  createdAt: '2026-10-21T12:00:00Z'
                  restrictions:
                    endpoints:
                    - erlc.server
                    versions:
                    - v3
                    queryParams:
                    - query:Players
                    actions: []
                websocket:
                - id: '4'
                  key: ws_K3j...hJkL
                  apiKey: ws_K3j...hJkL
                  userId: '123456789012345678'
                  serverId: '12345678'
                  isActive: true
                  createdAt: '2026-10-21T12:00:00Z'
                  restrictions:
                    channels:
                    - players
                    blockedIPs: []
        '400':
          $ref: '#/components/responses/BadRequestError'
