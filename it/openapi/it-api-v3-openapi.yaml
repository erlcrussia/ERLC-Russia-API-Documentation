                      totalAssets: 0
                      total_assets: 0
                      totalFolders: 0
                      total_folders: 0
                      pinnedAssets: 0
                      pinned_assets: 0
                      localAssets: 0
                      local_assets: 0
                      externalAssets: 0
                      external_assets: 0
                      totalBytes: 0
                      total_bytes: 0
                      totalDownloads: 0
                      total_downloads: 0
        '401':
          description: 'Non autorizzato (401): la chiave non è stata trasferita.'
