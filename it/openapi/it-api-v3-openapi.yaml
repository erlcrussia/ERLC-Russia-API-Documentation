                      type: string
                    created_at:
                      type: string
                      format: date-time
                    is_active:
                      type: boolean
                    tools_enabled:
                      type: boolean
    post:
      tags:
      - AI Studio
      summary: Crea una chiave IA
      security:
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Studio Key
                scope:
                  type: string
                  enum:
                  - agent
                  - chat
                  - voice
            example:
              name: Discord-бот
              scope: chat
      responses:
        '403':
          description: Owner session required; an ordinary HTTP key cannot authorize this operation.
        '200':
          description: La chiave è stata creata (id, token, nome, ambito, created_at, is_active, tools_enabled).
          content:
            application/json:
              example:
                id: '21'
                token: sk-chat-3f9c2a1e5b7d4e9fa1c32b4d6e8f0a1c3f9c2a1e5b7d4e9fa1c32b4d6e8f0a1c
                name: Discord-бот
                scope: chat
                created_at: '2026-10-21T12:00:00Z'
                is_active: true
                tools_enabled: false
              schema:
                type: object
                properties:
                  id:
                    type: string
                  token:
                    type: string
                  name:
                    type: string
                  scope:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  is_active:
                    type: boolean
                  tools_enabled:
                    type: boolean
      description: 'Crea una chiave IA per l''API compatibile con OpenAI: agent, chat o voice.


        La creazione di una chiave IA e lo scambio di monete richiedono la sessione del proprietario. Una normale chiave HTTP, anche con accesso completo, non consente queste operazioni.
        I servizi fidati usano i metodi amministrativi con chiave master.'
  /ai/keys/{id}:
    delete:
      tags:
      - AI Studio
      summary: Elimina una chiave IA
      description: 'Elimina la tua chiave IA tramite ID o valore.


        Il segreto completo viene restituito solo alla creazione o rotazione. Gli elenchi delle chiavi IA, la rinomina e l’eliminazione restituiscono una maschera. GET /keys rivela solo
        la chiave chiamante; le altre, anche proprie, sono mascherate. teamId è l’ID del team associato o null.'
      parameters:
      - name: id
        in: path
        required: true
        description: Токен ключа (sk-chat-...) или числовой ID.
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: 'Chiave eliminata ({successo: true, eliminata: true, token: "..."}).'
          content:
            application/json:
              example:
                success: true
                deleted: true
                token: sk-chat-3...0a1c
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: boolean
                  token:
                    type: string
    patch:
      tags:
      - AI Studio
      summary: Rinomina una chiave IA
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 64
            example:
              name: Бот поддержки
      responses:
        '200':
          description: Risposta riuscita.
          content:
            application/json:
              example:
                id: '21'
                token: sk-chat-3...0a1c
                name: Бот поддержки
                created_at: '2026-10-21T12:00:00Z'
                is_active: true
              schema:
                type: object
                properties:
                  id:
                    type: string
                  token:
                    type: string
                  name:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  is_active:
                    type: boolean
        '400':
          description: Risposta riuscita.
        '403':
          description: Risposta riuscita.
      description: 'Rinomina la tua chiave IA tramite ID o valore.


        Il segreto completo viene restituito solo alla creazione o rotazione. Gli elenchi delle chiavi IA, la rinomina e l’eliminazione restituiscono una maschera. GET /keys rivela solo
        la chiave chiamante; le altre, anche proprie, sono mascherate. teamId è l’ID del team associato o null.'
