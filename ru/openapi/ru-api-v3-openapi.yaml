openapi: 3.1.0
info:
  title: ER:LC Россия API V3
  description: "API ER:LC Россия: серверы, пользователи, CDN, редиректы, подписки и ключи доступа."
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
- url: https://api.erlcrussia.xyz/v3
tags:
- name: ER:LC Сервер
  description: Получение статуса, онлайна, списков игроков и персонала сервера ER:LC.
- name: ER:LC Команды
  description: Отправка и постановка в очередь команд внутриигрового сервера (:h, :m, :kick, :ban и др.).
- name: Экономика
  description: Взаимодействие с экономической системой (пользователи, бизнесы, мафии, магазин, реклама).
- name: API Статистики
  description: Высокопроизводительное получение статистики дискорд-серверов и игровых серверов (онлайн, участники,
    боты).
- name: API Верификации
  description: Поиск и сопоставление Discord ID и Roblox ID аккаунтов.
- name: CDN Ассеты
  description: Загрузка, управление, статистика и очистка кэша файлов объектного хранилища MinIO / Edge CDN.
- name: CDN Папки
  description: Иерархическая структура и сортировка папок медиатеки CDN.
- name: API Наказаний
  description: Управление балансом и историей транзакций баллов игроков.
- name: API Подписок
  description: Каталог планов, заказы FunPay, начисление бенефитов и активация подписок.
- name: API Авторизации
  description: Вход через Discord и Roblox OAuth2, управление сессиями пользователя и связывание аккаунтов.
- name: API Состояния
  description: Мониторинг работоспособности сервиса, подключений к PostgreSQL и Redis.
paths:
  /erlc/server:
    get:
      tags:
      - ER:LC Сервер
      summary: Информация о Сервере ER:LC
      description: 'Возвращает общие данные о сервере ER:LC (название, текущий онлайн, максимальный лимит, статус).

        С помощью query-параметров можно опционально запросить списки игроков, персонала, очередь, логи входов/выходов,
        киллов и команд.

        '
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Включить детальный список игроков на сервере.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Включить список сотрудников и модераторов (Admins, Mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Включить журнал входов и выходов.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Включить состояние очереди ожидания подключения.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Включить журнал убийств.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Включить журнал выполненных команд.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Включить активные вызовы модераторов.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Включить список заспавненных транспортных средств.
        schema:
          type: boolean
      responses:
        '200':
          description: Успешный ответ с данными сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCServerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:LC Сервер
      summary: Список Банов Сервера
      description: Возвращает актуальный список заблокированных пользователей на сервере ER:LC.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Список забаненных пользователей.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ERLCBanItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - ER:LC Команды
      summary: Выполнение Команды на Сервере
      description: 'Отправляет команду на сервер ER:LC (например, `:h Сообщение`, `:m Внимание`, `:kick Nick`, `:ban
        Nick`).

        При временных сетевых ошибках PRC (коды 1001, 1002, 9999) команда автоматически помещается в очередь повтора
        (retry queue).

        '
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - command
              properties:
                command:
                  type: string
                  description: Текст команды с двоеточием (например, ":m Сервер перезагружается").
                  example: :m Внимание, плановый рестарт через 5 минут
      responses:
        '200':
          description: Команда успешно передана на сервер или поставлена в очередь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCCommandResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - Экономика
      summary: Получение Данных Экономики
      description: Сводные данные финансовой системы Экономика (общий оборот, налоги, казна).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Данные экономики.
    post:
      tags:
      - Экономика
      summary: Изменение Параметров Экономики
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Успешное обновление.
  /civops/users:
    get:
      tags:
      - Экономика
      summary: Профиль Пользователя в Экономике
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Данные профиля игрока.
    post:
      tags:
      - Экономика
      summary: Модификация Профиля Пользователя
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Профиль обновлен.
  /civops/businesses:
    get:
      tags:
      - Экономика
      summary: Список Бизнесов
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Список зарегистрированных предприятий.
    post:
      tags:
      - Экономика
      summary: Создание / Редактирование Бизнеса
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Операция выполнена.
  /civops/mafias:
    get:
      tags:
      - Экономика
      summary: Данные Криминальных Организаций
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Список мафий и группировок.
    post:
      tags:
      - Экономика
      summary: Управление Группировками
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Статус операции.
  /civops/government:
    get:
      tags:
      - Экономика
      summary: Данные Госструктур и Казны
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Состояние госбюджета и департаментов.
    post:
      tags:
      - Экономика
      summary: Изменение Параметров Госструктур
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Параметры обновлены.
  /civops/store:
    get:
      tags:
      - Экономика
      summary: Магазин Товаров Экономика
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Каталог товаров магазина.
    post:
      tags:
      - Экономика
      summary: Покупка / Управление Товарами
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Результат транзакции.
  /civops/ads:
    get:
      tags:
      - Экономика
      summary: Список Рекламных Объявлений
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Активные рекламные кампании.
    post:
      tags:
      - Экономика
      summary: Подача Рекламного Объявления
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Объявление размещено.
  /civops/system:
    get:
      tags:
      - Экономика
      summary: Системная Информация Экономика
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Версия и конфигурация экономики.
  /civops/health:
    get:
      tags:
      - Экономика
      summary: Проверка Доступности Экономика API
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Сервис экономики активен.
  /stats:
    get:
      tags:
      - API Статистики
      summary: Универсальная Статистика Серверов
      description: 'Высокопроизводительный эндпоинт для мониторинга Discord-гильдий и игровых серверов ER:LC.

        Поддерживает множественные параметры `servers` и `metrics` (включая повторяющиеся query параметры):

        - `membercount` — участники онлайн;

        - `allmembercount` — общее количество участников сервера;

        - `botcount` — количество ботов;

        - `playercount` — текущий онлайн игроков в ER:LC.

        '
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Имена серверов. Выберите один или несколько серверов из выпадающего списка:

          - `MRP` — Moscow RolePlay (поддерживает все 4 метрики)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` — поддерживают `membercount`, `allmembercount`, `botcount`

          - `DOT` — поддерживает только `membercount`

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Типы запрашиваемых метрик:

          - `playercount` — онлайн игроков в игре ER:LC (**доступен ТОЛЬКО для `MRP`**)

          - `membercount` — количество участников Discord онлайн (доступен для всех)

          - `allmembercount` — общее число участников Discord сервера (все кроме `DOT`)

          - `botcount` — количество ботов на сервере (все кроме `DOT`)

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
        example:
        - playercount
      responses:
        '200':
          description: Объект со статистикой по каждому серверу и запрошенным метрикам.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: integer
                example:
                  MRP:
                    membercount: 1450
                    playercount: 38
                  MVD:
                    membercount: 320
                    playercount: 12
        '400':
          $ref: '#/components/responses/BadRequestError'
  /users:
    get:
      tags:
      - API Верификации
      summary: Поиск Связок Discord ID <-> Roblox ID
      description: 'Быстрый поиск привязанного аккаунта по одиночным или пакетным идентификаторам. Идентификаторы
        передавайте строками: числовые Discord snowflake теряют точность в JavaScript. GET с одним singular-параметром
        возвращает объект; plural-параметры и POST всегда возвращают массив. Отсутствующие связи в batch пропускаются,
        порядок не гарантирован. Пустой batch: HTTP 200 и []. Одиночная отсутствующая связь: HTTP 404.'
      parameters:
      - name: discordId
        in: query
        description: Discord ID пользователя.
        schema:
          type: string
      - name: robloxId
        in: query
        description: Roblox ID пользователя.
        schema:
          type: string
      - name: discordIds
        in: query
        description: Несколько Discord ID через запятую.
        schema:
          type: string
      - name: robloxIds
        in: query
        description: Несколько Roblox ID через запятую.
        schema:
          type: string
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersLookupResponse'
              examples:
                single:
                  value:
                    robloxId: '123456789'
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: Связь не найдена при одиночном GET.
      security:
      - ApiKeyHeader: []
    post:
      tags:
      - API Верификации
      summary: Пакетный Поиск Связок (Batch)
      description: 'Пакетный поиск пользователей через JSON тело запроса. Идентификаторы передавайте строками: числовые
        Discord snowflake теряют точность в JavaScript. GET с одним singular-параметром возвращает объект; plural-параметры
        и POST всегда возвращают массив. Отсутствующие связи в batch пропускаются, порядок не гарантирован. Пустой
        batch: HTTP 200 и []. Одиночная отсутствующая связь: HTTP 404.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discordIds:
                  type: array
                  items:
                    type: string
                robloxIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                type: array
                items: &id005
                  type: object
                  properties:
                    discordId: &id001
                      type: string
                    robloxId: *id001
                  required:
                  - discordId
                  - robloxId
              examples:
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: Связь не найдена при одиночном GET.
      security:
      - ApiKeyHeader: []
  /cdn/manifest:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - CDN Ассеты
      summary: Манифест Файлов Хранилища
      description: 'Снимок metadata namespace: success, count, domain, assets. Максимум 10000 ассетов; для полного
        большого каталога используйте пагинацию GET /cdn/assets.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Пространство имён. `default` — наш общий, либо домен клиента.
        schema:
          type: string
        example: acme
      responses:
        '200':
          description: Список ассетов пространства имён.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  domain:
                    type: string
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/CdnAsset'
              examples:
                manifest_ok:
                  summary: Manifest ok
                  value:
                    success: true
                    count: 1
                    domain: default
                    assets:
                    - name: Инструкция
                      slug: manual.png
                      domain: default
                      path: docs/manual.png
                      fullPath: default/docs/manual.png
                      full_path: default/docs/manual.png
                      folderId: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      folder_id: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      sourceType: LOCAL
                      source_type: LOCAL
                      sourceUrl: default/docs/manual.png
                      source_url: default/docs/manual.png
                      isPinned: true
                      is_pinned: 1
                      mimeType: image/png
                      mime_type: image/png
                      size: 70
                      sha256: c2153f77e11087fcb078ae38527fa83bef29791e3700e30cc87fec4405a66d0f
                      downloads: 0
                      createdAt: '2026-10-06T14:56:09.0798434Z'
                      created_at: '2026-10-06T14:56:09.0798434Z'
                      updatedAt: '2026-10-06T14:56:09.0798434Z'
                      updated_at: '2026-10-06T14:56:09.0798434Z'
                      folder:
                        name: Документы
                        slug: docs
        '401':
          description: Unauthorized (401) — ключ не передан.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: Forbidden (403) — ключ есть, но недостаточно прав.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: Лимит запросов исчерпан. Учитывайте Retry-After и retry_after; не запускайте неограниченные
            параллельные загрузки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
                retry_after: 30
                details:
                  count: 21
                  excess: 1
                  limit: 20
                  reset_at: 1792083600000
  /cdn/assets:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - CDN Ассеты
      summary: Список Ассетов
      description: 'Без path: assets, pagination, stats, success. С точным path без ids и prefix: asset, success.
        limit по умолчанию 50, максимум 100. totalPages минимум 1 даже для пустого результата.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Пространство имён (первый сегмент пути файла).
        schema:
          type: string
        example: acme
      - name: path
        in: query
        required: false
        description: Точный путь ассета внутри пространства имён.
        schema:
          type: string
        example: branding/logo.png
      - name: prefix
        in: query
        required: false
        description: Префикс пути для выборки группы файлов.
        schema:
          type: string
        example: branding/
      - name: folderId
        in: query
        required: false
        description: 'ID папки UI. Папка — только визуальная группировка, на путь файла не влияет.

          `root` или `null` — файлы без папки, `all` — без фильтра.

          '
        schema:
          type: string
        example: root
      - name: search
        in: query
        required: false
        description: Поиск по имени, слагу и полному пути.
        schema:
          type: string
      - name: sourceType
        in: query
        required: false
        description: Фильтр по типу источника.
        schema:
          type: string
          enum:
          - LOCAL
          - EXTERNAL
          - all
      - name: isPinned
        in: query
        required: false
        description: Фильтр по закреплению.
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        description: Номер страницы, начиная с 1.
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        description: Количество элементов на странице, максимум 100.
        schema:
          type: integer
          default: 50
          maximum: 100
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    success: &id002
                      type: boolean
                    asset:
                      $ref: '#/components/schemas/CdnAsset'
                  required:
                  - success
                  - asset
                - type: object
                  properties:
                    success: *id002
                    assets:
                      type: array
                      items:
                        $ref: '#/components/schemas/CdnAsset'
                    pagination:
                      type: object
                      properties:
                        page: &id003
                          type: integer
