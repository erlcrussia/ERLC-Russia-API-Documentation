                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
        '400':
          description: 'URL не прошёл проверку: на запрос с правильной подписью нужно ответить 2xx, с поддельной — 4xx. Причина — в `reason`, ответ URL — в `status`.'
          content:
            application/json:
              example:
                code: 5051
                message: Webhook Verification Failed
                reason: forged_accepted
                status: 200
    delete:
      tags:
      - Пользовательские Вебхуки
      summary: Удаление URL
      description: Удаляет один URL из ваших вебхуков.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
            example:
              url: https://my-bot.example.com/erlc-events
      parameters:
      - name: url
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Вебхук удален.
          content:
            application/json:
              example:
                success: true
                message: Webhook URL removed successfully
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
