                    success: true
                    assets: []
                    pagination:
                      page: 1
                      limit: 50
                      total: 0
                      totalPages: 1
                    stats:
                      totalAssets: 0
                      total_assets: 0
                      totalFolders: 0
                      total_folders: 0
                      pinnedAssets: 0
                      pinned_assets: 0
                      localAssets: 0
                      local_assets: 0
                      externalAssets: 0
                      external_assets: 0
                      totalBytes: 0
                      total_bytes: 0
                      totalDownloads: 0
                      total_downloads: 0
        '401':
          description: Unauthorized (401) — ключ не передан.
          content:
            application/json:
              examples:
