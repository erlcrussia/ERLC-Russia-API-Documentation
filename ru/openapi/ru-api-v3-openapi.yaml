              serverIds:
              - '12345678'
      responses:
        '200':
          description: Вебхук успешно обновлен.
          content:
            application/json:
              example:
                success: true
                message: Webhook updated successfully
                urls:
                - url: https://my-bot.example.com/erlc-events-v2
