                    type: boolean
      description: 'Создаёт AI-ключ для OpenAI-совместимого API: agent, chat или voice.


        Создание AI-ключа и обмен коинов требуют сессию владельца. Обычный HTTP-ключ, даже с полным доступом, не разрешает эти операции. Доверенные сервисы используют административные методы
        с мастер-ключом.'
