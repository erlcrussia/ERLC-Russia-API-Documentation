      summary: Генерация заголовка чата
      description: Генерирует лаконичный заголовок чата (2-4 слова). Для пользовательских API-ключей списывает AI-кредиты
        согласно токенам. С Master Key работает безлимитно. Исполнительный AI-ключ не предоставляет права управления
