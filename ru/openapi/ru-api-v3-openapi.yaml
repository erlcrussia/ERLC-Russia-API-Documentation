  /keys:
    get:
      tags:
      - API Ключей
      summary: Получение Ключей и Ограничений
      description: "Универсальный эндпоинт для получения списка API и WebSocket токенов, а также их ограничений.\n\
        Для выполнения запроса требуется передать один из query-параметров `api=true` или `websocket=true`.\nЧтобы\
        \ включить ограничения прав для ключа, передайте параметр `restrictions=true` после соответствующего типа\
        \ (например `?api=true&restrictions=true` или `?api=true&restrictions=true&websocket=true&restrictions=true`).\n\
        \ Ответ содержит секретные ключи владельца, включая другие его серверы. Не вызывайте из браузерного приложения\
        \ и не логируйте ответ. Массив restrictions отражает явно разрешённые записи, а не полную эффективную политику\
        \ доступа."
      parameters:
      - name: api
        in: query
        description: Запросить список HTTP API токенов
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Запросить список WebSocket токенов
        schema:
          type: boolean
        example: true
      - name: restrictions
        in: query
        description: Включить ограничения прав (указывается после api или websocket)
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Список запрошенных ключей (массив или объект при одновременном запросе api и websocket).
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ApiKeyItem'
                - type: array
                  items:
                    $ref: '#/components/schemas/WebSocketKeyItem'
                - type: object
                  properties:
                    api:
                      type: array
                      items:
                        $ref: '#/components/schemas/ApiKeyItem'
                    websocket:
                      type: array
                      items:
                        $ref: '#/components/schemas/WebSocketKeyItem'
              examples:
                api_only:
                  summary: Запрос только API ключей (?api=true&restrictions=true)
                  value:
                  - id: '1'
                    key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    userId: '403258784102940682'
                    serverId: srv_8f9a2b1c4e
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      endpoints:
                      - erlc.server
                      - civops.economy
                      versions:
                      - v3
                      queryParams:
                      - Players
                      - Staff
                      actions:
                      - webhook:add
                      - logs:read
                websocket_only:
                  summary: Запрос только WebSocket ключей (?websocket=true&restrictions=true)
                  value:
                  - id: '1'
                    key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    userId: '403258784102940682'
                    serverId: srv_3d5e7f9a1b
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      channels:
                      - server:players
                      - server:logs
                      blockedIPs: []
                both:
                  summary: Запрос обоих типов (?api=true&websocket=true)
                  value:
                    api:
                    - id: '1'
                      key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      userId: '403258784102940682'
                      serverId: srv_8f9a2b1c4e
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
                    websocket:
                    - id: '1'
                      key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      userId: '403258784102940682'
                      serverId: srv_3d5e7f9a1b
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
