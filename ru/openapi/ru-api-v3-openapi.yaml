                    token:
                      type: string
                    name:
                      type: string
                    scope:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    is_active:
                      type: boolean
                    tools_enabled:
                      type: boolean
    post:
      tags:
      - AI Studio
      summary: Новый AI-ключ
      security:
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Studio Key
                scope:
                  type: string
                  enum:
                  - agent
                  - chat
                  - voice
            example:
              name: Discord-бот
              scope: chat
      responses:
        '403':
