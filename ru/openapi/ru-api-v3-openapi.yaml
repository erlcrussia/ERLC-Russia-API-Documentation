          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - API Ключей
      summary: Новые ключи
      description: 'Перевыпускает API- и/или WebSocket-ключ. Старый перестаёт работать, права и подписки переходят на новый.


        Ротация одного ключа разрешена раз в пять минут; при 429 учитывайте Retry-After. Успешная ротация записывается в аудит с ID ключа и IP, без секрета.'
      parameters:
      - name: api
        in: query
        description: Перегенерировать HTTP API ключ
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Перегенерировать WebSocket ключ
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Токен(ы) успешно перегенерирован(ы).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  oldToken:
                    type: string
                  newToken:
                    type: string
                  token:
                    type: string
                  apiKey:
                    type: string
                  key:
                    type: string
                  userId:
                    type: string
                  serverId:
                    type: string
              example:
                success: true
                message: API key regenerated successfully
                oldToken: a8Fk2L...hJkL
                newToken: Zp4Kq9LmQ2xXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhW8
                token: Zp4Kq9LmQ2xXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhW8
                apiKey: Zp4Kq9LmQ2xXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhW8
                key: Zp4Kq9LmQ2xXc7VbN3sDf6GhJ1kLp0QwErTyUiOpAsDfGhW8
                userId: '123456789012345678'
                serverId: '12345678'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /webhooks:
    get:
      tags:
      - Пользовательские Вебхуки
      summary: Мои вебхуки
      description: Ваши URL вебхуков и их статус.
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Список вебхуков пользователя.
          content:
            application/json:
              schema:
                type: object
                properties:
                  discord_id:
                    type: string
                  server_id:
                    type: string
                  is_active:
                    type: boolean
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
                  count:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
              example:
                discord_id: '123456789012345678'
                server_id: '12345678'
                is_active: true
                urls:
                - url: https://my-bot.example.com/erlc-events
                  isActive: true
                  serverIds:
                  - '12345678'
                count: 1
                created_at: '2026-10-01T12:00:00Z'
                updated_at: '2026-10-21T12:00:00Z'
    delete:
      tags:
      - Пользовательские Вебхуки
      summary: Удаление всех URL
      description: Удаляет все ваши URL вебхуков.
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Вебхуки удалены.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: All user webhooks deleted successfully
    post:
      tags:
      - Пользовательские Вебхуки
      summary: Приём событий игры
      description: Сюда ER:LC присылает события сервера с подписью Ed25519. API проверяет подпись и рассылает событие на ваши URL.
      security:
      - SignatureTimestamp: []
        SignatureEd25519: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server:
                  type: string
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      event:
                        type: string
                      timestamp:
                        type: integer
                      origin:
                        type: string
                      data:
                        type: object
                        properties:
                          command:
                            type: string
                          player:
                            type: string
            example:
              server: '12345678'
              events:
              - event: CustomCommand
                timestamp: 1792083600
                origin: '12345678'
                data:
                  command: ;help
                  player: Builderman
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                status: received
                event_type: CustomCommand
                server_id: '12345678'
              schema:
                type: object
                properties:
                  status:
                    type: string
                  event_type:
                    type: string
                  server_id:
                    type: string
  /webhooks/add-url:
    post:
      tags:
      - Пользовательские Вебхуки
      summary: Добавление URL
      description: Добавляет URL для событий игры. URL принимается, только если он проверяет подпись, и сразу включён. Ключ, привязанный к серверу, может подписать URL только на свой сервер.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                serverIds:
                  type: array
                  items:
                    type: string
            example:
              url: https://my-bot.example.com/erlc-events
              serverIds:
              - '12345678'
      responses:
        '201':
          description: Вебхук успешно зарегистрирован.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
                  is_active:
                    type: boolean
                  discord_id:
                    type: string
              example:
                success: true
                message: Webhook URL added successfully
                urls:
                - url: https://my-bot.example.com/erlc-events
                  isActive: true
                  serverIds:
                  - '12345678'
                is_active: true
                discord_id: '123456789012345678'
        '403':
          description: Запрещено привязывать вебхук к данному серверу.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Вам запрещено привязывать вебхук к серверу '999999'. Разрешенный сервер для вашего ключа '12345678'
                  forbidden_server_id:
                    type: string
                    example: '999999'
                  allowed_server_id:
                    type: string
                    example: '12345678'
        '400':
          description: 'URL не прошёл проверку: на запрос с правильной подписью нужно ответить 2xx, с поддельной — 4xx. Причина — в `reason`, ответ URL — в `status`.'
          content:
            application/json:
              example:
                code: 5051
                message: Webhook Verification Failed
                reason: forged_accepted
                status: 200
  /webhooks/url:
    put:
      tags:
      - Пользовательские Вебхуки
      summary: Изменение URL
      description: Меняет адрес URL и серверы. Новый адрес проверяется подписью, включён URL или нет — не меняется.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
