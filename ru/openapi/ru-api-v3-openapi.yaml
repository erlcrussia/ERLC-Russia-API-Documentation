  /cdn/assets/purge:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    post:
      tags:
      - CDN Ассеты
      summary: Сброс кэша файлов
      description: 'Сбрасывает кэш файлов по `ids`, `path` или `prefix`; без них — всего пространства. `success` означает, что сброс принят, а не завершён.


        Без ids/path/prefix сброс всего namespace выполняется в фоне: HTTP 202, status=queued, acceptedCount — число выбранных объектов, а не подтверждение завершения. Не чаще одного запроса
        в минуту на команду и namespace; при 429 учитывайте Retry-After. Результат выполнения записывается в аудит API. Точечный сброс сохраняет HTTP 200 и purgedCount. Новый уникальный
        URL релиза обычно не требует purge сразу после загрузки: это удаляет прогретый кэш.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Пространство имён.
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Точный путь ассета.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: Список ID ассетов. Передаётся только в теле запроса, не в query.
                  items:
                    type: string
            example:
              ids:
              - ast_7Kq2Zp
      responses:
        '200':
          description: Кэш сброшен.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - path
                    - ids
                    - prefix
                  purgedCount:
                    type: integer
              examples:
                purge_ok:
                  summary: Purge ok
                  value:
                    success: true
                    domain: default
                    scope: ids
                    purgedCount: 1
        '401':
          description: Unauthorized (401) — ключ не передан.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: Forbidden (403) — ключ есть, но недостаточно прав.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: Лимит запросов исчерпан. Учитывайте Retry-After; не запускайте неограниченные параллельные загрузки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
        '202':
          description: 'Без ids/path/prefix сброс всего namespace выполняется в фоне: HTTP 202, status=queued, acceptedCount — число выбранных объектов, а не подтверждение завершения. Не
            чаще одного запроса в минуту на команду и namespace; при 429 учитывайте Retry-After. Результат выполнения записывается в аудит API. Точечный сброс сохраняет HTTP 200 и purgedCount.
            Новый уникальный URL релиза обычно не требует purge сразу после загрузки: это удаляет прогретый кэш.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - domain
                  status:
                    type: string
                    enum:
                    - queued
                  acceptedCount:
                    type: integer
