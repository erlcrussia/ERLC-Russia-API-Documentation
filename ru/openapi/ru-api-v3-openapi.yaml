  /stats:
    get:
      tags:
      - API Статистики
      summary: Статистика серверов
      description: Онлайн ER:LC и численность серверов Discord. Можно запросить несколько серверов и метрик сразу.
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Имена серверов. Выберите один или несколько серверов из выпадающего списка:

          - `MRP` — Moscow RolePlay (поддерживает все 4 метрики)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` — поддерживают `membercount`, `allmembercount`, `botcount`

          - `DOT` — поддерживает только `membercount`

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Типы запрашиваемых метрик:

          - `playercount` — онлайн игроков в игре ER:LC (**доступен ТОЛЬКО для `MRP`**)

          - `membercount` — количество участников Discord онлайн (доступен для всех)

          - `allmembercount` — общее число участников Discord сервера (все кроме `DOT`)

          - `botcount` — количество ботов на сервере (все кроме `DOT`)

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
        example:
        - playercount
      responses:
        '200':
          description: Объект со статистикой по каждому серверу и запрошенным метрикам.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: integer
                example:
                  MRP:
                    membercount: 1450
                    playercount: 38
                  MVD:
                    membercount: 320
                    playercount: 12
        '400':
          $ref: '#/components/responses/BadRequestError'
