          items:
            type: integer
        CurrentPlayers:
          type: integer
          example: 42
        MaxPlayers:
          type: integer
          example: 50
        JoinKey:
          type: string
          example: MRP
        AccVerifiedReq:
          type: string
          example: Disabled
        TeamBalance:
          type: boolean
          example: true
