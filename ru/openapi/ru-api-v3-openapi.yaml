      summary: Загрузка Файла
      description: 'Загрузите multipart/form-data с полем file. Не задавайте Content-Type вручную: клиент должен
        добавить boundary. domain и path можно передать в multipart; явный multipart domain имеет приоритет над
        query. Для чанков используйте compress=false и MIME text/javascript или text/css. Путь _next/static и имена
        _app.js поддерживаются. Ответ HTTP 200, не 201. Повтор явно занятого пути возвращает 409 без перезаписи.
