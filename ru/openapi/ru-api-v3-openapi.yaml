      summary: Удаление AI-ключа (через Header / Body / Query)
      description: Удаляет AI-ключ текущего пользователя. Ключ для удаления можно передать в заголовке `target-api-key`
        (или `token`), в теле JSON `{"token":"..."}`, через query-параметр `?token=...`, либо без параметров (чтобы
        отозвать сам ключ запроса).
      parameters:
      - name: target-api-key
        in: header
        required: false
        description: Токен удаляемого ключа
        schema:
          type: string
      - name: token
        in: query
        required: false
        description: Токен удаляемого ключа
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: integer
      responses:
        '200':
          description: 'Ключ удален ({success: true, deleted: true, token: "..."}).'
  /ai/keys/{id}:
    delete:
      tags:
      - AI Studio
      summary: Удаление AI-ключа по ID/Токену в URL
      description: Удаляет AI-ключ текущего пользователя по токену или числовому ID в пути URL.
      parameters:
      - name: id
        in: path
        required: true
        description: Токен ключа (sk-chat-...) или числовой ID.
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: 'Ключ удален ({success: true, deleted: true, token: "..."}).'
  /ai/audio/pricing:
    get:
      tags:
      - AI Audio
      summary: Тарифы и ограничения голосового API
      description: Возвращает модель, стоимость, максимальную длительность и формат аудио для распознавания речи.
      responses:
        '200':
          description: Параметры голосового API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: {type: string}
                  credits_per_minute: {type: number}
                  speech_credits_per_1000_characters: {type: number}
                  speech_max_characters: {type: integer}
                  speech_voice: {type: string}
                  billing_unit: {type: string}
                  max_duration_seconds: {type: integer}
                  format: {type: string}
  /ai/audio/transcriptions:
    post:
      tags:
      - AI Audio
      summary: Распознавание речи
      description: Принимает WAV в mono PCM 16-bit 16000 Hz длительностью до 120 секунд. Нужен AI-ключ с правом voice.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          default: ru
      responses:
        '200':
          description: Распознанный текст и сведения о списании кредитов.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: {type: string}
                  model: {type: string}
                  duration_seconds: {type: number}
                  credits_charged: {type: number}
        '400':
          description: Некорректный или повреждённый WAV-файл.
        '401':
          description: AI-ключ отсутствует или недействителен.
        '413':
          description: Аудио длиннее 120 секунд.
        '415':
          description: Требуется Content-Type audio/wav.
        '503':
          description: Сервис распознавания недоступен.
  /ai/title:
    post:
      tags:
