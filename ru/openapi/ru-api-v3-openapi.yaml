      - CookieAuth: []
      responses:
        '200':
          description: Список ключей.
          content:
            application/json:
              example:
              - id: '21'
                token: sk-chat-3...0a1c
                name: Discord-бот
                scope: chat
                created_at: '2026-10-21T12:00:00Z'
                is_active: true
                tools_enabled: false
              schema:
                type: array
