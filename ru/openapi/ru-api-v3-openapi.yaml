  # ==================== Интеграция и Токены V3 ====================
  /points/{userId}:
    get:
      tags: [ "API Наказаний" ]
      summary: Баланс Баллов Пользователя
      parameters:
        - name: userId
          in: path
          required: true
          description: Discord ID или Roblox ID игрока.
          schema:
            type: string
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        '200':
          description: Текущий баланс баллов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsBalanceResponse'

  /points/{userId}/history:
    get:
      tags: [ "API Наказаний" ]
      summary: История Транзакций Баллов
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      responses:
        '200':
          description: История начислений и списаний.

  /points/{userId}/add:
    post:
      tags: [ "API Наказаний" ]
      summary: Начисление Баллов
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ "amount" ]
              properties:
                amount:
                  type: integer
                  minimum: 1
                reason:
                  type: string
      responses:
        '200':
          description: Баллы успешно начислены.

  /points/{userId}/remove:
    post:
      tags: [ "API Наказаний" ]
      summary: Списание Баллов
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
        - ApiKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ "amount" ]
              properties:
                amount:
                  type: integer
                  minimum: 1
                reason:
                  type: string
      responses:
        '200':
          description: Баллы успешно списаны.

  # ==================== Подписки и Магазин V3 ====================
  /subscriptions/config/funpay:
    get:
      tags: [ "API Подписок" ]
      summary: Конфигурация Магазина FunPay
      description: Возвращает список доступных для покупки лотов, цен и описаний товаров FunPay.
      responses:
        '200':
          description: Конфиг товаров.

  /subscriptions/config/plans:
    get:
      tags: [ "API Подписок" ]
      summary: Тарифные Планы и Лимиты
      description: Возвращает матрицу планов подписок (Free, Premium, Enterprise), лимиты запросов и доступные функции.
      responses:
        '200':
          description: Каталог планов.

  /subscriptions/user:
    get:
      tags: [ "API Подписок" ]
      summary: Активные Подписки Пользователя
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Список действующих подписок с датами окончания.

  /subscriptions/user-benefits:
    get:
      tags: [ "API Подписок" ]
      summary: Активные Преимущества Пользователя
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Сводный список включенных опций (роли, лимиты, доступы).

  /subscriptions/funpay/create-order:
    post:
      tags: [ "API Подписок" ]
      summary: Создание Заказа FunPay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ "planId" ]
              properties:
                planId:
                  type: string
                discordId:
                  type: string
      responses:
        '200':
          description: Заказ сформирован. Возвращается проверочный код.

  /subscriptions/funpay/order-status/{code}:
    get:
      tags: [ "API Подписок" ]
      summary: Проверка Статуса Заказа FunPay
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Статус оплаты и активации заказа.

  /subscriptions/activate:
    post:
      tags: [ "API Подписок" ]
      summary: Прямая Активация Подписки
      description: Требуется Master Key или административная сессия.
      security:
        - MasterKeyHeader: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ "discordId", "planId", "durationDays" ]
              properties:
                discordId:
                  type: string
                planId:
                  type: string
                durationDays:
                  type: integer
      responses:
        '200':
          description: Подписка активирована.

  /subscriptions/deactivate:
    post:
      tags: [ "API Подписок" ]
      summary: Деактивация Подписки
      security:
        - MasterKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ "subscriptionId" ]
              properties:
                subscriptionId:
                  type: string
      responses:
        '200':
          description: Подписка деактивирована.

  /subscriptions/purchase-with-coins:
    post:
      tags: [ "API Подписок" ]
      summary: Покупка Подписки за Коины
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ "planId" ]
              properties:
                planId:
                  type: string
      responses:
        '200':
          description: Подписка приобретена со списанием коинов с баланса.

  # ==================== Авторизация и Сессии V3 ====================
  /gateway:
    get:
      tags: [ "Реальное Время и Вебхуки" ]
      summary: WebSocket Gateway V3
      description: |
        Высокоскоростное двунаправленное WebSocket соединение для получения событий игровых серверов в реальном времени:
        - Каналы: `queue`, `players`, `staff`, `kills`, `modcalls`, `vehicles`, `joinlogs`, `commandlogs`.
        - Клиент подписывается сообщением: `{"op": "subscribe", "channels": ["players", "queue"], "token": "..."}`.
      responses:
        '101':
          description: Успешный апгрейд до WebSocket протокола.

  /webhooks:
    post:
      tags: [ "Реальное Время и Вебхуки" ]
      summary: Входящие Вебхуки Событий PRC
      description: |
        Эндпоинт приема серверных событий из игры. Каждое сообщение обязательно подписано
        криптографической подписью Ed25519 в заголовках:
        - `x-signature-timestamp` — Unix timestamp запроса (защита от replay атак, окно 5 минут);
        - `x-signature-ed25519` — Hex-строка подписи тела запроса.
      security:
        - SignatureTimestamp: []
        - SignatureEd25519: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Событие успешно обработано и смаршрутизировано.
        '401':
          description: Неверная подпись Ed25519 или устаревший timestamp.

  # ==================== Административный API V3 ====================
  /health:
    get:
      tags: [ "API Состояния" ]
      summary: Проверка Здоровья Сервиса (Health Check)
      description: Проверяет статус подключения к базе данных PostgreSQL и кэшу Redis.
      responses:
        '200':
          description: Сервис полностью исправен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: База данных или Redis недоступны (режим degraded).

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API Ключ в заголовке Authorization (формат `Bearer <token>`).
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Ключ в заголовке X-API-Key.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: token
      description: API Ключ в query параметре `token`.
    MasterKeyHeader:
      type: apiKey
      in: header
      name: X-Master-Key
      description: Секретный мастер-ключ сервиса (SUPER_ADMIN).
    CookieAuth:
      type: apiKey
      in: cookie
      name: erlc_auth
      description: Сессионная HTTP-Only кука авторизации на портале.
    SignatureTimestamp:
      type: apiKey
      in: header
      name: x-signature-timestamp
      description: Unix timestamp подписи входящего вебхука.
    SignatureEd25519:
      type: apiKey
      in: header
      name: x-signature-ed25519
      description: Криптографическая Ed25519 подпись тела запроса вебхука.

  schemas:
    ERLCServerResponse:
      type: object
      properties:
        Name:
          type: string
          example: "Moscow RolePlay | City & Province"
        OwnerId:
          type: integer
          example: 1133665013
        CoOwnerIds:
          type: array
          items:
            type: integer
        CurrentPlayers:
          type: integer
          example: 42
        MaxPlayers:
          type: integer
          example: 50
        JoinKey:
          type: string
          example: "MRP"
        AccVerifiedReq:
          type: string
          example: "Disabled"
        TeamBalance:
          type: boolean
          example: true

    ERLCBanItem:
      type: object
      properties:
        Player:
          type: string
          example: "PlayerName:12345678"
        Reason:
          type: string
          example: "Нарушение правил сервера"

    ERLCCommandResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Команда успешно выполнена"

    UsersLookupResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        users:
          type: array
          items:
            type: object
            properties:
              discordId:
                type: string
                example: "1133665013794607114"
              robloxId:
                type: string
                example: "450123984"
              robloxUsername:
                type: string
                example: "Alex_Roblox"

    CDNAssetListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CDNAsset'
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 6

    CDNAsset:
      type: object
      properties:
        id:
          type: string
          example: "ast_9f8d1c2b"
        name:
          type: string
          example: "banner_summer_2026.png"
        url:
          type: string
          example: "https://api.erlcrussia.xyz/v3/cdn/resolve/banners/banner_summer_2026.png"
        sizeBytes:
          type: integer
          example: 2451920
        mimeType:
          type: string
          example: "image/png"
        folderId:
          type: string
          nullable: true
          example: "fld_general"
        createdAt:
          type: string
          format: date-time

    CDNUploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        asset:
          $ref: '#/components/schemas/CDNAsset'

    CDNStatsResponse:
      type: object
      properties:
        totalAssets:
          type: integer
          example: 350
        totalSizeBytes:
          type: integer
          example: 1548291000
        totalFolders:
          type: integer
          example: 14

    PointsBalanceResponse:
      type: object
      properties:
        userId:
          type: string
          example: "1133665013794607114"
        points:
          type: integer
          example: 1500

    AuthSessionResponse:
      type: object
      properties:
        valid:
          type: boolean
          example: true
        user:
          type: object
          properties:
            discordId:
              type: string
              example: "1133665013794607114"
            discordUsername:
              type: string
              example: "AdminDev"
            robloxId:
              type: string
              example: "450123984"
            robloxUsername:
              type: string
              example: "Admin_RBLX"
            roles:
              type: array
              items:
                type: string
              example: ["SUPER_ADMIN"]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        database:
          type: string
          example: "connected"
        redis:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Описание ошибки"

  responses:
    BadRequestError:
      description: Неверные параметры запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Отсутствует или недействителен токен авторизации.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Недостаточно прав или действие заблокировано ограничениями ключа.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Запрашиваемый ресурс не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'