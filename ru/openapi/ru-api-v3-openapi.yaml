components:
  securitySchemes:
    AIManagementKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Обычный пользовательский API ключ для управления кредитами и AI ключами; исполнительные sk-chat/sk-agent/sk-voice
        не разрешены.
    AIExecutionKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Исполнительный sk-chat/sk-agent/sk-voice ключ в соответствии с методом.
    BearerAuth:
      type: http
      scheme: bearer
      description: API-ключ в заголовке Authorization в формате `Bearer <token>`.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-key
      description: Пользовательский API-ключ. Храните на сервере; не включайте в клиентский JavaScript.
    WebSocketKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-websocket-key
      description: Единый заголовок WebSocket-ключа erlcrussia-websocket-key.
    CookieAuth:
      type: apiKey
      in: cookie
      name: erlc_auth
      description: Сессионная HTTP-Only кука авторизации на портале.
    CDNDeployToken:
      type: apiKey
      in: header
      name: erlcrussia-api-cdn-token
      description: Отдельный deploy-токен подтверждённого CDN-домена.
  schemas:
    UserAsset:
      type: object
      required:
      - id
      - domain
      - path
      - name
      - mimeType
      - kind
      - status
      - url
      - size
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
        domain:
          type: string
        path:
          type: string
        name:
          type: string
        mimeType:
          type: string
        kind:
          type: string
        status:
          type: string
        url:
          type: string
        size:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    CoinOperation:
      type: object
      required:
      - id
      - resourceKey
      - discordId
      - amount
      - state
      properties:
        id:
          type: string
        resourceKey:
          type: string
        discordId:
          type: string
        amount:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - pending
          - deducted
          - refunded
        remainingCoins:
          type:
          - integer
          - 'null'
        refundBalance:
          type:
          - integer
          - 'null'
        reason:
          type:
          - string
          - 'null'
        replayed:
          type: boolean
    CDNAssetListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CDNAsset'
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 6
    UsersLookupResponse:
      oneOf:
      - type: object
        properties:
          discordId: *id001
        required:
        - discordId
        additionalProperties: false
      - type: object
        properties:
          robloxId: *id001
        required:
        - robloxId
        additionalProperties: false
      - type: object
        properties:
          discordId:
            type:
            - string
            - 'null'
          robloxId:
            type:
            - string
            - 'null'
        required:
        - discordId
        - robloxId
        additionalProperties: false
      - type: array
        items: *id005
    ERLCCommandResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Команда успешно выполнена
