openapi: 3.1.0
info:
  title: ER:LC Россия API V3
  description: 'API ER:LC Россия: серверы, пользователи, CDN, редиректы, подписки и ключи доступа.'
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
  description: Основной сервер (com)
- url: https://api.erlcrussia.xyz/v3
  description: Резервный сервер (xyz)
tags:
- name: ER:LC Сервер
  description: Получение статуса, онлайна, списков игроков и персонала сервера ER:LC.
- name: ER:LC Команды
  description: Отправка и постановка в очередь команд внутриигрового сервера (:h, :m, :kick, :ban и др.).
- name: Экономика
  description: Взаимодействие с экономической системой (пользователи, бизнесы, мафии, магазин, реклама).
- name: API Статистики
  description: Высокопроизводительное получение статистики дискорд-серверов и игровых серверов (онлайн, участники, боты).
- name: API Верификации
  description: Поиск и сопоставление Discord ID и Roblox ID аккаунтов.
- name: CDN Ассеты
  description: Загрузка, управление, статистика и очистка кэша файлов объектного хранилища MinIO / Edge CDN.
- name: CDN Папки
  description: Иерархическая структура и сортировка папок медиатеки CDN.
- name: API Наказаний
  description: Управление балансом и историей транзакций баллов игроков.
- name: API Токенов
  description: Управление API токенами интеграции и проверка активных подписок.
- name: API Подписок
  description: Каталог планов, заказы FunPay, начисление бенефитов и активация подписок.
- name: API Авторизации
  description: Вход через Discord и Roblox OAuth2, управление сессиями пользователя и связывание аккаунтов.
- name: Реальное Время и Вебхуки
  description: WebSocket шлюз событий и обработчик входящих вебхуков PRC с криптографической подписью Ed25519.
- name: API Управления - Ключи
  description: Выпуск, аудит, деактивация и разграничение прав API ключей.
- name: API Управления - Ограничения
  description: Тонкая настройка разрешенных версий, эндпоинтов, действий (actions) и query-параметров.
- name: API Управления - WebSocket Ключи
  description: Управление ключами доступа к WebSocket шлюзу и подписками на каналы.
- name: API Управления - Вебхуки
  description: Регистрация, валидация доступности и мониторинг пользовательских вебхуков.
- name: API Управления - Панель
  description: Управление пользователями, подписками, тарифами, ручной баланс и системная статистика.
- name: API Состояния
  description: Мониторинг работоспособности сервиса, подключений к PostgreSQL и Redis.
paths:
  /erlc/server:
    get:
      tags:
      - ER:LC Сервер
      summary: Информация
      description: Название, онлайн и статус сервера. Query-параметрами можно добавить игроков, персонал, очередь и логи.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Включить детальный список игроков на сервере.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Включить список сотрудников и модераторов (Admins, Mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Включить журнал входов и выходов.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Включить состояние очереди ожидания подключения.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Включить журнал убийств.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Включить журнал выполненных команд.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Включить активные вызовы модераторов.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Включить список заспавненных транспортных средств.
        schema:
          type: boolean
      responses:
        '200':
          description: Успешный ответ с данными сервера.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Name:
                    type: string
                  OwnerId:
                    type: integer
                  CoOwnerIds:
                    type: array
                    items:
                      type: integer
                  CurrentPlayers:
                    type: integer
                  MaxPlayers:
                    type: integer
                  JoinKey:
                    type: string
                  AccVerifiedReq:
                    type: string
                  TeamBalance:
                    type: boolean
                  Players:
                    type: array
                    items:
                      type: object
                      properties:
                        Player:
                          type: string
                        Permission:
                          type: string
                        Callsign:
                          type: string
                        Team:
                          type: string
                  Queue:
                    type: array
                    items:
                      type: integer
              example:
                Name: Moscow RolePlay I RU
                OwnerId: 1234567
                CoOwnerIds:
                - 7654321
                CurrentPlayers: 32
                MaxPlayers: 40
                JoinKey: MRPRU
                AccVerifiedReq: Disabled
                TeamBalance: true
                Players:
                - Player: Builderman:156
                  Permission: Server Administrator
                  Callsign: 1-A-12
                  Team: Police
                Queue:
                - 261
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:LC Сервер
      summary: Баны сервера
      description: Заблокированные игроки сервера ER:LC.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Список забаненных пользователей.
          content:
            application/json:
              schema:
                type: object
                properties:
                  '156':
                    type: string
                  '261':
                    type: string
              example:
                '156': Builderman
                '261': Shedletsky
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - ER:LC Команды
      summary: Команда на сервере
      description: Выполняет команду на сервере ER:LC, например `:h Сообщение`. При временной ошибке ER:LC команда ставится в очередь повтора.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: Текст команды с двоеточием (например, ":m Сервер перезагружается").
            example:
              command: :h Сервер перезапустится через 5 минут
      responses:
        '200':
          description: Команда успешно передана на сервер или поставлена в очередь.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                  QueueSize:
                    type: integer
              example:
                Status: Queued
                QueueSize: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - Экономика
      summary: 'Экономика: деньги игроков'
      description: Баланс игрока, топ по деньгам, место в топе и кулдауны команд.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Данные экономики.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                cash: 15000
                bank: 82000
                rank: 14
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  cash:
                    type: integer
                  bank:
                    type: integer
                  rank:
                    type: integer
    post:
      tags:
      - Экономика
      summary: 'Экономика: операции с деньгами'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fromUserId:
                  type: string
                toUserId:
                  type: string
                amount:
                  type: integer
            example:
              fromUserId: '123456789012345678'
              toUserId: '234567890123456789'
              amount: 500
      responses:
        '200':
          description: Успешное обновление.
          content:
            application/json:
              example:
                success: true
                fromUserId: '123456789012345678'
                toUserId: '234567890123456789'
                amount: 500
                newBalance:
                  cash: 14500
                  bank: 82000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  fromUserId:
                    type: string
                  toUserId:
                    type: string
                  amount:
                    type: integer
                  newBalance:
                    type: object
                    properties:
                      cash:
                        type: integer
                      bank:
                        type: integer
      description: Переводы, банк, начисление, списание, сброс баланса и кулдаунов.
  /civops/users:
    get:
      tags:
      - Экономика
      summary: 'Экономика: игрок'
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Данные профиля игрока.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                inventory:
                - name: Аптечка
                  amount: 2
                  description: Восстанавливает здоровье
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  inventory:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: integer
                        description:
                          type: string
      description: Инвентарь игрока и история его операций.
    post:
      tags:
      - Экономика
      summary: 'Экономика: инвентарь игрока'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                item:
                  type: object
                  properties:
                    name:
                      type: string
                    amount:
                      type: integer
            example:
              userId: '123456789012345678'
              item:
                name: Аптечка
                amount: 1
      responses:
        '200':
          description: Профиль обновлен.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                amount: 1
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  amount:
                    type: integer
      description: Добавление и удаление предметов, очистка инвентаря.
  /civops/businesses:
    get:
      tags:
      - Экономика
      summary: 'Экономика: бизнесы'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Список зарегистрированных предприятий.
          content:
            application/json:
              example:
                page: 1
                total: 1
                businesses:
                - id: B7K2Q9XZ
                  name: Кафе «Арбат»
                  form: ООО
                  status: active
                  owner_id: '123456789012345678'
                  owner_name: player
                  address: ул. Арбат, 10
                  bank: 120000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  businesses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        form:
                          type: string
                        status:
                          type: string
                        owner_id:
                          type: string
                        owner_name:
                          type: string
                        address:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Бизнесы: список, карточка, баланс, сотрудники, товары, переводы, рейтинг и заявки.'
    post:
      tags:
      - Экономика
      summary: 'Экономика: действия с бизнесами'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                amount:
                  type: integer
            example:
              businessId: B7K2Q9XZ
              amount: 5000
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              example:
                success: true
                businessId: B7K2Q9XZ
                added: 5000
                newBalance: 125000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  businessId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Заявки, создание и удаление бизнесов, деньги, сотрудники и товары.
  /civops/mafias:
    get:
      tags:
      - Экономика
      summary: 'Экономика: мафии'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Список мафий и группировок.
          content:
            application/json:
              example:
                page: 1
                total: 1
                mafias:
                - id: M3X8P1
                  name: Солнцевские
                  leader_id: '123456789012345678'
                  leader_name: player
                  color: '#8B0000'
                  bank: 54000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  mafias:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        leader_id:
                          type: string
                        leader_name:
                          type: string
                        color:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Мафии: список, карточка, баланс, участники, переводы и логи.'
    post:
      tags:
      - Экономика
      summary: 'Экономика: действия с мафиями'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mafiaId:
                  type: string
                amount:
                  type: integer
            example:
              mafiaId: M3X8P1
              amount: 1000
      responses:
        '200':
          description: Статус операции.
          content:
            application/json:
              example:
                success: true
                mafiaId: M3X8P1
                added: 1000
                newBalance: 55000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mafiaId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Создание и удаление мафий, деньги, переводы и участники.
  /civops/government:
    get:
      tags:
      - Экономика
      summary: 'Экономика: бюджет'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Состояние госбюджета и департаментов.
          content:
            application/json:
              example:
                balance:
                  bank: 2500000
              schema:
                type: object
                properties:
                  balance:
                    type: object
                    properties:
                      bank:
                        type: integer
      description: Баланс бюджета и переводы правительства.
    post:
      tags:
      - Экономика
      summary: 'Экономика: действия с бюджетом'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
            example:
              amount: 10000
      responses:
        '200':
          description: Параметры обновлены.
          content:
            application/json:
              example:
                success: true
                added: 10000
                newBalance: 2510000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Пополнение и списание бюджета, переводы игроку, бизнесу или мафии.
  /civops/store:
    get:
      tags:
      - Экономика
      summary: 'Экономика: магазин'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Каталог товаров магазина.
          content:
            application/json:
              example:
                count: 1
                items:
                - name: Аптечка
                  description: Восстанавливает здоровье
                  price_buy: 250
                  price_sell: 100
                  quantity: null
                  can_use: true
                  can_sell: true
                  createdAt: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        price_buy:
                          type: integer
                        price_sell:
                          type: integer
                        quantity:
                          type:
                          - string
                          - 'null'
                        can_use:
                          type: boolean
                        can_sell:
                          type: boolean
                        createdAt:
                          type: integer
      description: Товары игрового магазина.
    post:
      tags:
      - Экономика
      summary: 'Экономика: действия с магазином'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                itemName:
                  type: string
                quantity:
                  type: integer
            example:
              userId: '123456789012345678'
              itemName: Аптечка
              quantity: 2
      responses:
        '200':
          description: Результат транзакции.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                quantity: 2
                totalPrice: 500
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  quantity:
                    type: integer
                  totalPrice:
                    type: integer
      description: Добавление и удаление товаров, покупка и продажа магазину.
  /civops/ads:
    get:
      tags:
      - Экономика
      summary: 'Экономика: объявления'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Активные рекламные кампании.
          content:
            application/json:
              example:
                count: 1
                ads:
                - id: 5
                  user_id: '123456789012345678'
                  username: player
                  business_name: Кафе «Арбат»
                  address: ул. Арбат, 10
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  ads:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: string
                        username:
                          type: string
                        business_name:
                          type: string
                        address:
                          type: string
                        created_at:
                          type: integer
      description: Заявки на игровую рекламу (`action=list`).
    post:
      tags:
      - Экономика
      summary: 'Экономика: подача объявления'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                username:
                  type: string
                businessName:
                  type: string
                address:
                  type: string
            example:
              userId: '123456789012345678'
              username: player
              businessName: Кафе «Арбат»
              address: ул. Арбат, 10
      responses:
        '200':
          description: Объявление размещено.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                businessName: Кафе «Арбат»
                address: ул. Арбат, 10
                adSent: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  businessName:
                    type: string
                  address:
                    type: string
                  adSent:
                    type: boolean
      description: Создаёт заявку на игровую рекламу (`action=create`).
  /civops/system:
    get:
      tags:
      - Экономика
      summary: 'Экономика: сводка'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Версия и конфигурация экономики.
          content:
            application/json:
              example:
                users: 5120
                businesses: 34
                mafias: 6
                governmentBalance: 2500000
                uptime: 86400.5
                memory:
                  rss: 152043520
                  heapTotal: 98304000
                  heapUsed: 71303168
                  external: 2097152
                timestamp: '2026-10-21T12:00:00.000Z'
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  businesses:
                    type: integer
                  mafias:
                    type: integer
                  governmentBalance:
                    type: integer
                  uptime:
                    type: number
                  memory:
                    type: object
                    properties:
                      rss:
                        type: integer
                      heapTotal:
                        type: integer
                      heapUsed:
                        type: integer
                      external:
                        type: integer
                  timestamp:
                    type: string
                    format: date-time
      description: Общая статистика экономики и время работы сервиса.
  /civops/health:
    get:
      tags:
      - Экономика
      summary: 'Экономика: состояние'
      security:
