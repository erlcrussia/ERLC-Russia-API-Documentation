      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  example: https://my-bot.domain.com/erlc-events
                isActive:
                  type: boolean
                  default: true
                  example: true
                serverIds:
                  type: array
                  items:
                    type: string
                  example:
                  - '12345678'
                description:
                  type: string
                  example: Live Kill Logs Hook
      responses:
        '201':
          description: Вебхук успішно зареєстровано.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Вебхук успешно добавлен
                  discord_id:
                    type: string
                    example: '403258784102940682'
        '403':
          description: Заборонено прив'язувати веб-хук до цього сервера.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Вам запрещено привязывать вебхук к серверу '999999'. Разрешенный сервер для вашего
                      ключа '12345678'
                  forbidden_server_id:
                    type: string
                    example: '999999'
                  allowed_server_id:
                    type: string
                    example: '12345678'
