      tags:
      - Рекламные кампании V3
      summary: Создание рекламной кампании
      description: Создаёт новую заявку на рекламную кампанию со списанием 10 eCoins за модерацию.
      security:
      - CookieAuth: []
      - BearerAuth: []
      requestBody:
        required: true
