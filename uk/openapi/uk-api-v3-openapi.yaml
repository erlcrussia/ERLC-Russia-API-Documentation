openapi: 3.1.0
info:
  title: ER:LC Росія API V3
  description: 'API ER:LC Russia: сервери, користувачі, CDN, редиректи, підписки та ключі доступу.'
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
  description: Основний сервер (com)
- url: https://api.erlcrussia.xyz/v3
  description: Резервний сервер (xyz)
tags:
- name: ER:LC Сервер
  description: Отримання статусу, онлайн, списків гравців та персоналу сервера ER:LC.
- name: ER:LC Команди
  description: Відправлення та постановка в чергу команд внутрішньоігрового сервера (:h, :m, :kick, :ban та ін.).
- name: Економіка
  description: Взаємодія з економічною системою (користувачі, бізнес, мафії, магазин, реклама).
- name: API Статистики
  description: Високопродуктивне отримання статистики дискорд-серверів та ігрових серверів (онлайн, учасники, роботи).
- name: API Верифікації
  description: Пошук та зіставлення Discord ID та Roblox ID акаунтів.
- name: CDN Ассети
  description: Завантаження, керування, статистика та очищення кешу файлів об'єктного сховища MinIO/Edge CDN.
- name: CDN Папки
  description: Ієрархічна структура та сортування папок медіатеки CDN.
- name: API Покарань
  description: Управління балансом та історією транзакцій балів гравців.
- name: API Передплат
  description: Каталог планів, замовлення FunPay, нарахування бенефітів та активація підписок.
- name: API Авторизації
  description: Вхід через Discord та Roblox OAuth2, керування сесіями користувача та зв'язування акаунтів.
- name: API Управління - WebSocket Ключі
  description: Керування ключами доступу до WebSocket шлюзу та підписками на канали.
- name: API Управління - Вебхукі
  description: Реєстрація, валідація доступності та моніторинг власних вебхуків.
- name: API Управління - Панель
  description: Управління користувачами, підписками, тарифами, ручний баланс та системна статистика.
- name: API Стану
  description: Моніторинг працездатності сервісу, підключень до PostgreSQL та Redis.
- name: AI Audio
- name: AI Studio
- name: API Адмінки - Сервера
- name: API Ключів
- name: API Управління - Сервери
- name: API Управління - Токени
- name: CDN
- name: CDN V3
- name: CDN Домени
- name: Адміністрація E-Coins
- name: Адміністрування AI
- name: Користувальницькі Вебхуки
- name: Особисті файли та бібліотека
- name: Редиректи організацій V3
- name: Рекламные кампании V3
paths:
  /erlc/server:
    get:
      tags:
      - ER:LC Сервер
      summary: Інформація
      description: Назва, онлайн і статус сервера. Query-параметрами можна додати гравців, персонал, чергу й логи.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Включить детальный список игроков на сервере.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Включить список сотрудников и модераторов (Admins, Mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Включить журнал входов и выходов.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Включить состояние очереди ожидания подключения.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Включить журнал убийств.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Включить журнал выполненных команд.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Включить активные вызовы модераторов.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Включить список заспавненных транспортных средств.
        schema:
          type: boolean
      responses:
        '200':
          description: Успішна відповідь із даними сервера.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Name:
                    type: string
                  OwnerId:
                    type: integer
                  CoOwnerIds:
                    type: array
                    items:
                      type: integer
                  CurrentPlayers:
                    type: integer
                  MaxPlayers:
                    type: integer
                  JoinKey:
                    type: string
                  AccVerifiedReq:
                    type: string
                  TeamBalance:
                    type: boolean
                  Players:
                    type: array
                    items:
                      type: object
                      properties:
                        Player:
                          type: string
                        Permission:
                          type: string
                        Callsign:
                          type: string
                        Team:
                          type: string
                  Queue:
                    type: array
                    items:
                      type: integer
              example:
                Name: Moscow RolePlay I RU
                OwnerId: 1234567
                CoOwnerIds:
                - 7654321
                CurrentPlayers: 32
                MaxPlayers: 40
                JoinKey: MRPRU
                AccVerifiedReq: Disabled
                TeamBalance: true
                Players:
                - Player: Builderman:156
                  Permission: Server Administrator
                  Callsign: 1-A-12
                  Team: Police
                Queue:
                - 261
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:LC Сервер
      summary: Бани сервера
      description: Заблоковані гравці сервера ER:LC.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Список забанених користувачів.
          content:
            application/json:
              schema:
                type: object
                properties:
                  '156':
                    type: string
                  '261':
                    type: string
              example:
                '156': Builderman
                '261': Shedletsky
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - ER:LC Команди
      summary: Команда на сервері
      description: Виконує команду на сервері ER:LC, наприклад `:h Повідомлення`. За тимчасової помилки ER:LC команда стає в чергу повтору.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: Текст команды с двоеточием (например, ":m Сервер перезагружается").
            example:
              command: :h Сервер перезапустится через 5 минут
      responses:
        '200':
          description: Команда успішно передана на сервер або поставлена в чергу.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                  QueueSize:
                    type: integer
              example:
                Status: Queued
                QueueSize: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - Економіка
      summary: 'Економіка: гроші гравців'
      description: Баланс гравця, топ за грошима, місце в топі й кулдауни команд.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Дані економіки.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                cash: 15000
                bank: 82000
                rank: 14
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  cash:
                    type: integer
                  bank:
                    type: integer
                  rank:
                    type: integer
    post:
      tags:
      - Економіка
      summary: 'Економіка: операції з грошима'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fromUserId:
                  type: string
                toUserId:
                  type: string
                amount:
                  type: integer
            example:
              fromUserId: '123456789012345678'
              toUserId: '234567890123456789'
              amount: 500
      responses:
        '200':
          description: Успішне оновлення.
          content:
            application/json:
              example:
                success: true
                fromUserId: '123456789012345678'
                toUserId: '234567890123456789'
                amount: 500
                newBalance:
                  cash: 14500
                  bank: 82000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  fromUserId:
                    type: string
                  toUserId:
                    type: string
                  amount:
                    type: integer
                  newBalance:
                    type: object
                    properties:
                      cash:
                        type: integer
                      bank:
                        type: integer
      description: Перекази, банк, нарахування, списання, скидання балансу й кулдаунів.
  /civops/users:
    get:
      tags:
      - Економіка
      summary: 'Економіка: гравець'
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Дані профілю гравця.
          content:
            application/json:
              example:
                userId: '123456789012345678'
                inventory:
                - name: Аптечка
                  amount: 2
                  description: Восстанавливает здоровье
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  inventory:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: integer
                        description:
                          type: string
      description: Інвентар гравця й історія його операцій.
    post:
      tags:
      - Економіка
      summary: 'Економіка: інвентар гравця'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                item:
                  type: object
                  properties:
                    name:
                      type: string
                    amount:
                      type: integer
            example:
              userId: '123456789012345678'
              item:
                name: Аптечка
                amount: 1
      responses:
        '200':
          description: Профіль оновлено.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                amount: 1
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  amount:
                    type: integer
      description: Додавання й видалення предметів, очищення інвентаря.
  /civops/businesses:
    get:
      tags:
      - Економіка
      summary: 'Економіка: бізнеси'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Перелік зареєстрованих підприємств.
          content:
            application/json:
              example:
                page: 1
                total: 1
                businesses:
                - id: B7K2Q9XZ
                  name: Кафе «Арбат»
                  form: ООО
                  status: active
                  owner_id: '123456789012345678'
                  owner_name: player
                  address: ул. Арбат, 10
                  bank: 120000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  businesses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        form:
                          type: string
                        status:
                          type: string
                        owner_id:
                          type: string
                        owner_name:
                          type: string
                        address:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Бізнеси: список, картка, баланс, працівники, товари, перекази, рейтинг і заявки.'
    post:
      tags:
      - Економіка
      summary: 'Економіка: дії з бізнесами'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                amount:
                  type: integer
            example:
              businessId: B7K2Q9XZ
              amount: 5000
      responses:
        '200':
          description: Операцію виконано.
          content:
            application/json:
              example:
                success: true
                businessId: B7K2Q9XZ
                added: 5000
                newBalance: 125000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  businessId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Заявки, створення й видалення бізнесів, гроші, працівники й товари.
  /civops/mafias:
    get:
      tags:
      - Економіка
      summary: 'Економіка: мафії'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Список мафій та угруповань.
          content:
            application/json:
              example:
                page: 1
                total: 1
                mafias:
                - id: M3X8P1
                  name: Солнцевские
                  leader_id: '123456789012345678'
                  leader_name: player
                  color: '#8B0000'
                  bank: 54000
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  total:
                    type: integer
                  mafias:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        leader_id:
                          type: string
                        leader_name:
                          type: string
                        color:
                          type: string
                        bank:
                          type: integer
                        created_at:
                          type: integer
      description: 'Мафії: список, картка, баланс, учасники, перекази й логи.'
    post:
      tags:
      - Економіка
      summary: 'Економіка: дії з мафіями'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mafiaId:
                  type: string
                amount:
                  type: integer
            example:
              mafiaId: M3X8P1
              amount: 1000
      responses:
        '200':
          description: Статус операції.
          content:
            application/json:
              example:
                success: true
                mafiaId: M3X8P1
                added: 1000
                newBalance: 55000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mafiaId:
                    type: string
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Створення й видалення мафій, гроші, перекази й учасники.
  /civops/government:
    get:
      tags:
      - Економіка
      summary: 'Економіка: бюджет'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Стан держбюджету та департаментів.
          content:
            application/json:
              example:
                balance:
                  bank: 2500000
              schema:
                type: object
                properties:
                  balance:
                    type: object
                    properties:
                      bank:
                        type: integer
      description: Баланс бюджету й перекази уряду.
    post:
      tags:
      - Економіка
      summary: 'Економіка: дії з бюджетом'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
            example:
              amount: 10000
      responses:
        '200':
          description: Параметри оновлено.
          content:
            application/json:
              example:
                success: true
                added: 10000
                newBalance: 2510000
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  added:
                    type: integer
                  newBalance:
                    type: integer
      description: Поповнення й списання бюджету, перекази гравцю, бізнесу чи мафії.
  /civops/store:
    get:
      tags:
      - Економіка
      summary: 'Економіка: магазин'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Каталог товарів магазину.
          content:
            application/json:
              example:
                count: 1
                items:
                - name: Аптечка
                  description: Восстанавливает здоровье
                  price_buy: 250
                  price_sell: 100
                  quantity: null
                  can_use: true
                  can_sell: true
                  createdAt: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        price_buy:
                          type: integer
                        price_sell:
                          type: integer
                        quantity:
                          type:
                          - string
                          - 'null'
                        can_use:
                          type: boolean
                        can_sell:
                          type: boolean
                        createdAt:
                          type: integer
      description: Товари ігрового магазину.
    post:
      tags:
      - Економіка
      summary: 'Економіка: дії з магазином'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                itemName:
                  type: string
                quantity:
                  type: integer
            example:
              userId: '123456789012345678'
              itemName: Аптечка
              quantity: 2
      responses:
        '200':
          description: Результат транзакції.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                item: Аптечка
                quantity: 2
                totalPrice: 500
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  item:
                    type: string
                  quantity:
                    type: integer
                  totalPrice:
                    type: integer
      description: Додавання й видалення товарів, купівля та продаж магазину.
  /civops/ads:
    get:
      tags:
      - Економіка
      summary: 'Економіка: оголошення'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Активні рекламні кампанії.
          content:
            application/json:
              example:
                count: 1
                ads:
                - id: 5
                  user_id: '123456789012345678'
                  username: player
                  business_name: Кафе «Арбат»
                  address: ул. Арбат, 10
                  created_at: 1792083600
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  ads:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: string
                        username:
                          type: string
                        business_name:
                          type: string
                        address:
                          type: string
                        created_at:
                          type: integer
      description: Заявки на ігрову рекламу (`action=list`).
    post:
      tags:
      - Економіка
      summary: 'Економіка: подання оголошення'
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                username:
                  type: string
                businessName:
                  type: string
                address:
                  type: string
            example:
              userId: '123456789012345678'
              username: player
              businessName: Кафе «Арбат»
              address: ул. Арбат, 10
      responses:
        '200':
          description: Оголошення розміщено.
          content:
            application/json:
              example:
                success: true
                userId: '123456789012345678'
                businessName: Кафе «Арбат»
                address: ул. Арбат, 10
                adSent: true
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userId:
                    type: string
                  businessName:
                    type: string
                  address:
                    type: string
                  adSent:
                    type: boolean
      description: Створює заявку на ігрову рекламу (`action=create`).
  /civops/system:
    get:
      tags:
      - Економіка
      summary: 'Економіка: зведення'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Версія та конфігурація економіки.
          content:
            application/json:
              example:
                users: 5120
                businesses: 34
                mafias: 6
                governmentBalance: 2500000
                uptime: 86400.5
                memory:
                  rss: 152043520
                  heapTotal: 98304000
                  heapUsed: 71303168
                  external: 2097152
                timestamp: '2026-10-21T12:00:00.000Z'
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  businesses:
                    type: integer
                  mafias:
                    type: integer
                  governmentBalance:
                    type: integer
                  uptime:
                    type: number
                  memory:
                    type: object
                    properties:
                      rss:
                        type: integer
                      heapTotal:
