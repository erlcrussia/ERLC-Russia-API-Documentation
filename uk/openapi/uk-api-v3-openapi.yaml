        методи з майстер-ключем.'
  /ai/keys:
    get:
      tags:
      - AI Studio
      summary: Мої AI-ключі
      description: 'Ваші AI-ключі: agent, chat і voice.


        Повний секрет повертається лише під час створення або ротації. Списки AI-ключів, перейменування та видалення повертають маску. GET /keys розкриває лише ключ виклику; інші ключі,
        навіть власні, замасковані. teamId — ID прив’язаної команди або null.'
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: Список ключів.
          content:
            application/json:
              example:
              - id: '21'
                token: sk-chat-3...0a1c
                name: Discord-бот
                scope: chat
                created_at: '2026-10-21T12:00:00Z'
                is_active: true
                tools_enabled: false
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    token:
                      type: string
                    name:
                      type: string
                    scope:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    is_active:
                      type: boolean
                    tools_enabled:
                      type: boolean
    post:
      tags:
      - AI Studio
      summary: Новий AI-ключ
      security:
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Studio Key
                scope:
                  type: string
                  enum:
                  - agent
                  - chat
                  - voice
            example:
              name: Discord-бот
              scope: chat
      responses:
        '403':
          description: Owner session required; an ordinary HTTP key cannot authorize this operation.
        '200':
          description: Ключ створено (id, token, name, scope, created_at, is_active, tools_enabled).
          content:
            application/json:
              example:
                id: '21'
                token: sk-chat-3f9c2a1e5b7d4e9fa1c32b4d6e8f0a1c3f9c2a1e5b7d4e9fa1c32b4d6e8f0a1c
                name: Discord-бот
                scope: chat
                created_at: '2026-10-21T12:00:00Z'
                is_active: true
                tools_enabled: false
              schema:
                type: object
                properties:
                  id:
                    type: string
                  token:
                    type: string
                  name:
                    type: string
                  scope:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  is_active:
                    type: boolean
                  tools_enabled:
                    type: boolean
      description: 'Створює AI-ключ для OpenAI-сумісного API: agent, chat або voice.


        Створення AI-ключа та обмін монет потребують сесії власника. Звичайний HTTP-ключ, навіть з повним доступом, не дозволяє ці операції. Довірені сервіси використовують адміністративні
        методи з майстер-ключем.'
  /ai/keys/{id}:
