  /ai/credits/balance:
    get:
      tags:
      - AI Studio
      summary: Баланс AI-кредитів
      description: Повертає баланс AI-кредитів, коінів, курс обміну (1 Coin = 1 AI Credit) та тарифну сітку pricing
        (niya-1, emmy-1, hubert-1) для власника переданого API-ключа.
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: Баланс кредитів та коїнів.
        '401':
          description: Чи не авторизований.
  /ai/credits/exchange:
    post:
      tags:
      - AI Studio
      summary: Обмін коїнів на AI-кредити
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - coins
              properties:
                coins:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Коїни обмінені (success, exchanged_coins, credits_added, new_credits, remaining_coins).
  /ai/keys:
    get:
      tags:
      - AI Studio
      summary: Список AI-ключів
      description: Повертає ключі типу sk-agent-*/sk-chat-*/sk-voice-* поточного користувача (id, token, name, scope,
        created_at, is_active, tools_enabled).
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: Список ключів.
    post:
      tags:
      - AI Studio
      summary: Створення AI-ключа
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: Studio Key
                scope:
                  type: string
                  enum:
                  - agent
                  - chat
                  - voice
      responses:
        '200':
          description: Ключ створено (id, token, name, scope, created_at, is_active, tools_enabled).
    delete:
      tags:
      - AI Studio
      summary: Видалення AI-ключа (через Header/Body/Query)
      description: Видаляє AI-ключ поточного користувача. Ключ для видалення можна передати в заголовку `target-api-key`
        (або `token`), у тілі JSON `{"token":"..."}`, через query-параметр `?token=...` або без параметрів (щоб
        відкликати сам ключ запиту).
      parameters:
      - name: target-api-key
        in: header
        required: false
        description: Токен ключа, що видаляється
        schema:
          type: string
      - name: token
        in: query
        required: false
        description: Токен ключа, що видаляється
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: integer
      responses:
        '200':
          description: 'Ключ видалений ({success: true, deleted: true, token: "..."}).'
  /ai/keys/{id}:
    delete:
      tags:
      - AI Studio
      summary: Видалення AI-ключа за ID/Токеном в URL
      description: Видаляє AI-ключ поточного користувача за токеном або числовим ID в дорозі URL.
      parameters:
      - name: id
        in: path
        required: true
        description: Струм ключа (sk-chat-...) або числовий ID.
        schema:
          type: string
      security:
      - AIManagementKeyHeader: []
      - CookieAuth: []
      responses:
        '200':
          description: 'Ключ видалений ({success: true, deleted: true, token: "..."}).'
  /ai/audio/pricing:
    get:
      tags:
      - AI Audio
      summary: Тарифы и ограничения голосового API
      description: Возвращает модель, стоимость, максимальную длительность и формат аудио для распознавания речи.
      responses:
        '200':
          description: Параметры голосового API.
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: {type: string}
                  credits_per_minute: {type: number}
                  speech_credits_per_1000_characters: {type: number}
                  speech_max_characters: {type: integer}
                  speech_voice: {type: string}
                  billing_unit: {type: string}
                  max_duration_seconds: {type: integer}
                  format: {type: string}
  /ai/audio/transcriptions:
    post:
      tags:
      - AI Audio
      summary: Распознавание речи
      description: Принимает WAV в mono PCM 16-bit 16000 Hz длительностью до 120 секунд. Нужен AI-ключ с правом voice.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      parameters:
      - name: lang
        in: query
        required: false
        schema:
          type: string
          default: ru
      responses:
        '200':
          description: Распознанный текст и сведения о списании кредитов.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: {type: string}
                  model: {type: string}
                  duration_seconds: {type: number}
                  credits_charged: {type: number}
        '400':
          description: Некорректный или повреждённый WAV-файл.
        '401':
          description: AI-ключ отсутствует или недействителен.
        '413':
          description: Аудио длиннее 120 секунд.
        '415':
          description: Требуется Content-Type audio/wav.
        '503':
          description: Сервис распознавания недоступен.
  /ai/title:
    post:
      tags:
      - AI Studio
      summary: Генерація заголовка чату
      description: Генерує короткий заголовок чату (2-4 слова). Для користувальницьких API-ключів списує AI-кредити
        згідно з токенами. З Master Key працює безлімітно. Виконавчий AI-ключ не надає права керування кредитами,
        іншими ключами, CDN або редиректами.
      security:
      - AIExecutionKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                locale:
                  type: string
                  default: ru
                model:
                  type: string
      responses:
        '200':
          description: Заголовок згенерований ({title, success, cost_credits, usage}).
  /ads/upload:
    post:
      tags:
      - Рекламные кампании V3
      summary: Загрузка баннера рекламы
      description: Загружает изображение баннера на images.erlcrussia.com (максимум 5 МБ, форматы PNG, JPEG, WebP, GIF, AVIF).
      security:
      - CookieAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Баннер успешно загружен.
          content:
            application/json:
              schema:
                type: object
                required: [bannerUrl, size, mimeType, domain, path]
                properties:
                  bannerUrl: {type: string, example: "https://images.erlcrussia.com/ads/banners/0123456789abcdef.png"}
                  size: {type: integer, example: 245000}
                  mimeType: {type: string, example: "image/png"}
                  domain: {type: string, example: "images.erlcrussia.com"}
                  path: {type: string, example: "ads/banners/0123456789abcdef.png"}
        '400':
          description: Недопустимый формат файла или повреждённые данные.
        '401':
          description: Требуется авторизация пользователя.
        '413':
          description: Размер файла превышает 5 МБ.

  /ads/campaigns:
    get:
      tags:
