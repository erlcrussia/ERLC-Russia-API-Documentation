components:
  securitySchemes:
    AIManagementKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Звичайний користувальницький API ключ для управління кредитами та AI ключами; виконавчі sk-chat/sk-agent/sk-voice
        не дозволені.
    AIExecutionKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-ai-key
      description: Виконавчий sk-chat/sk-agent/sk-voice ключ відповідно до методу.
    BearerAuth:
      type: http
      scheme: bearer
      description: API-ключ у заголовку Authorization у форматі `Bearer <token>`.
    ApiKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-api-key
      description: Користувальницький API-ключ. Зберігайте на сервері; не включайте у клієнтський JavaScript.
    WebSocketKeyHeader:
      type: apiKey
      in: header
      name: erlcrussia-websocket-key
      description: Єдиний заголовок WebSocket-ключ erlcrussia-websocket-key.
    CookieAuth:
      type: apiKey
      in: cookie
      name: erlc_auth
      description: Сесійна HTTP-Only кука авторизації на порталі.
    CDNDeployToken:
      type: apiKey
      in: header
      name: erlcrussia-api-cdn-token
      description: Окремий deploy-токен підтвердженого CDN-домену.
  schemas:
    UserAsset:
      type: object
      required:
      - id
      - domain
      - path
      - name
      - mimeType
      - kind
      - status
      - url
      - size
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
        domain:
          type: string
        path:
          type: string
        name:
          type: string
        mimeType:
          type: string
        kind:
          type: string
        status:
          type: string
        url:
          type: string
        size:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    CoinOperation:
      type: object
      required:
      - id
      - resourceKey
      - discordId
      - amount
      - state
      properties:
        id:
          type: string
        resourceKey:
          type: string
        discordId:
          type: string
        amount:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - pending
          - deducted
          - refunded
        remainingCoins:
          type:
          - integer
          - 'null'
        refundBalance:
          type:
          - integer
          - 'null'
        reason:
          type:
          - string
          - 'null'
        replayed:
          type: boolean
    CDNAssetListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CDNAsset'
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 6
    UsersLookupResponse:
      oneOf:
      - type: object
        properties:
          discordId: *id001
        required:
        - discordId
        additionalProperties: false
      - type: object
        properties:
          robloxId: *id001
        required:
        - robloxId
        additionalProperties: false
      - type: object
        properties:
          discordId:
            type:
            - string
            - 'null'
          robloxId:
            type:
            - string
            - 'null'
        required:
        - discordId
        - robloxId
        additionalProperties: false
      - type: array
        items: *id005
    ERLCCommandResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Команда успешно выполнена
    ERLCBanItem:
      type: object
      properties:
        Player:
          type: string
          example: PlayerName:12345678
        Reason:
          type: string
          example: Нарушение правил сервера
    ERLCServerResponse:
      type: object
      properties:
