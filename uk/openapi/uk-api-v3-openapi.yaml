      description: 'Завантажте multipart/form-data з полем файлу. Не задавайте Content-Type вручну: клієнт має додати
        boundary. domain та path можна передати в multipart; явний multipart domain має пріоритет над query. Для
        чанків використовуйте compress=false та MIME text/javascript або text/css. Шлях _next/static та імена _app.js
        підтримуються. Відповідь HTTP 200, не 201. Повтор явно зайнятого шляху повертає 409 без перезапису. Максимум
        файлу 250 МВ. compress за замовчуванням true: JPEG/PNG до 24 мегапікселів; відео потребують FFmpeg/FFprobe.
        Результат оптимізації зберігається тільки якщо менше оригіналу.'
