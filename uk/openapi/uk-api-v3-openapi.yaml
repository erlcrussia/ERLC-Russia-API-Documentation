  responses:
    BadRequestError:
      description: Bad Request (400) – неправильні параметри запиту.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_params:
              summary: Missing Parameters (5002)
              value:
                code: 5002
                message: Missing Parameters
            invalid_json:
              summary: Invalid JSON (5034)
              value:
                code: 5034
                message: Invalid Json
            invalid_param:
              summary: Invalid Param Name (5004)
              value:
                code: 5004
                message: Invalid Param Name
    UnauthorizedError:
      description: Unauthorized (401) - відсутній або недійсний API токен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_token:
              summary: Missing Token (5007)
              value:
                code: 5007
                message: Missing Token
            invalid_token:
              summary: Invalid Token (5008)
              value:
                code: 5008
                message: Invalid Token
    ForbiddenError:
      description: Forbidden (403) – доступ заборонено (обмеження ключа, дії або серверів).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: Forbidden (5009)
              value:
                code: 5009
                message: Forbidden
    NotFoundError:
      description: Not Found (404) - запитуваний ресурс не знайдено.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              summary: Resource Not Found (5020)
              value:
                code: 5020
                message: Not Found
            token_not_found:
              summary: Token Not Found (5013)
              value:
                code: 5013
                message: Token Not Found
    RateLimitError:
      description: Too Many Requests (429) – перевищений ліміт запитів.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limit:
              summary: Rate Limit Exceeded (5016)
              value:
                code: 5016
                message: Rate Limit Exceeded
    InternalServerError:
      description: Internal Server Error (500) – внутрішня помилка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              summary: Internal Error (5017)
              value:
                code: 5017
                message: Internal Error
  parameters:
    XCacheRefresh:
      name: x-cache-refresh
      in: header
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      description: Примусове скидання Redis-кешу економіки за значенням "true".
