      summary: Синхронізація профілю з Discord
      description: Примусово запитує актуальний аватар, декорацію аватара та нікнейм користувача з Discord API та
        оновлює запис у базі даних.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
