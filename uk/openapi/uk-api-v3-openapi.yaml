      description: Відв'язує прив'язаний Roblox-аккаунт від поточної сесії для повторної верифікації.
      security:
      - CookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Прив'язка скинута.
  /auth/user/profile:
    patch:
      tags:
