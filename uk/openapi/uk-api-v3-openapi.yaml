  /webhooks:
    get:
      tags:
      - Користувальницькі Вебхуки
      summary: Мої вебхуки
      description: Ваші URL вебхуків і їхній статус.
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Список веб-хуків користувача.
          content:
            application/json:
              schema:
                type: object
                properties:
                  discord_id:
                    type: string
                  server_id:
                    type: string
                  is_active:
                    type: boolean
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
                  count:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
              example:
                discord_id: '123456789012345678'
                server_id: '12345678'
                is_active: true
                urls:
                - url: https://my-bot.example.com/erlc-events
                  isActive: true
                  serverIds:
                  - '12345678'
                count: 1
                created_at: '2026-10-01T12:00:00Z'
                updated_at: '2026-10-21T12:00:00Z'
    delete:
      tags:
      - Користувальницькі Вебхуки
      summary: Видалення всіх URL
      description: Видаляє всі ваші URL вебхуків.
      security:
      - ApiKeyHeader: []
      responses:
        '200':
          description: Вебхуки видалені.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              example:
                success: true
                message: All user webhooks deleted successfully
    post:
      tags:
      - Користувальницькі Вебхуки
      summary: Приймання подій гри
      description: Сюди ER:LC надсилає події сервера з підписом Ed25519. API перевіряє підпис і розсилає подію на ваші URL.
      security:
      - SignatureTimestamp: []
        SignatureEd25519: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server:
                  type: string
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      event:
                        type: string
                      timestamp:
                        type: integer
                      origin:
                        type: string
                      data:
                        type: object
                        properties:
                          command:
                            type: string
                          player:
                            type: string
            example:
              server: '12345678'
              events:
              - event: CustomCommand
                timestamp: 1792083600
                origin: '12345678'
                data:
                  command: ;help
                  player: Builderman
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                status: received
                event_type: CustomCommand
                server_id: '12345678'
              schema:
                type: object
                properties:
                  status:
                    type: string
                  event_type:
                    type: string
                  server_id:
                    type: string
  /webhooks/add-url:
    post:
      tags:
      - Користувальницькі Вебхуки
      summary: Додавання URL
      description: Додає URL для подій гри. URL приймається, лише якщо він перевіряє підпис, і одразу ввімкнений. Ключ, прив'язаний до сервера, може підписати URL лише на свій сервер.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                serverIds:
                  type: array
                  items:
                    type: string
            example:
              url: https://my-bot.example.com/erlc-events
              serverIds:
              - '12345678'
      responses:
        '201':
          description: Вебхук успішно зареєстровано.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
                  is_active:
                    type: boolean
                  discord_id:
                    type: string
              example:
                success: true
                message: Webhook URL added successfully
                urls:
                - url: https://my-bot.example.com/erlc-events
                  isActive: true
                  serverIds:
                  - '12345678'
                is_active: true
                discord_id: '123456789012345678'
        '403':
          description: Заборонено прив'язувати веб-хук до цього сервера.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Вам запрещено привязывать вебхук к серверу '999999'. Разрешенный сервер для вашего ключа '12345678'
                  forbidden_server_id:
                    type: string
                    example: '999999'
                  allowed_server_id:
                    type: string
                    example: '12345678'
        '400':
          description: 'URL не пройшов перевірку: на запит із правильним підписом треба відповісти 2xx, з підробленим — 4xx. Причина — у `reason`, відповідь URL — у `status`.'
          content:
            application/json:
              example:
                code: 5051
                message: Webhook Verification Failed
                reason: forged_accepted
                status: 200
  /webhooks/url:
    put:
      tags:
      - Користувальницькі Вебхуки
      summary: Зміна URL
      description: Змінює адресу URL і сервери. Нова адреса перевіряється підписом, увімкнений URL чи ні — не змінюється.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldUrl:
                  type: string
                url:
                  type: string
                serverIds:
                  type: array
                  items:
                    type: string
            example:
              oldUrl: https://my-bot.example.com/erlc-events
              url: https://my-bot.example.com/erlc-events-v2
              serverIds:
              - '12345678'
      responses:
        '200':
          description: Вебхук успішно оновлено.
          content:
            application/json:
              example:
                success: true
                message: Webhook updated successfully
                urls:
                - url: https://my-bot.example.com/erlc-events-v2
                  isActive: true
                  serverIds:
                  - '12345678'
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        isActive:
                          type: boolean
                        serverIds:
                          type: array
                          items:
                            type: string
        '400':
          description: 'URL не пройшов перевірку: на запит із правильним підписом треба відповісти 2xx, з підробленим — 4xx. Причина — у `reason`, відповідь URL — у `status`.'
          content:
            application/json:
              example:
                code: 5051
                message: Webhook Verification Failed
                reason: forged_accepted
                status: 200
    delete:
      tags:
      - Користувальницькі Вебхуки
      summary: Видалення URL
      description: Видаляє один URL із ваших вебхуків.
      security:
      - ApiKeyHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
            example:
              url: https://my-bot.example.com/erlc-events
      parameters:
      - name: url
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Вебхук видалено.
          content:
            application/json:
              example:
                success: true
                message: Webhook URL removed successfully
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
