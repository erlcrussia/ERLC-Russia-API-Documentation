          type: string
          example: Moscow RolePlay | City & Province
        OwnerId:
          type: integer
          example: 1133665013
        CoOwnerIds:
          type: array
          items:
            type: integer
        CurrentPlayers:
          type: integer
          example: 42
        MaxPlayers:
          type: integer
          example: 50
        JoinKey:
          type: string
          example: MRP
        AccVerifiedReq:
          type: string
          example: Disabled
        TeamBalance:
          type: boolean
          example: true
    AdminFormattedToken:
      type: object
      properties:
        id:
          type: string
          example: '12'
        name:
          type: string
          example: 'API Key #12 (12345678)'
        key:
          type: string
          example: erlc_sec_xxxxxxxxxxxx
        apiKey:
          type: string
          example: erlc_sec_xxxxxxxxxxxx
        maskedKey:
