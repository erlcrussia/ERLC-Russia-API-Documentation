        Ротація одного ключа дозволена раз на п’ять хвилин; при 429 враховуйте Retry-After. Успішна ротація записується в аудит з ID ключа та IP без секрету.'
      parameters:
      - name: api
        in: query
        description: Перегенерировать HTTP API ключ
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Перегенерировать WebSocket ключ
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
