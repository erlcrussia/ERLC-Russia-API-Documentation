openapi: 3.1.0
info:
  title: ER:LC Росія API V3
  description: "API ER:LC Russia: сервери, користувачі, CDN, редиректи, підписки та ключі доступу."
  version: 3.0.0
servers:
- url: https://api.erlcrussia.com/v3
- url: https://api.erlcrussia.xyz/v3
tags:
- name: ER:LC Сервер
  description: Отримання статусу, онлайн, списків гравців та персоналу сервера ER:LC.
- name: ER:LC Команди
  description: Відправлення та постановка в чергу команд внутрішньоігрового сервера (:h, :m, :kick, :ban та ін.).
- name: Економіка
  description: Взаємодія з економічною системою (користувачі, бізнес, мафії, магазин, реклама).
- name: API Статистики
  description: Високопродуктивне отримання статистики дискорд-серверів та ігрових серверів (онлайн, учасники, роботи).
- name: API Верифікації
  description: Пошук та зіставлення Discord ID та Roblox ID акаунтів.
- name: CDN Ассети
  description: Завантаження, керування, статистика та очищення кешу файлів об'єктного сховища MinIO/Edge CDN.
- name: CDN Папки
  description: Ієрархічна структура та сортування папок медіатеки CDN.
- name: API Покарань
  description: Управління балансом та історією транзакцій балів гравців.
- name: API Передплат
  description: Каталог планів, замовлення FunPay, нарахування бенефітів та активація підписок.
- name: API Авторизації
  description: Вхід через Discord та Roblox OAuth2, керування сесіями користувача та зв'язування акаунтів.
- name: API Стану
  description: Моніторинг працездатності сервісу, підключень до PostgreSQL та Redis.
paths:
  /erlc/server:
    get:
      tags:
      - ER:LC Сервер
      summary: Інформація про Сервер ER:LC
      description: 'Повертає загальні дані про сервер ER:LC (назва, поточний онлайн, максимальний ліміт, статус).

        За допомогою query-параметрів можна опціонально запросити списки гравців, персоналу, чергу, логи входів/виходів,
        кіл і команд.'
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      parameters:
      - name: Players
        in: query
        description: Увімкніть детальний список гравців на сервері.
        schema:
          type: boolean
      - name: Staff
        in: query
        description: Включити список співробітників та модераторів (Admins, Mods).
        schema:
          type: boolean
      - name: JoinLogs
        in: query
        description: Включити журнал входів та виходів.
        schema:
          type: boolean
      - name: Queue
        in: query
        description: Увімкніть стан черги очікування підключення.
        schema:
          type: boolean
      - name: KillLogs
        in: query
        description: Увімкнути журнал вбивств.
        schema:
          type: boolean
      - name: CommandLogs
        in: query
        description: Увімкнути журнал виконаних команд.
        schema:
          type: boolean
      - name: ModCalls
        in: query
        description: Увімкнути активні дзвінки модераторів.
        schema:
          type: boolean
      - name: Vehicles
        in: query
        description: Включити список запавенних транспортних засобів.
        schema:
          type: boolean
      responses:
        '200':
          description: Успішна відповідь із даними сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCServerResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /erlc/server/bans:
    get:
      tags:
      - ER:LC Сервер
      summary: Список Банів Сервера
      description: Повертає поточний список заблокованих користувачів на сервері ER:LC.
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Список забанених користувачів.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ERLCBanItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /erlc/server/command:
    post:
      tags:
      - ER:LC Команди
      summary: Виконання Команди на Сервері
      description: 'Відправляє команду на сервер ER:LC (наприклад, `:h Сообщение`, `:m Внимание`, `:kick Nick`,
        `:ban Nick`).

        При тимчасових мережних помилках PRC (коди 1001, 1002, 9999) команда автоматично розміщується у чергу повтору
        (retry queue).'
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - command
              properties:
                command:
                  type: string
                  description: Текст команди з двокрапкою (наприклад, ":m Сервер перезавантажується").
                  example: :m Внимание, плановый рестарт через 5 минут
      responses:
        '200':
          description: Команда успішно передана на сервер або поставлена в чергу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ERLCCommandResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /civops/economy:
    get:
      tags:
      - Економіка
      summary: Отримання даних Економіки
      description: Економіка (загальний оборот, податки, скарбниця).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Дані економіки.
    post:
      tags:
      - Економіка
      summary: Зміна параметрів економіки
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Успішне оновлення.
  /civops/users:
    get:
      tags:
      - Економіка
      summary: Профіль Користувача в Економіці
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: discord_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Дані профілю гравця.
    post:
      tags:
      - Економіка
      summary: Модифікація профілю Користувача
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Профіль оновлено.
  /civops/businesses:
    get:
      tags:
      - Економіка
      summary: Список бізнесів
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Перелік зареєстрованих підприємств.
    post:
      tags:
      - Економіка
      summary: Створення / Редагування Бізнесу
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Операцію виконано.
  /civops/mafias:
    get:
      tags:
      - Економіка
      summary: Дані Кримінальних Організацій
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Список мафій та угруповань.
    post:
      tags:
      - Економіка
      summary: Управління Угрупованнями
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Статус операції.
  /civops/government:
    get:
      tags:
      - Економіка
      summary: Дані Держструктур та Скарбниці
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Стан держбюджету та департаментів.
    post:
      tags:
      - Економіка
      summary: Зміна параметрів Держструктур
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Параметри оновлено.
  /civops/store:
    get:
      tags:
      - Економіка
      summary: Магазин Товарів Економіка
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Каталог товарів магазину.
    post:
      tags:
      - Економіка
      summary: Купівля / Управління Товарами
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Результат транзакції.
  /civops/ads:
    get:
      tags:
      - Економіка
      summary: Список Рекламних Оголошень
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Активні рекламні кампанії.
    post:
      tags:
      - Економіка
      summary: Подання Рекламного Оголошення
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Оголошення розміщено.
  /civops/system:
    get:
      tags:
      - Економіка
      summary: Системна інформація Економіка
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Версія та конфігурація економіки.
  /civops/health:
    get:
      tags:
      - Економіка
      summary: Перевірка Доступності Економіка API
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Сервіс економіки є активним.
  /stats:
    get:
      tags:
      - API Статистики
      summary: Універсальна Статистика Серверів
      description: 'Високопродуктивний ендпоінт для моніторингу Discord-гільдій та ігрових серверів ER:LC.

        Підтримує множинні параметри `servers` і `metrics` (включаючи повторювані query параметри):

        - `membercount` - учасники онлайн;

        - `allmembercount` - загальна кількість учасників сервера;

        - `botcount` - кількість ботів;

        - `playercount` — поточний онлайн гравців у ER:LC.'
      parameters:
      - name: servers
        in: query
        required: true
        description: 'Імена серверів. Виберіть один або кілька серверів зі списку:

          - `MRP` - Moscow RolePlay (підтримує всі 4 метрики)

          - `MVD`, `FSB`, `MCHS`, `MZ`, `112` - підтримують `membercount`, `allmembercount`, `botcount`

          - `DOT` - підтримує тільки `membercount`'
        schema:
          type: array
          items:
            type: string
            enum:
            - MRP
            - MVD
            - FSB
            - MCHS
            - MZ
            - '112'
            - DOT
        example:
        - MRP
      - name: metrics
        in: query
        required: true
        description: 'Типи метрик, що запитуються:

          - `playercount` — гравці онлайн у грі ER:LC (**доступний ТІЛЬКИ для `MRP`**)

          - `membercount` - кількість учасників Discord онлайн (доступний для всіх)

          - `allmembercount` - загальна кількість учасників Discord сервера (усі крім `DOT`)

          - `botcount` - кількість ботів на сервері (усі крім `DOT`)'
        schema:
          type: array
          items:
            type: string
            enum:
            - membercount
            - allmembercount
            - botcount
            - playercount
        example:
        - playercount
      responses:
        '200':
          description: Об'єкт зі статистикою по кожному серверу та запрошеним метрикам.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: integer
                example:
                  MRP:
                    membercount: 1450
                    playercount: 38
                  MVD:
                    membercount: 320
                    playercount: 12
        '400':
          $ref: '#/components/responses/BadRequestError'
  /users:
    get:
      tags:
      - API Верифікації
      summary: Пошук Зв'язок Discord ID <-> Roblox ID
      description: 'Швидкий пошук прив''язаного облікового запису по одиночних або пакетних ідентифікаторах. Ідентифікатори
        передавайте рядками: числові Discord snowflake втрачають точність у JavaScript. GET з одним singular-параметром
        повертає об''єкт; plural-параметри та POST завжди повертають масив. Відсутні зв''язки у batch пропускаються,
        порядок не гарантований. Порожній batch: HTTP 200 та []. Відсутній одиничний зв''язок: HTTP 404.'
      parameters:
      - name: discordId
        in: query
        description: Discord ID користувача.
        schema:
          type: string
      - name: robloxId
        in: query
        description: Roblox ID користувача.
        schema:
          type: string
      - name: discordIds
        in: query
        description: Декілька Discord ID через кому.
        schema:
          type: string
      - name: robloxIds
        in: query
        description: Декілька Roblox ID через кому.
        schema:
          type: string
      responses:
        '200':
          description: Успішна відповідь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersLookupResponse'
              examples:
                single:
                  value:
                    robloxId: '123456789'
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: Зв'язок не знайдено при одиночному GET.
      security:
      - ApiKeyHeader: []
    post:
      tags:
      - API Верифікації
      summary: Пакетний Пошук Зв'язок (Batch)
      description: 'Пакетний пошук користувачів через тіло запиту JSON. Ідентифікатори передавайте рядками: числові
        Discord snowflake втрачають точність у JavaScript. GET з одним singular-параметром повертає об''єкт; plural-параметри
        та POST завжди повертають масив. Відсутні зв''язки у batch пропускаються, порядок не гарантований. Порожній
        batch: HTTP 200 та []. Відсутній одиничний зв''язок: HTTP 404.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discordIds:
                  type: array
                  items:
                    type: string
                robloxIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Успішна відповідь.
          content:
            application/json:
              schema:
                type: array
                items: &id005
                  type: object
                  properties:
                    discordId: &id001
                      type: string
                    robloxId: *id001
                  required:
                  - discordId
                  - robloxId
              examples:
                batch:
                  value:
                  - discordId: '123456789012345678'
                    robloxId: '123456789'
                emptyBatch:
                  value: []
        '404':
          description: Зв'язок не знайдено при одиночному GET.
      security:
      - ApiKeyHeader: []
  /cdn/manifest:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - CDN Ассети
      summary: Маніфест Файлів Сховища
      description: 'Знімок metadata namespace: success, count, domain, assets. Максимум 10 000 ассетів; для повного
        великого каталогу використовуйте GET пагінацію /cdn/assets.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Простір імен. `default` - наш загальний або домен клієнта.
        schema:
          type: string
        example: acme
      responses:
        '200':
          description: Список ассет простору імен.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  domain:
                    type: string
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/CdnAsset'
              examples:
                manifest_ok:
                  summary: Manifest ok
                  value:
                    success: true
                    count: 1
                    domain: default
                    assets:
                    - name: Инструкция
                      slug: manual.png
                      domain: default
                      path: docs/manual.png
                      fullPath: default/docs/manual.png
                      full_path: default/docs/manual.png
                      folderId: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      folder_id: 0199a1b7-033e-7e99-b1f2-6be98f4b2b1d
                      sourceType: LOCAL
                      source_type: LOCAL
                      sourceUrl: default/docs/manual.png
                      source_url: default/docs/manual.png
                      isPinned: true
                      is_pinned: 1
                      mimeType: image/png
                      mime_type: image/png
                      size: 70
                      sha256: c2153f77e11087fcb078ae38527fa83bef29791e3700e30cc87fec4405a66d0f
                      downloads: 0
                      createdAt: '2026-10-06T14:56:09.0798434Z'
                      created_at: '2026-10-06T14:56:09.0798434Z'
                      updatedAt: '2026-10-06T14:56:09.0798434Z'
                      updated_at: '2026-10-06T14:56:09.0798434Z'
                      folder:
                        name: Документы
                        slug: docs
        '401':
          description: Unauthorized (401) - ключ не передано.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: Forbidden (403) - ключ є, але недостатньо правий.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: Ліміт запитів вичерпано. Враховуйте Retry-After та retry_after; не запускайте необмежені
            паралельні завантаження.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
                retry_after: 30
                details:
                  count: 21
                  excess: 1
                  limit: 20
                  reset_at: 1792083600000
  /cdn/assets:
    parameters:
    - name: teamId
      in: query
      description: Optional; must equal the API key organization.
      schema:
        type: string
    get:
      tags:
      - CDN Ассети
      summary: Список Ассетів
      description: 'Без path: assets, pagination, stats, success. З точним path без ids та prefix: asset, success.
        limit за замовчуванням 50, максимум 100. totalPages щонайменше 1 навіть для порожнього результату.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Простір імен (перший сегмент шляху файлу).
        schema:
          type: string
        example: acme
      - name: path
        in: query
        required: false
        description: Точний шлях ассета усередині простору імен.
        schema:
          type: string
        example: branding/logo.png
      - name: prefix
        in: query
        required: false
        description: Префікс шляху для вибірки групи файлів.
        schema:
          type: string
        example: branding/
      - name: folderId
        in: query
        required: false
        description: 'ID папки UI. Папка – лише візуальне угруповання, на шлях файлу не впливає.

          `root` або `null` - файли без папки, `all` - без фільтра.'
        schema:
          type: string
        example: root
      - name: search
        in: query
        required: false
        description: Пошук по імені, слагу та повному шляху.
        schema:
          type: string
      - name: sourceType
        in: query
        required: false
        description: Фільтр на кшталт джерела.
        schema:
          type: string
          enum:
          - LOCAL
          - EXTERNAL
          - all
      - name: isPinned
        in: query
        required: false
        description: Фільтр із закріплення.
        schema:
          type: boolean
      - name: page
        in: query
        required: false
