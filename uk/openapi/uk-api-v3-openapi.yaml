        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Список запитаних ключів (масив чи об'єкт при одночасному запиті api та websocket).
