  /keys:
    get:
      tags:
      - API Ключів
      summary: Отримання Ключів та Обмежень
      description: "Універсальний ендпоінт для отримання списку API та WebSocket токенів, а також їх обмежень.\n\
        Для виконання запиту потрібно передати один із query-параметрів `api=true` або `websocket=true`.\nЩоб увімкнути\
        \ обмеження прав для ключа, передайте параметр `restrictions=true` після відповідного типу (наприклад, `?api=true&restrictions=true`\
        \ або `?api=true&restrictions=true&websocket=true&restrictions=true`).\n Відповідь містить секретні ключі\
        \ власника, включаючи інші сервери. Не викликайте з браузерної програми та не логуйте відповідь. Масив restrictions\
        \ відображає явно дозволені записи, а чи не повну ефективну політику доступу."
      parameters:
      - name: api
        in: query
        description: Запросити список HTTP API токенів
        schema:
          type: boolean
        example: true
      - name: websocket
        in: query
        description: Запитати список WebSocket токенів
        schema:
          type: boolean
        example: true
      - name: restrictions
        in: query
        description: Включити обмеження прав (вказується після api або websocket)
        schema:
          type: boolean
        example: true
      security:
      - ApiKeyHeader: []
      - WebSocketKeyHeader: []
      - ApiKeyHeader: []
        WebSocketKeyHeader: []
      responses:
        '200':
          description: Список запитаних ключів (масив чи об'єкт при одночасному запиті api та websocket).
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ApiKeyItem'
                - type: array
                  items:
                    $ref: '#/components/schemas/WebSocketKeyItem'
                - type: object
                  properties:
                    api:
                      type: array
                      items:
                        $ref: '#/components/schemas/ApiKeyItem'
                    websocket:
                      type: array
                      items:
                        $ref: '#/components/schemas/WebSocketKeyItem'
              examples:
                api_only:
                  summary: Запит тільки ключів API (?api=true&restrictions=true)
                  value:
                  - id: '1'
                    key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                    userId: '403258784102940682'
                    serverId: srv_8f9a2b1c4e
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      endpoints:
                      - erlc.server
                      - civops.economy
                      versions:
                      - v3
                      queryParams:
                      - Players
                      - Staff
                      actions:
                      - webhook:add
                      - logs:read
                websocket_only:
                  summary: Запит тільки ключів WebSocket (?websocket=true&restrictions=true)
                  value:
                  - id: '1'
                    key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                    userId: '403258784102940682'
                    serverId: srv_3d5e7f9a1b
                    isActive: true
                    createdAt: '2026-09-01T12:00:00.000Z'
                    restrictions:
                      channels:
                      - server:players
                      - server:logs
                      blockedIPs: []
                both:
                  summary: Запит обох типів (?api=true&websocket=true)
                  value:
                    api:
                    - id: '1'
                      key: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      apiKey: xK9mX2pL4vQ7wZ0sA3dF8gH1-srv_8f9a2b1c4e
                      userId: '403258784102940682'
                      serverId: srv_8f9a2b1c4e
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
                    websocket:
                    - id: '1'
                      key: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      apiKey: ws_vN9mK2pL8xQ4wZ1sA7dF0gH3-srv_3d5e7f9a1b
                      userId: '403258784102940682'
                      serverId: srv_3d5e7f9a1b
                      isActive: true
                      createdAt: '2026-09-01T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
