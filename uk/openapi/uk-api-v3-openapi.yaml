  /cdn/assets/purge:
    post:
      tags:
      - CDN Ассети
      summary: Скидання кешу файлів
      description: 'Скидає кеш файлів за `ids`, `path` або `prefix`; без них — усього простору. `success` означає, що скидання прийняте, а не завершене.


        Без ids/path/prefix очищення всього namespace виконується у фоні: HTTP 202, status=queued, acceptedCount — кількість вибраних об’єктів, а не завершених. Один запит на хвилину на
        команду та namespace; при 429 враховуйте Retry-After. Результат записується в аудит API. Точкове очищення зберігає HTTP 200 і purgedCount. Нові унікальні URL релізу зазвичай не потребують
        purge одразу після завантаження: це видаляє прогрітий кеш.'
      security:
      - ApiKeyHeader: []
      parameters:
      - name: domain
        in: query
        required: false
        description: Пространство имён.
        schema:
          type: string
      - name: path
        in: query
        required: false
        description: Точный путь ассета.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: Список ID ассетов. Передаётся только в теле запроса, не в query.
                  items:
                    type: string
            example:
              ids:
              - ast_7Kq2Zp
      responses:
        '200':
          description: Кеш скинутий.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - path
                    - ids
                    - prefix
                  purgedCount:
                    type: integer
              examples:
                purge_ok:
                  summary: Purge ok
                  value:
                    success: true
                    domain: default
                    scope: ids
                    purgedCount: 1
        '401':
          description: Unauthorized (401) - ключ не передано.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '403':
          description: Forbidden (403) - ключ є, але недостатньо правий.
          content:
            application/json:
              examples:
                missing_token:
                  summary: Missing token
                  value:
                    code: 5007
                    message: Missing Token
        '429':
          description: Ліміт запитів вичерпано. Враховуйте Retry-After; не запускайте необмежені паралельні завантаження.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                code: 5016
                message: Rate Limit Exceeded
        '202':
          description: 'Без ids/path/prefix очищення всього namespace виконується у фоні: HTTP 202, status=queued, acceptedCount — кількість вибраних об’єктів, а не завершених. Один запит
            на хвилину на команду та namespace; при 429 враховуйте Retry-After. Результат записується в аудит API. Точкове очищення зберігає HTTP 200 і purgedCount. Нові унікальні URL релізу
            зазвичай не потребують purge одразу після завантаження: це видаляє прогрітий кеш.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  domain:
                    type: string
                  scope:
                    type: string
                    enum:
                    - domain
                  status:
                    type: string
                    enum:
                    - queued
                  acceptedCount:
                    type: integer
